<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>J Vazquez · Contador de visitas</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Segoe UI', Roboto, Arial, sans-serif;
            background: linear-gradient(145deg, #f0f4fa 0%, #d9e2ec 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .card {
            background: #ffffff;
            padding: 2.5rem 3rem;
            border-radius: 28px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.08), 0 6px 12px rgba(0, 0, 0, 0.05);
            text-align: center;
            max-width: 450px;
            width: 90%;
        }
        h1 {
            font-size: 2.6rem;
            font-weight: 700;
            color: #1a2a3a;
            letter-spacing: -0.5px;
            margin-bottom: 0.25rem;
        }
        .subtitle {
            color: #5b6f82;
            font-size: 1rem;
            margin-bottom: 1.8rem;
            border-bottom: 2px solid #eef3f8;
            padding-bottom: 1rem;
        }
        .url-box {
            background: #f8fafc;
            border-radius: 16px;
            padding: 0.8rem 1rem;
            margin: 1.5rem 0 1rem;
            word-break: break-all;
            border: 1px solid #e2e8f0;
        }
        .url-box a {
            color: #1a73e8;
            text-decoration: none;
            font-weight: 500;
        }
        .url-box a:hover {
            text-decoration: underline;
        }
        .footnote {
            margin-top: 1.2rem;
            font-size: 0.75rem;
            color: #8a9aa8;
        }
        .visitor-counter {
            display: inline-block;
            background: #f0f4fa;
            padding: 0.6rem 1.8rem;
            border-radius: 60px;
            margin-bottom: 0.5rem;
        }
        .visitor-counter span {
            font-size: 1.4rem;
        }
        #contador {
            font-weight: 700;
            font-size: 2rem;
            color: #0b2b4a;
            margin: 0 4px;
        }
        .visitor-counter .label {
            color: #3d5a73;
            font-weight: 600;
            font-size: 0.9rem;
            letter-spacing: 1px;
        }
    </style>
</head>
<body>
    <div class="card">
        <h1>J Vazquez</h1>
        <div class="subtitle">Album J Vazquez</div>

        <!-- ===== CONTADOR ===== -->
        <div class="visitor-counter">
            <span id="contador">Cargando...</span>
            <span class="label">Visitas</span>
        </div>
    </div>

    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>

    <script>
        // ========== CONFIGURACIÓN DE FIREBASE ==========
        const firebaseConfig = {
            apiKey: "AIzaSyC5R9mPw1PQMjYIqWpz5w3W7BvGmZV4tX8",
            authDomain: "kerim-music-a9c46.firebaseapp.com",
            projectId: "kerim-music-a9c46",
            storageBucket: "kerim-music-a9c46.firebasestorage.app",
            messagingSenderId: "103691719997",
            appId: "1:103691719997:web:da58ff98f78f1b632b19cb"
        };
        // ===============================================

        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();

        // ========== CONTADOR GLOBAL (documento fijo "Jvazquez") ==========
        (function() {
            const contadorElement = document.getElementById('contador');
            const DOCUMENTO_ID = 'Jvazquez';  // ← Único documento para todo el sitio
            const counterRef = db.collection('Albunes').doc(DOCUMENTO_ID);

            // Identificador único del dispositivo (se guarda en localStorage)
            function getUserId() {
                let userId = localStorage.getItem('visitor_id_jvazquez');
                if (!userId) {
                    userId = 'user_' + Date.now() + '_' + Math.random().toString(36).substr(2, 9);
                    localStorage.setItem('visitor_id_jvazquez', userId);
                }
                return userId;
            }

            const userId = getUserId();
            const userRef = counterRef.collection('usuarios').doc(userId);

            function actualizarContador(count) {
                if (contadorElement) {
                    contadorElement.textContent = count;
                }
            }

            // 1. Mostrar valor en caché (si existe)
            let cachedCount = localStorage.getItem('visitor_count_global');
            if (cachedCount !== null) {
                actualizarContador(parseInt(cachedCount));
            } else {
                actualizarContador(0);
            }

            // 2. Obtener valor real de Firestore (y crear el documento si no existe)
            counterRef.get()
                .then(doc => {
                    if (doc.exists) {
                        const val = doc.data().total || 0;
                        localStorage.setItem('visitor_count_global', val);
                        actualizarContador(val);
                    } else {
                        // Crear el documento con total = 0
                        counterRef.set({ total: 0 });
                    }
                })
                .catch(error => {
                    console.error('Error al obtener contador:', error);
                });

            // 3. Verificar si el usuario ya ha visitado (usuario nuevo → incrementar)
            userRef.get()
                .then(doc => {
                    if (!doc.exists) {
                        // Incrementar el contador global
                        counterRef.update({
                            total: firebase.firestore.FieldValue.increment(1)
                        }).then(() => {
                            // Registrar el usuario
                            userRef.set({
                                fecha: new Date().toISOString(),
                                userAgent: navigator.userAgent.slice(0, 100)
                            });
                            // Leer el nuevo valor y actualizar caché
                            counterRef.get().then(snap => {
                                if (snap.exists) {
                                    const newVal = snap.data().total || 0;
                                    localStorage.setItem('visitor_count_global', newVal);
                                    actualizarContador(newVal);
                                }
                            });
                        }).catch(error => {
                            console.error('Error al registrar usuario:', error);
                        });
                    }
                })
                .catch(error => {
                    console.error('Error al verificar usuario:', error);
                });

            // 4. Escuchar cambios en tiempo real (cuando otro usuario visita)
            counterRef.onSnapshot((doc) => {
                if (doc.exists) {
                    const val = doc.data().total || 0;
                    localStorage.setItem('visitor_count_global', val);
                    actualizarContador(val);
                }
            });

        })();
    </script>
</body>
</html>
