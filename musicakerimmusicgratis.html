<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes, viewport-fit=cover">
  <title>Kerim Music+ · Royal Blue</title>
  <!-- Preconexiones para acelerar recursos externos -->
  <link rel="preconnect" href="https://www.dropbox.com" crossorigin>
  <link rel="dns-prefetch" href="https://www.dropbox.com">
  <link rel="preconnect" href="https://www.gstatic.com" crossorigin>
  <link rel="dns-prefetch" href="https://www.gstatic.com">
  <link rel="preconnect" href="https://firestore.googleapis.com" crossorigin>
  <link rel="dns-prefetch" href="https://firestore.googleapis.com">
  <style>
    /* ===== ESTILOS OPTIMIZADOS ===== */
    *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
    body{background-color:#0a0e1a;color:#e8ecf4;font-family:'Inter',system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,sans-serif;line-height:1.4;overflow-x:hidden;width:100%}
    .top-bar{background:#0a0e1a;padding:.5rem 1rem;position:sticky;top:0;z-index:100;display:flex;align-items:center;justify-content:center;gap:.75rem;flex-wrap:wrap;border-bottom:1px solid #1a2a5e}
    .top-bar h1{font-weight:700;font-size:1.5rem;background:linear-gradient(135deg,#2b6df6,#1a4fd6);-webkit-background-clip:text;background-clip:text;color:transparent;letter-spacing:-.5px;white-space:nowrap;text-shadow:0 0 20px rgba(43,109,246,.3)}
    .filter-buttons{display:flex;justify-content:center;gap:1rem;margin:.5rem auto 1rem;padding:0 1rem;flex-wrap:wrap}
    .filter-main-btn{background:#111a33;border:1px solid #1a2a5e;border-radius:500px;padding:.55rem 1.5rem;font-size:.85rem;font-weight:600;cursor:pointer;transition:all .2s ease;color:#7a9ad6;letter-spacing:.3px}
    .filter-main-btn.active{background:#1a4fd6;color:#fff;border-color:#2b6df6;box-shadow:0 0 30px rgba(43,109,246,.25)}
    .filter-main-btn:hover:not(.active){background:#1a2a5e;transform:scale(1.02);color:#e8ecf4}
    .gallery-section{max-width:1400px;margin:.5rem auto;padding:0 1rem 6rem;position:relative}
    .counter-wrapper{display:flex;justify-content:center;align-items:center;margin:.5rem auto 1rem;padding:4px 16px;background:rgba(10,14,26,.8);border-radius:500px;width:fit-content;gap:.5rem;border:1px solid #1a2a5e}
    .counter-wrapper.hidden-counter{display:none}
    .counter-label{font-size:.7rem;font-weight:500;letter-spacing:1px;color:#2b6df6}
    #contador{color:#888;font-weight:600;background:#1a1a1a;padding:.2rem 1rem;border-radius:20px;font-size:.8rem;display:inline-block;min-width:80px}
    .top-artists-section{margin-bottom:2rem;padding:0}
    .top-artists-section.hidden-artists{display:none}
    .artists-horizontal{display:flex;gap:1.5rem;overflow-x:auto;scrollbar-width:thin;padding-bottom:.75rem;-webkit-overflow-scrolling:touch;justify-content:flex-start}
    .artists-horizontal::-webkit-scrollbar{height:4px;background:#111a33}
    .artists-horizontal::-webkit-scrollbar-thumb{background:#2b6df6;border-radius:10px}
    .artist-circle-card{flex:0 0 auto;display:flex;flex-direction:column;align-items:center;gap:.5rem;cursor:pointer;transition:all .2s ease;width:90px}
    .artist-circle-card:hover{transform:translateY(-4px)}
    .artist-circle-card:hover .artist-avatar{box-shadow:0 0 0 3px #2b6df6}
    .artist-avatar{width:80px;height:80px;border-radius:50%;object-fit:cover;border:2px solid #1a2a5e;transition:all .2s ease;background:#0d162b}
    .artist-name{font-size:.75rem;font-weight:600;text-align:center;color:#e8ecf4;max-width:90px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .artist-plays{font-size:.55rem;color:#5a7fc7}
    .sort-chips-container{display:flex;flex-wrap:nowrap;overflow-x:auto;overflow-y:hidden;gap:.8rem;margin:.5rem auto 1.5rem;padding:.25rem .3rem .6rem;scrollbar-width:thin;-webkit-overflow-scrolling:touch;justify-content:flex-start;width:100%;white-space:nowrap}
    .sort-chips-container::-webkit-scrollbar{height:3px;background:#111a33;border-radius:10px}
    .sort-chips-container::-webkit-scrollbar-thumb{background:#2b6df6;border-radius:10px}
    .chip-sort{flex:0 0 auto;background:#111a33;border:1px solid #1a2a5e;border-radius:500px;padding:.55rem 1.3rem;font-size:.75rem;font-weight:600;cursor:pointer;transition:all .2s ease;color:#7a9ad6;letter-spacing:.3px;white-space:nowrap}
    .chip-sort.active{background:#1a4fd6;color:#fff;border-color:#2b6df6;box-shadow:0 0 20px rgba(43,109,246,.2)}
    .chip-sort:hover:not(.active){background:#1a2a5e;transform:scale(1.02);color:#e8ecf4}
    .random-matte-bg{position:fixed;top:0;left:0;width:100%;height:100%;z-index:-2;transition:background-color .8s cubic-bezier(.2,.9,.4,1.1);pointer-events:none}
    .random-matte-bg::after{content:'';position:absolute;top:0;left:0;width:100%;height:100%;background:radial-gradient(circle at 20% 40%,rgba(43,109,246,.08) 0%,rgba(0,0,0,.6) 100%);pointer-events:none}

    /* ===== NUEVA GALERÍA: 3 COLUMNAS, SOLO PORTADAS ===== */
    .gallery-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 0.5rem;
      opacity: 0;
      animation: fadeUp .3s forwards;
    }

    .image-card {
      background: transparent;
      border: none;
      border-radius: 0;
      overflow: hidden;
      cursor: pointer;
      transition: transform 0.2s ease;
    }

    .image-card:hover {
      transform: scale(1.02);
    }

    .image-card img {
      width: 100%;
      aspect-ratio: 1 / 1;
      object-fit: cover;
      display: block;
      background: #0d162b;
    }

    /* ===== FIN NUEVA GALERÍA ===== */

    .suggestions-section{margin-bottom:2rem;padding:0}
    .suggestions-horizontal{display:flex;gap:1rem;overflow-x:auto;scrollbar-width:thin;padding-bottom:.75rem;-webkit-overflow-scrolling:touch}
    .suggestions-horizontal::-webkit-scrollbar{height:4px;background:#111a33}
    .suggestions-horizontal::-webkit-scrollbar-thumb{background:#2b6df6;border-radius:10px}
    .suggestion-card{flex:0 0 160px;background:#0d162b;border-radius:8px;overflow:hidden;cursor:pointer;transition:all .2s ease;border:1px solid #1a2a5e}
    .suggestion-card:hover{background:#1a2a5e;transform:translateY(-4px);box-shadow:0 8px 30px rgba(43,109,246,.15)}
    .suggestion-card img{width:100%;aspect-ratio:1/1;object-fit:cover;display:block}
    .suggestion-info{padding:.6rem .5rem;text-align:left}
    .suggestion-title{font-size:.75rem;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:#e8ecf4;margin-bottom:4px}
    .suggestion-badge{font-size:.55rem;color:#2b6df6;display:inline-block;padding:2px 8px;border-radius:20px;background:rgba(43,109,246,.12)}
    .suggestion-invite{font-size:.6rem;color:#5a7fc7;margin-top:4px;display:flex;align-items:center;gap:4px}
    .no-results{text-align:center;padding:3rem;color:#5a7fc7;background:rgba(13,22,43,.9);border-radius:8px;border:1px solid #1a2a5e}
    .search-badge{font-size:.8rem;color:#5a7fc7;margin-bottom:1rem;padding-left:.5rem}

    /* ===== REPRODUCTOR CON GESTO DE ARRASTRE ===== */
    .fullscreen-player {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(10, 14, 26, 0.95);
      backdrop-filter: blur(0);
      z-index: 3000;
      display: flex;
      align-items: center;
      justify-content: center;
      opacity: 0;
      visibility: hidden;
      transition: opacity 0.3s ease, visibility 0.3s ease;
      overflow-y: auto;
      padding: 1rem;
      pointer-events: none; /* para que el fondo no capture eventos */
    }

    .fullscreen-player.show {
      opacity: 1;
      visibility: visible;
      pointer-events: auto;
    }

    .player-card {
      background: transparent;
      border: none;
      max-width: 500px;
      width: 100%;
      margin: 0 auto;
      transform: translateY(0);
      transition: transform 0.3s cubic-bezier(0.2, 0.9, 0.4, 1), opacity 0.3s ease;
      pointer-events: auto; /* para capturar eventos de arrastre */
      touch-action: none; /* evitar scroll nativo durante arrastre */
      position: relative;
    }

    /* El fondo del reproductor se oscurece con el arrastre */
    .fullscreen-player.dragging {
      transition: none;
    }

    /* Resto de estilos del reproductor sin cambios */
    .player-cover{width:min(70vw,280px);max-width:280px;margin:0 auto 1.5rem;border-radius:8px;overflow:hidden;box-shadow:0 8px 30px rgba(0,0,0,.5),0 0 60px rgba(43,109,246,.08);border:1px solid #1a2a5e;background:#0a0e1a;min-height:200px;display:flex;align-items:center;justify-content:center;position:relative}
    .player-cover img{width:100%;aspect-ratio:1/1;object-fit:cover;display:block}
    .player-cover .video-wrapper{width:100%;aspect-ratio:16/9;background:#000;display:flex;align-items:center;justify-content:center}
    .player-cover .video-wrapper iframe{width:100%;height:100%;border:none}
    .song-details{text-align:center;margin-bottom:1rem}
    .song-details h2{font-size:clamp(1rem,5vw,1.3rem);font-weight:700;letter-spacing:-.3px;margin-bottom:.3rem;color:#e8ecf4}
    .song-category{color:#2b6df6;font-size:.75rem;font-weight:500}
    .fav-shuffle-row{display:flex;justify-content:center;align-items:center;gap:1.5rem;margin-top:.8rem}
    .ctrl-btn.shuffle-btn-player{background:0 0;border:none;width:44px;height:44px;border-radius:50%;font-size:1.2rem;cursor:pointer;transition:.2s;color:#5a7fc7;display:inline-flex;align-items:center;justify-content:center}
    .ctrl-btn.shuffle-btn-player.active{color:#2b6df6}
    .ctrl-btn.shuffle-btn-player:hover{color:#e8ecf4;transform:scale(1.05)}
    .progress-area{width:100%;margin:1.5rem 0}
    .time-row{display:flex;justify-content:space-between;font-size:.7rem;color:#5a7fc7;margin-bottom:5px}
    .progress-bar-bg{width:100%;height:4px;background:#111a33;border-radius:2px;cursor:pointer}
    .progress-fill{width:0%;height:100%;background:#2b6df6;border-radius:2px;box-shadow:0 0 15px rgba(43,109,246,.3)}
    .controls{display:flex;align-items:center;justify-content:center;gap:1.5rem;margin:1rem 0}
    .ctrl-btn{background:0 0;border:none;width:48px;height:48px;border-radius:50%;font-size:1.2rem;cursor:pointer;transition:all .2s ease;color:#5a7fc7;display:inline-flex;align-items:center;justify-content:center}
    .ctrl-btn:hover{color:#e8ecf4;transform:scale(1.05)}
    .ctrl-btn.play-pause{width:64px;height:64px;background:#1a4fd6;color:#fff;font-size:1.8rem;box-shadow:0 0 40px rgba(43,109,246,.25)}
    .ctrl-btn.play-pause:hover{background:#2b6df6;transform:scale(1.05);color:#fff}
    .ctrl-btn.hidden-nav{visibility:hidden;pointer-events:none}
    .player-suggestions{margin-top:1.5rem}
    .player-suggestions-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:.8rem}
    .player-suggestions-title{font-size:.75rem;font-weight:600;color:#5a7fc7;letter-spacing:.5px}
    .toggle-suggestions-btn{background:0 0;border:1px solid #1a2a5e;border-radius:500px;padding:.25rem .8rem;font-size:.6rem;cursor:pointer;color:#5a7fc7;transition:all .2s ease}
    .toggle-suggestions-btn:hover{border-color:#2b6df6;color:#e8ecf4}
    .player-suggestions-track{display:flex;gap:.8rem;overflow-x:auto;scrollbar-width:thin;padding-bottom:.6rem;transition:opacity .2s ease}
    .player-suggestions-track.hidden-suggestions{display:none}
    .player-suggestion-item{flex:0 0 min(22vw,100px);min-width:80px;background:#0d162b;border-radius:8px;cursor:pointer;transition:all .2s ease;text-align:center;overflow:hidden;border:1px solid #1a2a5e}
    .player-suggestion-item:hover{background:#1a2a5e;transform:translateY(-4px);box-shadow:0 8px 25px rgba(43,109,246,.1)}
    .player-suggestion-img{width:100%;aspect-ratio:1/1;object-fit:cover;display:block}
    .player-suggestion-info{padding:.4rem .2rem}
    .player-suggestion-title{font-size:.6rem;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:#e8ecf4}
    .player-suggestion-plays{font-size:.45rem;color:#5a7fc7}
    .mini-player{position:fixed;bottom:0;left:0;right:0;background:#0a0e1a;border-top:1px solid #1a2a5e;padding:.75rem 1rem;display:flex;align-items:center;gap:12px;transform:translateY(100%);transition:transform .3s ease;z-index:1200;cursor:pointer}
    .mini-player.show{transform:translateY(0)}
    .mini-cover{width:48px;height:48px;border-radius:4px;overflow:hidden;flex-shrink:0;border:1px solid #1a2a5e;background:#0a0e1a}
    .mini-cover img{width:100%;height:100%;object-fit:cover}
    .mini-info{flex:1;min-width:0}
    .mini-title{font-weight:600;font-size:.85rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:#e8ecf4}
    .mini-controls{display:flex;gap:8px;flex-shrink:0}
    .mini-btn{background:0 0;border:none;width:36px;height:36px;border-radius:50%;font-size:.9rem;cursor:pointer;color:#5a7fc7}
    .mini-btn:hover{color:#e8ecf4}
    .mini-btn.hidden-nav{display:none}
    .mini-progress-bg{position:absolute;top:0;left:0;right:0;height:3px;background:#111a33}
    .mini-progress-fill{width:0%;height:100%;background:#2b6df6;box-shadow:0 0 15px rgba(43,109,246,.3)}
    .welcome-modal{position:fixed;inset:0;background:rgba(10,14,26,.95);backdrop-filter:blur(8px);z-index:5000;display:flex;align-items:center;justify-content:center;transition:.3s}
    .welcome-modal.hidden{opacity:0;visibility:hidden;pointer-events:none}
    .welcome-card{background:#0d162b;border-radius:8px;padding:2rem 1.5rem;text-align:center;max-width:320px;width:85%;border:1px solid #1a2a5e}
    .welcome-card h2{color:#2b6df6;margin-bottom:.5rem}
    .accept-btn{background:#1a4fd6;color:#fff;border:none;padding:.8rem 2rem;border-radius:500px;font-weight:700;margin-top:1rem;cursor:pointer;transition:.2s;box-shadow:0 0 30px rgba(43,109,246,.15)}
    .accept-btn:hover{transform:scale(1.02);background:#2b6df6}
    .attribution{text-align:center;margin-top:2rem;font-size:.6rem;color:#3a4a6a}
    .toast-notification{position:fixed;bottom:80px;left:50%;transform:translateX(-50%) translateY(100px);background:#0d162b;color:#e8ecf4;padding:12px 24px;border-radius:500px;border:1px solid #2b6df6;box-shadow:0 8px 30px rgba(0,0,0,.6),0 0 40px rgba(43,109,246,.05);z-index:6000;opacity:0;transition:all .4s ease;font-size:.85rem;font-weight:500;max-width:90%;text-align:center;pointer-events:none}
    .toast-notification.show{opacity:1;transform:translateX(-50%) translateY(0)}
    .plan-badge{display:inline-block;background:#1a4fd6;color:#fff;font-size:.55rem;font-weight:700;padding:2px 10px;border-radius:500px;margin-left:6px;letter-spacing:.5px}
    .plan-badge.locked{background:#1a2a5e;color:#3a4a6a}
    .ad-badge{display:inline-block;background:#ff5500;color:#fff;font-size:.55rem;font-weight:700;padding:2px 8px;border-radius:4px;margin-left:6px;letter-spacing:.5px}
    @media(max-width:480px){.top-bar h1{font-size:1.2rem}.artist-avatar{width:65px;height:65px}.artist-circle-card{width:75px}.suggestion-card{flex:0 0 130px}}
    @keyframes fadeUp{0%{opacity:0;transform:translateY(10px)}100%{opacity:1;transform:translateY(0)}}
  </style>
</head>
<body>
<div class="random-matte-bg" id="randomMatteBg"></div>

<div class="welcome-modal" id="welcomeModal">
  <div class="welcome-card"><h2>Kerim Music+</h2><p style="color:#5a7fc7">Disfruta tu música</p><button class="accept-btn" id="acceptWelcomeBtn">COMENZAR</button></div>
</div>

<div class="toast-notification" id="toastNotification">💎 Solo disponible en Kerim Music+</div>

<header class="top-bar">
  <h1>Kerim Music+ <span class="plan-badge" id="planBadge">FREE</span></h1>
</header>

<div class="filter-buttons">
  <button class="filter-main-btn active" data-view="home">Inicio</button>
</div>

<main class="gallery-section">
  <div class="counter-wrapper" id="counterWrapper">
    <span class="counter-label">VISITAS</span>
    <span id="contador">0</span>
  </div>

  <div class="top-artists-section" id="topArtistsSection">
    <div class="artists-horizontal" id="artistsContainer"></div>
  </div>

  <div id="sortChipsContainer" class="sort-chips-container" style="display:none">
    <button class="chip-sort" data-sort="default">Por defecto</button>
    <button class="chip-sort" data-sort="lastFirst">Más recientes</button>
    <button class="chip-sort" data-sort="firstFirst">Más antiguas</button>
  </div>
  <div id="searchBadge" class="search-badge"></div>
  <div id="suggestionsContainer" class="suggestions-section"></div>
  <div id="contentContainer"></div>
  <div class="attribution">Kerim Music+ · Stream your vibe</div>
</main>

<!-- ===== REPRODUCTOR SIN BOTÓN DE CERRAR ===== -->
<div class="fullscreen-player" id="fullscreenPlayer">
  <div class="player-card" id="playerCard">
    <div class="player-cover" id="playerCover">
      <img id="fullCover" src="https://i.postimg.cc/XNP1xdB2/IMG-20260207-WA0000.jpg" alt="cover" loading="lazy">
      <div id="videoContainer" style="display:none;width:100%;aspect-ratio:16/9;background:#000"></div>
    </div>
    <div class="song-details">
      <h2 id="fullSongTitle">Kerim Music</h2>
      <div class="song-category" id="fullSongCategory"></div>
      <div class="fav-shuffle-row">
        <button class="ctrl-btn shuffle-btn-player" id="shuffleBtnPlayer">🔀</button>
      </div>
    </div>
    <div class="progress-area" id="progressArea">
      <div class="time-row"><span id="currentTime">0:00</span><span id="durationTime">0:00</span></div>
      <div class="progress-bar-bg" id="progressBarBg"><div class="progress-fill" id="progressFill"></div></div>
    </div>
    <div class="controls">
      <button class="ctrl-btn" id="fullPrevBtn">⏮</button>
      <button class="ctrl-btn play-pause" id="fullPlayPauseBtn">▶</button>
      <button class="ctrl-btn" id="fullNextBtn">⏭</button>
    </div>
    <div class="player-suggestions" id="playerSuggestions">
      <div class="player-suggestions-header">
        <div class="player-suggestions-title">🎧 Temas relacionados</div>
        <button class="toggle-suggestions-btn" id="toggleSuggestionsBtn">Ocultar</button>
      </div>
      <div class="player-suggestions-track" id="playerSuggestionsTrack"></div>
    </div>
  </div>
</div>

<div class="mini-player" id="miniPlayer">
  <div class="mini-cover" id="miniCoverContainer"><img id="miniCover" src="https://i.postimg.cc/XNP1xdB2/IMG-20260207-WA0000.jpg" alt="mini cover" loading="lazy"></div>
  <div class="mini-info"><div class="mini-title" id="miniTitle">Selecciona</div></div>
  <div class="mini-controls">
    <button class="mini-btn" id="miniPrevBtn">⏮</button>
    <button class="mini-btn" id="miniPlayPauseBtn">▶</button>
    <button class="mini-btn" id="miniNextBtn">⏭</button>
  </div>
  <div class="mini-progress-bg"><div class="mini-progress-fill" id="miniProgressFill"></div></div>
</div>

<!-- ========== FIREBASE MODULE ========== -->
<script type="importmap">
  {
    "imports": {
      "firebase/app": "https://www.gstatic.com/firebasejs/9.23.0/firebase-app.js",
      "firebase/firestore": "https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore.js"
    }
  }
</script>

<script type="module">
  import { initializeApp } from "firebase/app";
  import { getFirestore, doc, getDoc, setDoc, runTransaction } from "firebase/firestore";

  const firebaseConfig = {
    apiKey: "AIzaSyC5R9mPw1PQMjYIqWpz5w3W7BvGmZV4tX8",
    authDomain: "kerim-music-a9c46.firebaseapp.com",
    projectId: "kerim-music-a9c46",
    storageBucket: "kerim-music-a9c46.firebasestorage.app",
    messagingSenderId: "103691719997",
    appId: "1:103691719997:web:da58ff98f78f1b632b19cb"
  };

  const app = initializeApp(firebaseConfig);
  const db = getFirestore(app);
  const contadorRef = doc(db, "Radio Muisc", "Kerim Music+");
  const CAMPO_CONTADOR = "total";
  const contadorSpan = document.getElementById("contador");

  let userId = localStorage.getItem('visitor_id_kerim');
  if (!userId) {
    userId = 'user_' + Date.now() + '_' + Math.random().toString(36).substr(2, 9);
    localStorage.setItem('visitor_id_kerim', userId);
  }
  const userRef = doc(contadorRef, 'usuarios', userId);

  const playCache = new Map();

  async function obtenerValorGlobal() {
    try {
      const docSnap = await getDoc(contadorRef);
      return docSnap.exists() ? docSnap.data()[CAMPO_CONTADOR] || 0 : 0;
    } catch (e) { return 0; }
  }

  async function actualizarInterfazGlobal() {
    const valor = await obtenerValorGlobal();
    if (contadorSpan) contadorSpan.textContent = valor;
  }

  async function inicializarContadorGlobal() {
    await actualizarInterfazGlobal();
    try {
      const userSnap = await getDoc(userRef);
      if (!userSnap.exists()) {
        await runTransaction(db, async (transaction) => {
          const docSnap = await transaction.get(contadorRef);
          const nuevoTotal = (docSnap.exists() ? docSnap.data()[CAMPO_CONTADOR] : 0) + 1;
          if (!docSnap.exists()) transaction.set(contadorRef, { [CAMPO_CONTADOR]: nuevoTotal });
          else transaction.update(contadorRef, { [CAMPO_CONTADOR]: nuevoTotal });
        });
        await setDoc(userRef, { 
          fecha: new Date().toISOString(), 
          userAgent: navigator.userAgent.slice(0, 200), 
          canciones_escuchadas: {} 
        });
        await actualizarInterfazGlobal();
      }
    } catch (error) { console.error("Error al registrar usuario:", error); }
  }

  const TRES_MESES_MS = 3 * 30 * 24 * 60 * 60 * 1000;

  async function migrarSiEsArray(userData) {
    const historial = userData.canciones_escuchadas;
    if (Array.isArray(historial)) {
      const nuevoMap = {};
      const ahora = Date.now();
      historial.forEach(id => { nuevoMap[id] = ahora; });
      await setDoc(userRef, { canciones_escuchadas: nuevoMap }, { merge: true });
      return nuevoMap;
    }
    return historial || {};
  }

  window.incrementarReproduccion = async function(songId) {
    if (!songId) return null;
    if (playCache.has(songId)) {
      return playCache.get(songId);
    }

    try {
      const userSnap = await getDoc(userRef);
      if (!userSnap.exists()) {
        await setDoc(userRef, { 
          fecha: new Date().toISOString(), 
          userAgent: navigator.userAgent.slice(0, 200), 
          canciones_escuchadas: {} 
        });
      }

      const userData = (await getDoc(userRef)).data() || {};
      let historial = await migrarSiEsArray(userData);
      const ahora = Date.now();
      const fechaExpiracion = ahora - TRES_MESES_MS;

      let resultado = null;

      await runTransaction(db, async (transaction) => {
        const songRef = doc(db, "Radio Muisc", String(songId));
        const songSnap = await transaction.get(songRef);
        let currentPlays = songSnap.exists() ? songSnap.data().reproducciones || 0 : 0;

        const lastPlayed = historial[songId] || 0;
        let incrementar = false;

        if (lastPlayed === 0 || lastPlayed < fechaExpiracion) {
          incrementar = true;
          if (lastPlayed > 0) {
            currentPlays = Math.max(0, currentPlays - 1);
            delete historial[songId];
          }
        }

        if (incrementar) {
          currentPlays += 1;
          historial[songId] = ahora;
        } else {
          historial[songId] = ahora;
        }

        const idsAEliminar = [];
        for (const [id, timestamp] of Object.entries(historial)) {
          if (id !== songId && timestamp < fechaExpiracion) {
            idsAEliminar.push(id);
          }
        }

        for (const id of idsAEliminar) {
          delete historial[id];
          const ref = doc(db, "Radio Muisc", String(id));
          const snap = await transaction.get(ref);
          if (snap.exists()) {
            const plays = snap.data().reproducciones || 0;
            transaction.update(ref, { reproducciones: Math.max(0, plays - 1) });
          }
        }

        transaction.update(userRef, { canciones_escuchadas: historial });

        if (!songSnap.exists()) {
          transaction.set(songRef, { reproducciones: currentPlays });
        } else {
          transaction.update(songRef, { reproducciones: currentPlays });
        }

        resultado = currentPlays;
        playCache.set(songId, resultado);
      });

      return resultado;
    } catch (error) {
      console.error("Error en incrementarReproduccion:", error);
      return null;
    }
  };

  window.obtenerReproducciones = async function(songId) {
    if (playCache.has(songId)) {
      return playCache.get(songId);
    }
    try {
      const ref = doc(db, "Radio Muisc", String(songId));
      const docSnap = await getDoc(ref);
      const count = docSnap.exists() ? docSnap.data().reproducciones || 0 : 0;
      playCache.set(songId, count);
      return count;
    } catch (error) {
      return 0;
    }
  };

  document.addEventListener("DOMContentLoaded", () => {
    inicializarContadorGlobal();
  });
</script>

    function shuffleArray(arr) {
      const array = [...arr];
      for (let i = array.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [array[i], array[j]] = [array[j], array[i]];
      }
      return array;
    }

    function escapeHtml(str){ return str ? str.replace(/[&<>]/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[m] || m)) : ''; }

    async function precargarAudio(song) {
      if (!song || !song.music) return;
      if (preloadSong && preloadSong.id === song.id) return;
      
      try {
        const cache = await getAudioCache();
        if (cache) {
          const response = await cache.match(song.music);
          if (response) {
            preloadAudio.src = song.music;
            preloadAudio.load();
            preloadSong = song;
            return;
          }
        }
        const response = await fetch(song.music);
        if (response.ok) {
          const clonedResponse = response.clone();
          if (cache) {
            cache.put(song.music, clonedResponse);
          }
          preloadAudio.src = song.music;
          preloadAudio.load();
          preloadSong = song;
        } else {
          preloadAudio.src = song.music;
          preloadAudio.load();
          preloadSong = song;
        }
      } catch (e) {
        preloadAudio.src = song.music;
        preloadAudio.load();
        preloadSong = song;
      }
    }

    function playAds(callback) {
      if (ADS.length === 0 || isAdPlaying) {
        if (callback) callback();
        return;
      }
      isAdPlaying = true;
      let shuffledAds = shuffleArray([...ADS]);

    // ==================== REPRODUCIR CANCIONES ====================
    function playSong(song, customQueue = null) {
      if (!song) return;
      if (isAdPlaying) return;
      if (!song.isAd) {
        adCounter++;
        if (adCounter >= 3) {
          adCounter = 0;
          pendingNextSong = song;
          playAds(function() {
            if (pendingNextSong) {
              const nextSong = pendingNextSong;
              pendingNextSong = null;
              playSongInternal(nextSong, customQueue);
            }
          });
          return;
        }
      }
      playSongInternal(song, customQueue);
    }

    async function playSongInternal(song, customQueue = null) {
      if (!song) return;
      if (isAdPlaying) return;
      
      if (pendingCount) {
        pendingCount = false;
        pendingSongId = null;
      }
      
      currentSong = song;
      
      hideVideoFromPlayer();
      if (progressArea) progressArea.style.display = 'block';
      
      if (!song.isAd) {
        pendingCount = true;
        pendingSongId = song.id;
        if (fullSongCategory) fullSongCategory.innerHTML = song.category || '';
      } else {
        pendingCount = false;
        pendingSongId = null;
      }
      
      if (customQueue) {
        currentPlayQueue = customQueue;
        if (shuffleActive) {
          originalQueue = [...customQueue];
          const currentSongId = song.id;
          let queueWithoutCurrent = customQueue.filter(s => s.id !== currentSongId);
          let shuffledWithoutCurrent = shuffleArray(queueWithoutCurrent);
          currentPlayQueue = [song, ...shuffledWithoutCurrent];
          currentQueueIndex = 0;
        } else {
          currentQueueIndex = currentPlayQueue.findIndex(s => s.id === song.id);
        }
      } else {
        updateQueueAndMode();
        let idx = currentPlayQueue.findIndex(s => s.id === song.id);
        if (idx !== -1) currentQueueIndex = idx;
      }
      
      if (song.music) {
        if (preloadSong && preloadSong.id === song.id && preloadAudio.src) {
          audio.src = preloadAudio.src;
        } else {
          try {
            const cache = await getAudioCache();
            if (cache) {
              const response = await cache.match(song.music);
              if (response) {
                const blob = await response.blob();
                const url = URL.createObjectURL(blob);
                audio.src = url;
                audio.onloadeddata = () => URL.revokeObjectURL(url);
              } else {
                audio.src = song.music;
              }
            } else {
              audio.src = song.music;
            }
          } catch (e) {
            audio.src = song.music;
          }
        }
        audio.play().catch(e => console.log('Error al reproducir:', e));
        isPlaying = true;
        schedulePreloadNext();
      } else {
        audio.pause();
        isPlaying = false;
      }
      
      updateUIWithSong(song);
      if (fullPlayer) fullPlayer.classList.add('show');
      if (miniPlayerDiv) miniPlayerDiv.classList.add('show');
      updatePlayPauseIcon();
      triggerBackgroundRefresh();
      renderPlayerSuggestions();
      renderContent();
    }

    function updateUIWithSong(song){ 
      if (!song) return;
      hideVideoFromPlayer();
      if (fullCover) fullCover.src = song.url; 
      if (fullSongTitle) fullSongTitle.innerText = song.title; 
      if (!song.isAd && fullSongCategory) {
        fullSongCategory.innerHTML = song.category || '';
      }
      if (miniCover) miniCover.src = song.url; 
      if (miniTitle) miniTitle.innerText = song.title; 
      renderPlayerSuggestions(); 
    }

    function updatePlayPauseIcon(){ 
      if (isVideoAd) {
        if (fullPlayPause) fullPlayPause.style.display = 'none';
        if (miniPlayPause) miniPlayPause.style.display = 'none';
        return;
      }
      if (fullPlayPause) fullPlayPause.style.display = 'flex';
      if (miniPlayPause) miniPlayPause.style.display = 'flex';
      const icon = isPlaying ? '⏸' : '▶'; 
      if (fullPlayPause) fullPlayPause.innerText = icon; 
      if (miniPlayPause) miniPlayPause.innerText = icon; 
    }

    function nextTrack(){ 
      if (isAdPlaying) return;
      if (!currentPlayQueue.length) return; 
      let newIdx = (currentQueueIndex + 1) % currentPlayQueue.length; 
      currentQueueIndex = newIdx; 
      playSong(currentPlayQueue[newIdx]); 
    }

    function prevTrack(){ 
      if (isAdPlaying) return;
      if (!currentPlayQueue.length) return; 
      let newIdx = (currentQueueIndex - 1 + currentPlayQueue.length) % currentPlayQueue.length; 
      currentQueueIndex = newIdx; 
      playSong(currentPlayQueue[newIdx]); 
    }

    function togglePlayPause(){ 
      if (isAdPlaying) {
        if (isVideoAd && videoElement) {
          if (videoElement.paused) videoElement.play();
          else videoElement.pause();
        }
        return;
      }
      isPlaying ? audio.pause() : audio.play(); 
    }

    // ==================== SUGERENCIAS ====================
    function renderSuggestions(){ 
      if (!suggestionsContainer) return;
      if(isPlaylistsMode || currentSearch.trim() !== '') { 
        suggestionsContainer.innerHTML = ''; 
        return; 
      } 
      const leastPlayed = getLeastPlayedSuggestions(6); 
      if(leastPlayed.length === 0){ suggestionsContainer.innerHTML = ''; return; } 
      let html = `<div class="suggestions-horizontal">`; 
      leastPlayed.forEach(song => { 
        html += `<div class="suggestion-card" data-id="${song.id}"><img src="${song.url}" loading="lazy" alt="${escapeHtml(song.title)}"><div class="suggestion-info"><div class="suggestion-title">${escapeHtml(song.title)}</div><div class="suggestion-badge">${song.category}</div></div></div>`; 
      }); 
      html += `</div>`; 
      suggestionsContainer.innerHTML = html; 
      document.querySelectorAll('.suggestion-card').forEach(card => { 
        card.addEventListener('click', () => { 
          const id = card.dataset.id; 
          const found = masterSongs.find(s => s.id === id) || allSongs.find(s => s.id === id); 
          if(found){ updateQueueAndMode(); playSong(found); } 
        }); 
      }); 
    }

    // ==================== SUGERENCIAS DEL REPRODUCTOR ====================
    let suggestionsHidden = false;

    function getPlayerSuggestions(currentSongObj, limit = 6) {
      if (!currentSongObj) return [];
      const sameArtist = masterSongs.filter(s => s.id !== currentSongObj.id && ((s.artist && currentSongObj.artist) && s.artist.toLowerCase() === currentSongObj.artist.toLowerCase()));
      const others = masterSongs.filter(s => s.id !== currentSongObj.id && !sameArtist.includes(s));
      let combined = [...sameArtist, ...others];
      return combined.slice(0, limit);
    }

    function renderPlayerSuggestions() {
      const suggestionsTrack = document.getElementById('playerSuggestionsTrack');
      const toggleBtn = document.getElementById('toggleSuggestionsBtn');
      if (!suggestionsTrack) return;
      if (!currentSong) { suggestionsTrack.innerHTML = ''; return; }
      const suggestions = getPlayerSuggestions(currentSong);
      if (suggestions.length === 0) { 
        suggestionsTrack.innerHTML = '<div style="color:#5a7fc7; text-align:center; font-size:0.7rem;">No hay sugerencias disponibles</div>'; 
        return; 
      }
      let html = '';
      suggestions.forEach(song => {
        html += `<div class="player-suggestion-item" data-id="${song.id}"><img class="player-suggestion-img" src="${song.url}" loading="lazy" alt="${escapeHtml(song.title)}"><div class="player-suggestion-info"><div class="player-suggestion-title">${escapeHtml(song.title.length > 12 ? song.title.substring(0,10)+'...' : song.title)}</div></div></div>`;
      });
      suggestionsTrack.innerHTML = html;
      if (suggestionsHidden) { 
        suggestionsTrack.classList.add('hidden-suggestions'); 
        if(toggleBtn) toggleBtn.innerText = 'Mostrar'; 
      } else { 
        suggestionsTrack.classList.remove('hidden-suggestions'); 
        if(toggleBtn) toggleBtn.innerText = 'Ocultar'; 
      }
      document.querySelectorAll('#playerSuggestionsTrack .player-suggestion-item').forEach(item => { 
        item.addEventListener('click', (e) => { 
          e.stopPropagation(); 
          const id = item.getAttribute('data-id'); 
          const found = masterSongs.find(s => s.id === id) || allSongs.find(s => s.id === id); 
          if(found) { updateQueueAndMode(); playSong(found); } 
        }); 
      });
    }

    function toggleSuggestions() {
      suggestionsHidden = !suggestionsHidden;
      const track = document.getElementById('playerSuggestionsTrack');
      const toggleBtn = document.getElementById('toggleSuggestionsBtn');
      if (track) {
        if (suggestionsHidden) { 
          track.classList.add('hidden-suggestions'); 
          if(toggleBtn) toggleBtn.innerText = 'Mostrar'; 
        } else { 
          track.classList.remove('hidden-suggestions'); 
          if(toggleBtn) toggleBtn.innerText = 'Ocultar'; 
        }
      }
    }

    // ==================== RENDER TOP ARTISTS ====================
    function renderTopArtists() {
      const topArtistsSection = document.getElementById('topArtistsSection');
      const artistsContainer = document.getElementById('artistsContainer');
      if (!topArtistsSection || !artistsContainer) return;
      const shouldShow = (!isPlaylistsMode && currentSearch.trim() === '');
      if (!shouldShow) { topArtistsSection.classList.add('hidden-artists'); return; }
      topArtistsSection.classList.remove('hidden-artists');
      const topArtists = getTopArtists(6);
      if (topArtists.length === 0 || (topArtists.length === 1 && topArtists[0].plays === 0)) {
        artistsContainer.innerHTML = '<div style="color:#5a7fc7; font-size:0.8rem; padding:0.5rem;">Escucha más canciones para ver tus artistas favoritos 🎧</div>';
        return;
      }
      let html = '';
      topArtists.forEach(artist => {
        html += `<div class="artist-circle-card" data-artist="${escapeHtml(artist.name)}"><img class="artist-avatar" src="${artist.image}" loading="lazy" alt="${escapeHtml(artist.name)}"><div class="artist-name">${escapeHtml(artist.name.length > 15 ? artist.name.substring(0,12)+'...' : artist.name)}</div></div>`;
      });
      artistsContainer.innerHTML = html;
    }

    // ==================== RENDER CONTENIDO ====================
    let renderTimeout = null;

    function updateCounterVisibility() { 
      if (!counterWrapper) return;
      if (isPlaylistsMode || currentSearch.trim() !== '') { 
        counterWrapper.classList.add('hidden-counter'); 
      } else { 
        counterWrapper.classList.remove('hidden-counter'); 
      } 
    }

    async function renderContent(){ 
      if (!contentContainer) return;
      if (renderTimeout) cancelAnimationFrame(renderTimeout);
      
      renderTimeout = requestAnimationFrame(async () => {
        updateCounterVisibility(); 
        renderTopArtists();
        const items = getActiveListForQueue();
        const isSearching = currentSearch.trim() !== ''; 
        if (searchBadge) {
          if(isSearching) searchBadge.innerHTML = `🔍 Resultados: "${escapeHtml(currentSearch)}" (${items.length})`; 
          else if(isPlaylistsMode) searchBadge.innerHTML = `❤️ Tus Me gusta · ${items.length} canción${items.length !== 1 ? 'es' : ''}`; 
          else searchBadge.innerHTML = ''; 
        }
        
        if(items.length === 0){ 
          contentContainer.innerHTML = '<div class="no-results"> No se encontraron canciones</div>';
          return; 
        } 
        
        for (let song of items) {
          if (!firestorePlays.has(String(song.id))) {
            const plays = await obtenerReproduccionesFirestore(song.id);
            firestorePlays.set(String(song.id), plays);
          }
        }
        
        // ===== NUEVA GALERÍA: 3 COLUMNAS, SOLO PORTADAS =====
        let html = `<div class="gallery-grid">`;
        items.forEach(song => {
          html += `<div class="image-card" data-id="${song.id}">
                    <img src="${song.url}" loading="lazy" alt="${escapeHtml(song.title)}" decoding="async" fetchpriority="low">
                  </div>`;
        });
        html += `</div>`;
        contentContainer.innerHTML = html;
        
        contentContainer.querySelectorAll('.image-card').forEach(card => { 
          card.addEventListener('click', () => { 
            const id = card.dataset.id; 
            const found = masterSongs.find(s => s.id === id) || allSongs.find(s => s.id === id); 
            if(found){ updateQueueAndMode(); playSong(found); } 
          }); 
        }); 
        triggerBackgroundRefresh();
      });
    }

    // ==================== OBTENER REPRODUCCIONES FIRESTORE ====================
    async function obtenerReproduccionesFirestore(songId) {
      try {
        if (window.obtenerReproducciones) {
          const count = await window.obtenerReproducciones(songId);
          return count || 0;
        }
        return 0;
      } catch (e) {
        return 0;
      }
    }

    // ==================== FILTROS Y ORDEN ====================
    function updateSortChipsVisibility() { 
      if (sortChipsContainer) sortChipsContainer.style.display = 'none'; 
    }

    // ==================== EVENTOS ====================
    const homeBtn = document.querySelector('[data-view="home"]');
    
    if (homeBtn) {
      homeBtn.addEventListener('click', () => {
        homeBtn.classList.add('active');
        isPlaylistsMode = false;
        updateSortChipsVisibility();
        renderContent();
        renderSuggestions();
        updateQueueAndMode();
      });
    }

    // ==================== AUDIO EVENTOS ====================
    let audioUpdateFrame = null;

    audio.addEventListener('timeupdate', () => {
      if (audioUpdateFrame) cancelAnimationFrame(audioUpdateFrame);
      audioUpdateFrame = requestAnimationFrame(() => {
        if(audio.duration && isFinite(audio.duration) && !audio.paused){ 
          let p = (audio.currentTime/audio.duration)*100; 
          if (progressFill) progressFill.style.width = `${p}%`; 
          if (miniProgressFill) miniProgressFill.style.width = `${p}%`; 
          if (currentTimeSpan) currentTimeSpan.innerText = formatTime(audio.currentTime); 
          if (durationSpan && durationSpan.innerText === '0:00') durationSpan.innerText = formatTime(audio.duration); 
        }
      });
    });

    audio.addEventListener('loadedmetadata', () => { 
      if(audio.duration && durationSpan) durationSpan.innerText = formatTime(audio.duration); 
    });

    audio.addEventListener('play', () => { isPlaying = true; updatePlayPauseIcon(); });
    audio.addEventListener('pause', () => { isPlaying = false; updatePlayPauseIcon(); });

    audio.addEventListener('ended', () => {
      if (isAdPlaying) return;
      
      if (pendingCount && pendingSongId === currentSong?.id && !currentSong?.isAd) {
        const songId = pendingSongId;
        incrementPlayCount(songId);
        if (window.incrementarReproduccion) {
          window.incrementarReproduccion(songId)
            .then(nuevoValor => {
              if (nuevoValor !== null) {
                firestorePlays.set(String(songId), nuevoValor);
                renderSuggestions();
                renderTopArtists();
              }
            })
            .catch(e => console.error('Error al incrementar reproducción:', e));
        }
        pendingCount = false;
        pendingSongId = null;
      }
      
      nextTrack();
    });

    // ==================== PROGRESS BAR ====================
    if (progressBarBg) {
      progressBarBg.addEventListener('click', (e) => { 
        if(audio.duration){ 
          let rect = progressBarBg.getBoundingClientRect(); 
          let perc = (e.clientX - rect.left)/rect.width; 
          audio.currentTime = perc * audio.duration; 
        } 
      });
    }

    // ==================== CONTROLES ====================
    if (fullPlayPause) fullPlayPause.addEventListener('click', togglePlayPause);
    if (fullNext) fullNext.addEventListener('click', nextTrack);
    if (fullPrev) fullPrev.addEventListener('click', prevTrack);
    if (miniPlayPause) miniPlayPause.addEventListener('click', togglePlayPause);
    if (miniNext) miniNext.addEventListener('click', nextTrack);
    if (miniPrev) miniPrev.addEventListener('click', prevTrack);

    if (miniPlayerDiv) {
      miniPlayerDiv.addEventListener('click', (e) => { 
        if(!e.target.closest('.mini-btn') && fullPlayer) fullPlayer.classList.add('show'); 
      });
    }

    if (shuffleBtnPlayer) shuffleBtnPlayer.addEventListener('click', toggleShuffle);
    if (toggleSuggestionsBtnElem) toggleSuggestionsBtnElem.addEventListener('click', toggleSuggestions);

    // ==================== WELCOME MODAL ====================
    const welcomeModal = document.getElementById('welcomeModal');
    const acceptBtn = document.getElementById('acceptWelcomeBtn');
    if (localStorage.getItem('kerim_welcome_accepted') === 'true') {
      if (welcomeModal) welcomeModal.classList.add('hidden');
    } else { 
      if (welcomeModal) welcomeModal.classList.remove('hidden'); 
      if (acceptBtn) {
        acceptBtn.addEventListener('click', () => { 
          localStorage.setItem('kerim_welcome_accepted', 'true'); 
          if (welcomeModal) welcomeModal.classList.add('hidden'); 
        }); 
      }
    }

    // ==================== GESTO DE ARRASTRE PARA MINIMIZAR ====================
    let dragState = {
      isDragging: false,
      startY: 0,
      currentY: 0,
      deltaY: 0,
      maxTranslate: 0,
      isMinimizing: false
    };

    // Umbral: 30% de la altura de la ventana
    const THRESHOLD = 0.3;

    function getTranslateY() {
      return parseFloat(playerCard.style.transform.replace('translateY(', '').replace(')', '')) || 0;
    }

    function setTranslateY(value) {
      playerCard.style.transform = `translateY(${value}px)`;
    }

    function resetPlayerPosition() {
      playerCard.style.transition = 'transform 0.3s cubic-bezier(0.2, 0.9, 0.4, 1), opacity 0.3s ease';
      setTranslateY(0);
      fullPlayer.style.background = 'rgba(10, 14, 26, 0.95)';
      // Restaurar opacidad completa
      fullPlayer.style.opacity = '1';
      fullPlayer.style.pointerEvents = 'auto';
    }

    function closePlayer() {
      fullPlayer.classList.remove('show');
      // Resetear para la próxima vez
      resetPlayerPosition();
      // Asegurar que el transform se reinicia
      playerCard.style.transition = 'none';
      setTranslateY(0);
      // Forzar reflow
      void playerCard.offsetHeight;
      playerCard.style.transition = 'transform 0.3s cubic-bezier(0.2, 0.9, 0.4, 1), opacity 0.3s ease';
      fullPlayer.style.background = 'rgba(10, 14, 26, 0.95)';
      fullPlayer.style.opacity = '1';
      fullPlayer.style.pointerEvents = 'auto';
    }

    // Iniciar arrastre
    function onDragStart(e) {
      // Solo si el reproductor está visible
      if (!fullPlayer.classList.contains('show')) return;
      // Evitar que el arrastre se active en botones y elementos interactivos
      const target = e.target;
      if (target.closest('.ctrl-btn') || target.closest('.mini-btn') || 
          target.closest('.toggle-suggestions-btn') || target.closest('.player-suggestion-item') ||
          target.closest('.progress-bar-bg')) {
        return;
      }

      const touch = e.touches ? e.touches[0] : e;
      dragState.isDragging = true;
      dragState.startY = touch.clientY;
      dragState.currentY = touch.clientY;
      dragState.deltaY = 0;
      dragState.isMinimizing = false;
      // Desactivar transición para que el movimiento sea fluido
      playerCard.style.transition = 'none';
      fullPlayer.style.transition = 'none';
      // Añadir clase para desactivar transiciones en el fondo
      fullPlayer.classList.add('dragging');
      // Prevenir scroll en la página
      e.preventDefault();
    }

    function onDragMove(e) {
      if (!dragState.isDragging) return;
      const touch = e.touches ? e.touches[0] : e;
      dragState.currentY = touch.clientY;
      dragState.deltaY = dragState.currentY - dragState.startY;
      // Solo permitir arrastre hacia abajo (deltaY > 0)
      if (dragState.deltaY < 0) {
        // Si el usuario arrastra hacia arriba, no movemos y resetamos
        return;
      }

      // Limitar el desplazamiento máximo a un 80% de la altura de la ventana
      const maxY = window.innerHeight * 0.8;
      const delta = Math.min(dragState.deltaY, maxY);
      setTranslateY(delta);

      // Cambiar opacidad del fondo según el desplazamiento
      const progress = delta / (window.innerHeight * THRESHOLD);
      const opacity = Math.max(0, 1 - progress);
      // Aplicar opacidad al fondo del reproductor
      fullPlayer.style.background = `rgba(10, 14, 26, ${opacity * 0.95})`;
      // También podemos atenuar la visibilidad del contenido (opcional)
      // playerCard.style.opacity = Math.max(0.2, 1 - progress * 0.5);

      e.preventDefault();
    }

    function onDragEnd(e) {
      if (!dragState.isDragging) return;
      dragState.isDragging = false;
      fullPlayer.classList.remove('dragging');

      // Calcular si se superó el umbral
      const thresholdPx = window.innerHeight * THRESHOLD;
      if (dragState.deltaY > thresholdPx) {
        // Minimizar (cerrar)
        closePlayer();
      } else {
        // Regresar a la posición original
        resetPlayerPosition();
        fullPlayer.style.transition = 'opacity 0.3s ease, visibility 0.3s ease';
        // Restaurar fondo
        fullPlayer.style.background = 'rgba(10, 14, 26, 0.95)';
        fullPlayer.style.opacity = '1';
        // Asegurar que el transform vuelve a 0 con transición
        playerCard.style.transition = 'transform 0.3s cubic-bezier(0.2, 0.9, 0.4, 1), opacity 0.3s ease';
        setTranslateY(0);
      }

      // Limpiar referencias
      dragState.startY = 0;
      dragState.currentY = 0;
      dragState.deltaY = 0;
      e.preventDefault();
    }

    // Agregar eventos de arrastre al player-card
    if (playerCard) {
      // Touch events
      playerCard.addEventListener('touchstart', onDragStart, { passive: false });
      playerCard.addEventListener('touchmove', onDragMove, { passive: false });
      playerCard.addEventListener('touchend', onDragEnd, { passive: false });
      // Mouse events (para escritorio)
      playerCard.addEventListener('mousedown', onDragStart);
      document.addEventListener('mousemove', onDragMove);
      document.addEventListener('mouseup', onDragEnd);
    }

    // ==================== INICIALIZACIÓN FINAL ====================
    updateUIPlan();
    changeBackgroundRandomly();
    startBackgroundInterval();
    isPlaylistsMode = false; 
    currentSearch = '';
    updateSortChipsVisibility();
    
    renderContent().then(() => {
      renderSuggestions(); 
      updateQueueAndMode(); 
      renderTopArtists();
      if(masterSongs.length) currentSong = masterSongs[0];
      audio.volume = 0.9;
      if (currentSong && currentSong.music) {
        precargarAudio(currentSong);
      }
    });

    window.addEventListener('beforeunload', () => {
      if (bgInterval) clearInterval(bgInterval);
      if (bgTimeout) clearTimeout(bgTimeout);
      if (audioUpdateFrame) cancelAnimationFrame(audioUpdateFrame);
      if (renderTimeout) cancelAnimationFrame(renderTimeout);
      audio.pause();
      audio.src = '';
      preloadAudio.pause();
      preloadAudio.src = '';
      preloadAdAudio.pause();
      preloadAdAudio.src = '';
      // Eliminar event listeners de mouse para evitar fugas
      document.removeEventListener('mousemove', onDragMove);
      document.removeEventListener('mouseup', onDragEnd);
    });

    console.log('🎵 Kerim Music+ Optimizado con precarga y caché');
    console.log('⚡ Reproducción ultra fluida sin cortes');
    console.log('👆 Arrastra el reproductor hacia abajo para minimizar');
    
  })();
</script>
</body>
</html>
