<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes, viewport-fit=cover">
  <title>Kerim Music+ · Royal Blue</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }
    body {
      background-color: #0a0e1a;
      color: #e8ecf4;
      font-family: 'Inter', system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, sans-serif;
      line-height: 1.4;
      overflow-x: hidden;
      width: 100%;
    }
    .top-bar {
      background: #0a0e1a;
      padding: 0.5rem 1rem;
      position: sticky;
      top: 0;
      z-index: 100;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.75rem;
      flex-wrap: wrap;
      border-bottom: 1px solid #1a2a5e;
    }
    .top-bar h1 {
      font-weight: 700;
      font-size: 1.5rem;
      background: linear-gradient(135deg, #2b6df6, #1a4fd6);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      letter-spacing: -0.5px;
      white-space: nowrap;
      text-shadow: 0 0 20px rgba(43, 109, 246, 0.3);
    }
    .filter-buttons {
      display: flex;
      justify-content: center;
      gap: 1rem;
      margin: 0.5rem auto 1rem auto;
      padding: 0 1rem;
      flex-wrap: wrap;
    }
    .filter-main-btn {
      background: #111a33;
      border: 1px solid #1a2a5e;
      border-radius: 500px;
      padding: 0.55rem 1.5rem;
      font-size: 0.85rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s ease;
      color: #7a9ad6;
      letter-spacing: 0.3px;
    }
    .filter-main-btn.active {
      background: #1a4fd6;
      color: #ffffff;
      border-color: #2b6df6;
      box-shadow: 0 0 30px rgba(43, 109, 246, 0.25);
    }
    .filter-main-btn:hover:not(.active) {
      background: #1a2a5e;
      transform: scale(1.02);
      color: #e8ecf4;
    }
    .gallery-section {
      max-width: 1400px;
      margin: 0.5rem auto;
      padding: 0 1rem 6rem;
      position: relative;
    }
    .counter-wrapper {
      display: flex;
      justify-content: center;
      align-items: center;
      margin: 0.5rem auto 1rem auto;
      padding: 4px 16px;
      background: rgba(10, 14, 26, 0.8);
      border-radius: 500px;
      width: fit-content;
      gap: 0.5rem;
      border: 1px solid #1a2a5e;
    }
    .counter-wrapper.hidden-counter { display: none; }
    .counter-label {
      font-size: 0.7rem;
      font-weight: 500;
      letter-spacing: 1px;
      color: #2b6df6;
    }
    .upgrade-banner {
      display: flex;
      justify-content: center;
      margin: 0.5rem auto 1.5rem auto;
    }
    .upgrade-btn {
      display: inline-flex;
      align-items: center;
      gap: 0.6rem;
      background: linear-gradient(135deg, #1a4fd6, #2b6df6);
      color: #ffffff;
      font-weight: 700;
      font-size: 1rem;
      padding: 0.7rem 2rem;
      border-radius: 500px;
      text-decoration: none;
      letter-spacing: 0.5px;
      border: 1px solid rgba(255,255,255,0.15);
      box-shadow: 0 0 30px rgba(43, 109, 246, 0.25);
      transition: all 0.3s ease;
      cursor: pointer;
    }
    .upgrade-btn:hover {
      transform: scale(1.04);
      box-shadow: 0 0 50px rgba(43, 109, 246, 0.4);
      background: linear-gradient(135deg, #2b6df6, #1a4fd6);
    }
    .upgrade-btn:active {
      transform: scale(0.96);
    }
    .top-artists-section {
      margin-bottom: 2rem;
      padding: 0;
    }
    .top-artists-section.hidden-artists { display: none; }
    .artists-horizontal {
      display: flex;
      gap: 1.5rem;
      overflow-x: auto;
      scrollbar-width: thin;
      padding-bottom: 0.75rem;
      -webkit-overflow-scrolling: touch;
      justify-content: flex-start;
    }
    .artists-horizontal::-webkit-scrollbar {
      height: 4px;
      background: #111a33;
    }
    .artists-horizontal::-webkit-scrollbar-thumb {
      background: #2b6df6;
      border-radius: 10px;
    }
    .artist-circle-card {
      flex: 0 0 auto;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.5rem;
      cursor: pointer;
      transition: all 0.2s ease;
      width: 90px;
    }
    .artist-circle-card:hover {
      transform: translateY(-4px);
    }
    .artist-circle-card:hover .artist-avatar {
      box-shadow: 0 0 0 3px #2b6df6;
    }
    .artist-avatar {
      width: 80px;
      height: 80px;
      border-radius: 50%;
      object-fit: cover;
      border: 2px solid #1a2a5e;
      transition: all 0.2s ease;
      background: #0d162b;
    }
    .artist-name {
      font-size: 0.75rem;
      font-weight: 600;
      text-align: center;
      color: #e8ecf4;
      max-width: 90px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .artist-plays {
      font-size: 0.55rem;
      color: #5a7fc7;
    }
    .sort-chips-container {
      display: flex;
      flex-wrap: nowrap;
      overflow-x: auto;
      overflow-y: hidden;
      gap: 0.8rem;
      margin: 0.5rem auto 1.5rem auto;
      padding: 0.25rem 0.3rem 0.6rem 0.3rem;
      scrollbar-width: thin;
      -webkit-overflow-scrolling: touch;
      justify-content: flex-start;
      width: 100%;
      white-space: nowrap;
    }
    .sort-chips-container::-webkit-scrollbar {
      height: 3px;
      background: #111a33;
      border-radius: 10px;
    }
    .sort-chips-container::-webkit-scrollbar-thumb {
      background: #2b6df6;
      border-radius: 10px;
    }
    .chip-sort {
      flex: 0 0 auto;
      background: #111a33;
      border: 1px solid #1a2a5e;
      border-radius: 500px;
      padding: 0.55rem 1.3rem;
      font-size: 0.75rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s ease;
      color: #7a9ad6;
      letter-spacing: 0.3px;
      white-space: nowrap;
    }
    .chip-sort.active {
      background: #1a4fd6;
      color: #ffffff;
      border-color: #2b6df6;
      box-shadow: 0 0 20px rgba(43, 109, 246, 0.2);
    }
    .chip-sort:hover:not(.active) {
      background: #1a2a5e;
      transform: scale(1.02);
      color: #e8ecf4;
    }
    .random-matte-bg {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: -2;
      transition: background-color 0.8s cubic-bezier(0.2, 0.9, 0.4, 1.1);
      pointer-events: none;
    }
    .random-matte-bg::after {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: radial-gradient(circle at 20% 40%, rgba(43,109,246,0.08) 0%, rgba(0,0,0,0.6) 100%);
      pointer-events: none;
    }
    .portada-fija {
      width: 100%;
      border-radius: 12px;
      overflow: hidden;
      margin: 0.5rem 0 1.5rem 0;
      background: #0a0e1a;
      box-shadow: 0 4px 30px rgba(0,0,0,0.6), 0 0 40px rgba(43,109,246,0.05);
    }
    .portada-track {
      display: flex;
      gap: 0.75rem;
      overflow-x: auto;
      scroll-snap-type: x mandatory;
      scroll-behavior: smooth;
      padding: 0.75rem 0.5rem;
      -webkit-overflow-scrolling: touch;
      scrollbar-width: thin;
    }
    .portada-track::-webkit-scrollbar {
      height: 4px;
      background: #111a33;
    }
    .portada-track::-webkit-scrollbar-thumb {
      background: #2b6df6;
      border-radius: 10px;
    }
    .portada-item {
      flex: 0 0 80%;
      max-width: 80%;
      scroll-snap-align: start;
      border-radius: 10px;
      overflow: hidden;
      background: #0d162b;
      transition: transform 0.2s ease;
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      border: 1px solid #1a2a5e;
    }
    .portada-item a {
      display: block;
      width: 100%;
      height: 100%;
      text-decoration: none;
      position: relative;
    }
    .portada-item img {
      width: 100%;
      height: auto;
      aspect-ratio: auto;
      object-fit: contain;
      display: block;
      transition: transform 0.3s ease;
      background: #0a0e1a;
    }
    .portada-item:hover img {
      transform: scale(1.02);
    }
    .portada-caption {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      background: linear-gradient(transparent, rgba(10,14,26,0.85));
      padding: 1rem 0.8rem 0.6rem;
      color: #e8ecf4;
      font-size: 0.8rem;
      font-weight: 500;
      letter-spacing: 0.3px;
      pointer-events: none;
    }
    @media (min-width: 640px) {
      .portada-item { flex: 0 0 55%; max-width: 55%; }
    }
    @media (min-width: 1024px) {
      .portada-item { flex: 0 0 32%; max-width: 32%; }
    }
    .gallery-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 1rem;
      opacity: 0;
      animation: fadeUp 0.4s forwards;
    }
    .gallery-grid.list-view {
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
    }
    .gallery-grid.list-view .image-card {
      display: flex;
      flex-direction: row;
      align-items: center;
      gap: 1rem;
      padding: 0.5rem;
      border-radius: 8px;
      background: rgba(17, 26, 51, 0.95);
      border: 1px solid #1a2a5e;
    }
    .gallery-grid.list-view .image-card img {
      width: 48px;
      height: 48px;
      border-radius: 4px;
      aspect-ratio: 1/1;
      flex-shrink: 0;
    }
    .gallery-grid.list-view .card-title {
      flex: 1;
      text-align: left;
      white-space: normal;
      background: transparent;
      border: none;
      padding: 0;
      font-size: 0.85rem;
      font-weight: 500;
      color: #e8ecf4;
    }
    .suggestions-section {
      margin-bottom: 2rem;
      padding: 0;
    }
    .suggestions-horizontal {
      display: flex;
      gap: 1rem;
      overflow-x: auto;
      scrollbar-width: thin;
      padding-bottom: 0.75rem;
      -webkit-overflow-scrolling: touch;
    }
    .suggestions-horizontal::-webkit-scrollbar {
      height: 4px;
      background: #111a33;
    }
    .suggestions-horizontal::-webkit-scrollbar-thumb {
      background: #2b6df6;
      border-radius: 10px;
    }
    .suggestion-card {
      flex: 0 0 160px;
      background: #0d162b;
      border-radius: 8px;
      overflow: hidden;
      cursor: pointer;
      transition: all 0.2s ease;
      border: 1px solid #1a2a5e;
    }
    .suggestion-card:hover {
      background: #1a2a5e;
      transform: translateY(-4px);
      box-shadow: 0 8px 30px rgba(43,109,246,0.15);
    }
    .suggestion-card img {
      width: 100%;
      aspect-ratio: 1 / 1;
      object-fit: cover;
      display: block;
    }
    .suggestion-info {
      padding: 0.6rem 0.5rem;
      text-align: left;
    }
    .suggestion-title {
      font-size: 0.75rem;
      font-weight: 600;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      color: #e8ecf4;
      margin-bottom: 4px;
    }
    .suggestion-badge {
      font-size: 0.55rem;
      color: #2b6df6;
      display: inline-block;
      padding: 2px 8px;
      border-radius: 20px;
      background: rgba(43,109,246,0.12);
    }
    .suggestion-invite {
      font-size: 0.6rem;
      color: #5a7fc7;
      margin-top: 4px;
      display: flex;
      align-items: center;
      gap: 4px;
    }
    .image-card {
      background: #0d162b;
      border-radius: 8px;
      overflow: hidden;
      cursor: pointer;
      transition: all 0.25s ease;
      display: flex;
      flex-direction: column;
      border: 1px solid #1a2a5e;
    }
    .image-card:hover {
      background: #1a2a5e;
      transform: translateY(-4px);
      box-shadow: 0 8px 30px rgba(43,109,246,0.1);
    }
    .image-card img {
      width: 100%;
      aspect-ratio: 1 / 1;
      object-fit: cover;
      transition: transform 0.3s ease;
      display: block;
    }
    .image-card:hover img {
      transform: scale(1.02);
    }
    .card-title {
      padding: 0.75rem 0.5rem;
      text-align: left;
      font-size: 0.8rem;
      font-weight: 600;
      color: #e8ecf4;
      background: transparent;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    @media (min-width: 500px) {
      .gallery-grid:not(.list-view) { grid-template-columns: repeat(3, 1fr); gap: 1rem; }
    }
    @media (min-width: 640px) {
      .gallery-grid:not(.list-view) { grid-template-columns: repeat(4, 1fr); }
    }
    @media (min-width: 900px) {
      .gallery-grid:not(.list-view) { grid-template-columns: repeat(5, 1fr); }
    }
    @media (min-width: 1200px) {
      .gallery-grid:not(.list-view) { grid-template-columns: repeat(6, 1fr); }
    }
    .no-results {
      text-align: center;
      padding: 3rem;
      color: #5a7fc7;
      background: rgba(13,22,43,0.9);
      border-radius: 8px;
      border: 1px solid #1a2a5e;
    }
    .search-badge {
      font-size: 0.8rem;
      color: #5a7fc7;
      margin-bottom: 1rem;
      padding-left: 0.5rem;
    }
    .fullscreen-player {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: linear-gradient(180deg, #0d162b 0%, #0a0e1a 100%);
      backdrop-filter: blur(0);
      z-index: 3000;
      display: flex;
      align-items: center;
      justify-content: center;
      opacity: 0;
      visibility: hidden;
      transition: all 0.3s ease;
      overflow-y: auto;
      padding: 1rem;
    }
    .fullscreen-player.show { opacity: 1; visibility: visible; }
    .player-card {
      background: transparent;
      border: none;
      max-width: 500px;
      width: 100%;
      margin: 0 auto;
    }
    .player-cover {
      width: min(70vw, 280px);
      max-width: 280px;
      margin: 0 auto 1.5rem auto;
      border-radius: 8px;
      overflow: hidden;
      box-shadow: 0 8px 30px rgba(0,0,0,0.5), 0 0 60px rgba(43,109,246,0.08);
      border: 1px solid #1a2a5e;
      background: #0a0e1a;
      min-height: 200px;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
    }
    .player-cover img { 
      width: 100%; 
      aspect-ratio: 1/1; 
      object-fit: cover; 
      display: block; 
    }
    .player-cover .video-wrapper {
      width: 100%;
      aspect-ratio: 16/9;
      background: #000;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .player-cover .video-wrapper iframe {
      width: 100%;
      height: 100%;
      border: none;
    }
    .song-details {
      text-align: center;
      margin-bottom: 1rem;
    }
    .song-details h2 {
      font-size: clamp(1rem, 5vw, 1.3rem);
      font-weight: 700;
      letter-spacing: -0.3px;
      margin-bottom: 0.3rem;
      color: #e8ecf4;
    }
    .song-category { color: #2b6df6; font-size: 0.75rem; font-weight: 500; }
    .fav-shuffle-row {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 1.5rem;
      margin-top: 0.8rem;
    }
    .fav-btn-player {
      background: transparent;
      border: none;
      width: 44px;
      height: 44px;
      border-radius: 50%;
      font-size: 1.4rem;
      cursor: pointer;
      transition: 0.2s;
      color: #5a7fc7;
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }
    .fav-btn-player.active { color: #2b6df6; }
    .fav-btn-player:hover { color: #e8ecf4; transform: scale(1.05); }
    .fav-btn-player.locked {
      color: #3a4a6a;
      cursor: not-allowed;
      opacity: 0.5;
    }
    .fav-btn-player.locked:hover {
      color: #3a4a6a;
      transform: none;
    }
    .ctrl-btn.shuffle-btn-player {
      background: transparent;
      border: none;
      width: 44px;
      height: 44px;
      border-radius: 50%;
      font-size: 1.2rem;
      cursor: pointer;
      transition: 0.2s;
      color: #5a7fc7;
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }
    .ctrl-btn.shuffle-btn-player.active { color: #2b6df6; }
    .ctrl-btn.shuffle-btn-player:hover { color: #e8ecf4; transform: scale(1.05); }
    .progress-area { width: 100%; margin: 1.5rem 0; }
    .time-row { display: flex; justify-content: space-between; font-size: 0.7rem; color: #5a7fc7; margin-bottom: 5px; }
    .progress-bar-bg {
      width: 100%;
      height: 4px;
      background: #111a33;
      border-radius: 2px;
      cursor: pointer;
    }
    .progress-fill { width: 0%; height: 100%; background: #2b6df6; border-radius: 2px; box-shadow: 0 0 15px rgba(43,109,246,0.3); }
    .controls {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 1.5rem;
      margin: 1rem 0;
    }
    .ctrl-btn {
      background: transparent;
      border: none;
      width: 48px;
      height: 48px;
      border-radius: 50%;
      font-size: 1.2rem;
      cursor: pointer;
      transition: all 0.2s ease;
      color: #5a7fc7;
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }
    .ctrl-btn:hover {
      color: #e8ecf4;
      transform: scale(1.05);
    }
    .ctrl-btn.play-pause {
      width: 64px;
      height: 64px;
      background: #1a4fd6;
      color: #ffffff;
      font-size: 1.8rem;
      box-shadow: 0 0 40px rgba(43,109,246,0.25);
    }
    .ctrl-btn.play-pause:hover {
      background: #2b6df6;
      transform: scale(1.05);
      color: #ffffff;
    }
    .ctrl-btn.hidden-nav {
      visibility: hidden;
      pointer-events: none;
    }
    .close-player {
      position: absolute;
      top: 20px;
      right: 20px;
      background: rgba(10,14,26,0.8);
      width: 40px;
      height: 40px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.1rem;
      cursor: pointer;
      transition: all 0.2s ease;
      color: #5a7fc7;
      border: 1px solid #1a2a5e;
    }
    .close-player:hover {
      color: #e8ecf4;
      transform: scale(1.05);
      border-color: #2b6df6;
    }
    .player-suggestions {
      margin-top: 1.5rem;
    }
    .player-suggestions-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 0.8rem;
    }
    .player-suggestions-title {
      font-size: 0.75rem;
      font-weight: 600;
      color: #5a7fc7;
      letter-spacing: 0.5px;
    }
    .toggle-suggestions-btn {
      background: transparent;
      border: 1px solid #1a2a5e;
      border-radius: 500px;
      padding: 0.25rem 0.8rem;
      font-size: 0.6rem;
      cursor: pointer;
      color: #5a7fc7;
      transition: all 0.2s ease;
    }
    .toggle-suggestions-btn:hover {
      border-color: #2b6df6;
      color: #e8ecf4;
    }
    .player-suggestions-track {
      display: flex;
      gap: 0.8rem;
      overflow-x: auto;
      scrollbar-width: thin;
      padding-bottom: 0.6rem;
      transition: opacity 0.2s ease;
    }
    .player-suggestions-track.hidden-suggestions { display: none; }
    .player-suggestion-item {
      flex: 0 0 min(22vw, 100px);
      min-width: 80px;
      background: #0d162b;
      border-radius: 8px;
      cursor: pointer;
      transition: all 0.2s ease;
      text-align: center;
      overflow: hidden;
      border: 1px solid #1a2a5e;
    }
    .player-suggestion-item:hover {
      background: #1a2a5e;
      transform: translateY(-4px);
      box-shadow: 0 8px 25px rgba(43,109,246,0.1);
    }
    .player-suggestion-img {
      width: 100%;
      aspect-ratio: 1/1;
      object-fit: cover;
      display: block;
    }
    .player-suggestion-info {
      padding: 0.4rem 0.2rem;
    }
    .player-suggestion-title {
      font-size: 0.6rem;
      font-weight: 600;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      color: #e8ecf4;
    }
    .player-suggestion-plays {
      font-size: 0.45rem;
      color: #5a7fc7;
    }
    .mini-player {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      background: #0a0e1a;
      border-top: 1px solid #1a2a5e;
      padding: 0.75rem 1rem;
      display: flex;
      align-items: center;
      gap: 12px;
      transform: translateY(100%);
      transition: transform 0.3s ease;
      z-index: 1200;
      cursor: pointer;

    // ==================== INICIALIZACIÓN ====================
    const shuffledSongs = shuffleArray(originalSongs);

    const allSongs = [...originalSongs];
    
    let playCount = new Map();
    let artistPlayCount = new Map();
    
    // Cargar datos guardados
    try{ 
      let savedCounts = localStorage.getItem('kerim_play_counts');

    // ==================== FUNCIONES DE ESTADO ====================
    function savePlayCounts(){ let obj = {}; for(let [k,v] of playCount.entries()) obj[k] = v; localStorage.setItem('kerim_play_counts', JSON.stringify(obj)); }
    
    function incrementPlayCount(songId){ 
      let song = masterSongs.find(s => s.id === songId) || allSongs.find(s => s.id === songId);
      if(song) {
        let artist = song.artist || 'Artista';
        let newCount = (playCount.get(songId) || 0) + 1;
        playCount.set(songId, newCount);
        artistPlayCount.set(artist, (artistPlayCount.get(artist) || 0) + 1);
        savePlayCounts();
      } else {
        playCount.set(songId, (playCount.get(songId) || 0) + 1);
        savePlayCounts();
      }
    }
    
    function getLeastPlayedSuggestions(limit = 6){ 
      let songsWithCount = masterSongs.map(song => ({...song, plays: playCount.get(song.id) || 0})); 
      songsWithCount.sort((a,b) => a.plays - b.plays); 
      return songsWithCount.slice(0, limit); 
    }
    
    function getTopArtists(limit = 6) {
      let artistsArray = [];
      for (let [artist, plays] of artistPlayCount.entries()) {
        let songByArtist = masterSongs.find(s => (s.artist || 'Artista') === artist);
        let artistImage = songByArtist ? songByArtist.url : 'https://i.postimg.cc/XNP1xdB2/IMG-20260207-WA0000.jpg';
        artistsArray.push({ name: artist, plays: plays, image: artistImage });
      }
      artistsArray.sort((a, b) => b.plays - a.plays);
      return artistsArray.slice(0, limit);
    }
    
    let playlistsSortMode = 'default';
    const savedSortMode = localStorage.getItem('kerim_playlists_sort_mode');
    if (savedSortMode && ['default', 'lastFirst', 'firstFirst'].includes(savedSortMode)) playlistsSortMode = savedSortMode;

    // ==================== REPRODUCCIÓN ====================
    let currentPlayQueue = [], currentQueueIndex = 0, currentSong = null, audio = new Audio(), isPlaying = false, currentSearch = '', shuffleActive = false, originalQueue = [], isPlaylistsMode = false;
    
    // ==================== ELEMENTOS DOM ====================
    const contentContainer = document.getElementById('contentContainer');
    const suggestionsContainer = document.getElementById('suggestionsContainer');

    const fullPlayer = document.getElementById('fullscreenPlayer');
    const miniPlayerDiv = document.getElementById('miniPlayer');

    // ==================== FONDO ====================
    const mattePalette = ['#0a0e1a', '#0d162b', '#111a33', '#0f1428', '#0b1222', '#0e1930', '#0c1528', '#09101e'];
    function getRandomMatteColor() { return mattePalette[Math.floor(Math.random() * mattePalette.length)]; }

    let intervalBg = setInterval(() => changeBackgroundRandomly(), 7000);

    // ==================== SHUFFLE ====================
    function toggleShuffle() {
      shuffleActive = !shuffleActive;
      
      if (shuffleActive) {
        shuffleBtnPlayer.classList.add('active');
        showToast('🔀 Modo Aleatorio Activado', 2000);
        
        if (originalQueue.length === 0 && currentPlayQueue.length > 0) {
          originalQueue = [...currentPlayQueue];
        }
        
        const currentSongId = currentSong ? currentSong.id : null;
        let queueWithoutCurrent = currentPlayQueue.filter(s => s.id !== currentSongId);
        let shuffledWithoutCurrent = shuffleArray(queueWithoutCurrent);
        let newQueue = [];
        
        if (currentSongId && currentPlayQueue.find(s => s.id === currentSongId)) {
          newQueue = [currentSong, ...shuffledWithoutCurrent];
          currentQueueIndex = 0;

          newQueue = shuffledWithoutCurrent;
          currentQueueIndex = 0;
        }
        currentPlayQueue = newQueue;

        if (originalQueue.length > 0) {
          const currentSongId = currentSong ? currentSong.id : null;
          let newIndex = originalQueue.findIndex(s => s.id === currentSongId);
          if (newIndex === -1 && currentSong) newIndex = 0;
          currentPlayQueue = originalQueue;
          currentQueueIndex = newIndex !== -1 ? newIndex : 0;
          originalQueue = [];
        }
      }
    }
    
    // ==================== FUNCIONES DE COLA ====================
    function getActiveListForQueue(){
      let base = [...masterSongs];
      if(currentSearch.trim() !== '') base = base.filter(s=>s.title.toLowerCase().includes(currentSearch.toLowerCase()) || (s.artist && s.artist.toLowerCase().includes(currentSearch.toLowerCase())));
      return base;
    }
    
    function buildBaseQueue(){ return getActiveListForQueue(); }
    
    function updateQueueAndMode(){ 
      const newQueue = buildBaseQueue(); 
      if (shuffleActive) { 
        originalQueue = [...newQueue]; 
        const currentSongId = currentSong ? currentSong.id : null; 
        let queueWithoutCurrent = newQueue.filter(s => s.id !== currentSongId); 
        let shuffledWithoutCurrent = shuffleArray(queueWithoutCurrent); 
        let newQueueShuffled = []; 
        if (currentSongId && newQueue.find(s => s.id === currentSongId)) { 
          newQueueShuffled = [currentSong, ...shuffledWithoutCurrent]; 
          currentQueueIndex = 0; 
        } else { 
          newQueueShuffled = shuffledWithoutCurrent; 
          currentQueueIndex = 0; 
        } 
        currentPlayQueue = newQueueShuffled; 
      } else { 
        currentPlayQueue = newQueue; 
        if(currentSong && currentPlayQueue.findIndex(s=>s.id===currentSong.id) !== -1) currentQueueIndex = currentPlayQueue.findIndex(s=>s.id===currentSong.id); 
        else { 
          currentQueueIndex = 0; 
          if(currentPlayQueue.length) currentSong = currentPlayQueue[0]; 
        } 
      } 
      if(currentPlayQueue.length === 0 && masterSongs.length) { 
        currentPlayQueue = [...masterSongs]; 
        if(shuffleActive) { 
          const currentSongId = currentSong ? currentSong.id : null; 
          let queueWithoutCurrent = currentPlayQueue.filter(s => s.id !== currentSongId); 
          let shuffledWithoutCurrent = shuffleArray(queueWithoutCurrent); 
          if (currentSongId && currentPlayQueue.find(s => s.id === currentSongId)) { 
            currentPlayQueue = [currentSong, ...shuffledWithoutCurrent]; 
            currentQueueIndex = 0; 
          } else { 
            currentPlayQueue = shuffledWithoutCurrent; 
            currentQueueIndex = 0; 
          } 
        } 
      } 
      if(currentPlayQueue.length && !currentSong) currentSong = currentPlayQueue[0]; 
    }
    
    // ==================== FUNCIÓN PARA MOSTRAR VIDEO EN EL REPRODUCTOR ====================
    function showVideoInPlayer(videoHtml) {
      fullCover.style.display = 'none';
      videoContainer.style.display = 'block';
      videoContainer.innerHTML = videoHtml;
      videoContainer.style.width = '100%';
      videoContainer.style.aspectRatio = '16/9';
      videoContainer.style.background = '#000';
      
      const videoEl = videoContainer.querySelector('video');
      const iframeEl = videoContainer.querySelector('iframe');
      
      if (videoEl) {
        videoElement = videoEl;
        isVideoAd = true;
        videoEl.addEventListener('ended', onVideoAdEnd);
        videoEl.play().catch(e => console.log('Error al reproducir video:', e));
        fullPlayPause.style.display = 'none';
        miniPlayPause.style.display = 'none';
        if (progressArea) progressArea.style.display = 'none';
      } else if (iframeEl) {
        isVideoAd = true;
        fullPlayPause.style.display = 'none';
        miniPlayPause.style.display = 'none';
        if (progressArea) progressArea.style.display = 'none';
        const adDuration = 30000;
        if (window._adTimer) clearTimeout(window._adTimer);
        window._adTimer = setTimeout(() => {
          onVideoAdEnd();
        }, adDuration);
      } else {
        isVideoAd = false;
      }
      
      if (progressArea) progressArea.style.display = 'none';
      console.log('🎬 Video mostrado en el reproductor');
    }
    
    function hideVideoFromPlayer() {
      videoContainer.style.display = 'none';
      videoContainer.innerHTML = '';
      fullCover.style.display = 'block';
      if (progressArea) progressArea.style.display = 'block';
      fullPlayPause.style.display = 'flex';
      miniPlayPause.style.display = 'flex';
      if (videoElement) {
        videoElement.removeEventListener('ended', onVideoAdEnd);
        videoElement = null;
      }
      isVideoAd = false;
      if (window._adTimer) {
        clearTimeout(window._adTimer);
        window._adTimer = null;
      }
    }
    
    // ==================== ANUNCIOS ====================
    function playAds(callback) {
      if (ads.length === 0 || isAdPlaying) {
        if (callback) callback();
        return;
      }
      isAdPlaying = true;
      let shuffledAds = shuffleArray([...ads]);
      adPlaylist = shuffledAds.slice(0, Math.min(3, shuffledAds.length));
      currentAdIndex = 0;
      adCallback = callback;
      fullPrev.classList.add('hidden-nav');
      fullNext.classList.add('hidden-nav');
      miniPrev.classList.add('hidden-nav');
      miniNext.classList.add('hidden-nav');
      previousSong = currentSong;
      playNextAd();
    }
    
    function playNextAd() {
      if (currentAdIndex >= adPlaylist.length) {
        finishAdPlaylist();
        return;
      }
      const ad = adPlaylist[currentAdIndex];
      const adSong = {
        id: 'ad_' + Date.now() + '_' + currentAdIndex,
        url: ad.url,
        category: 'ANUNCIO',
        title: `${ad.title} (${currentAdIndex + 1}/${adPlaylist.length})`,
        music: ad.music,
        video: ad.video,
        isAd: true
      };
      currentSong = adSong;
      
      if (ad.video) {
        let videoHtml = '';
        if (ad.video.includes('dropbox.com')) {
          const videoUrl = ad.video;
          videoHtml = `<video controls style="width:100%;height:100%;background:#000;object-fit:contain;">
                        <source src="${videoUrl}" type="video/mp4">
                        Tu navegador no soporta reproducción de video.
                       </video>`;
        } else if (ad.video.includes('youtube.com') || ad.video.includes('youtu.be')) {
          const videoId = ad.video.includes('youtu.be') ? ad.video.split('/').pop() : ad.video.split('v=')[1]?.split('&')[0];
          if (videoId) {
            videoHtml = `<iframe src="https://www.youtube.com/embed/${videoId}?autoplay=1" allow="autoplay; encrypted-media" allowfullscreen></iframe>`;
          }
        } else if (ad.video.includes('vimeo.com')) {
          const videoId = ad.video.split('/').pop();
          if (videoId) {
            videoHtml = `<iframe src="https://player.vimeo.com/video/${videoId}?autoplay=1" allow="autoplay; encrypted-media" allowfullscreen></iframe>`;
          }
        } else {
          videoHtml = `<video controls style="width:100%;height:100%;background:#000;object-fit:contain;">
                        <source src="${ad.video}" type="video/mp4">
                        Tu navegador no soporta reproducción de video.
                       </video>`;
        }
        
        if (videoHtml) {
          showVideoInPlayer(videoHtml);
        } else {
          hideVideoFromPlayer();
          fullCover.src = adSong.url;
        }
      } else {
        hideVideoFromPlayer();
        fullCover.src = adSong.url;
        if (progressArea) progressArea.style.display = 'none';
      }
      
      fullSongTitle.innerText = adSong.title;
      fullSongCategory.innerHTML = `ANUNCIO <span class="ad-badge">AD ${currentAdIndex + 1}/${adPlaylist.length}</span>`;
      miniCover.src = adSong.url;
      miniTitle.innerText = adSong.title;
      
      if (adSong.music && !ad.video) {
        audio.src = adSong.music;
        audio.play().catch(e => console.log('Error al reproducir audio del anuncio:', e));
        isPlaying = true;
        audio.removeEventListener('ended', onAdEnd);
        audio.addEventListener('ended', onAdEnd);
        fullPlayPause.style.display = 'flex';
        miniPlayPause.style.display = 'flex';
      } else if (ad.video) {
        audio.pause();
        isPlaying = false;
        fullPlayPause.style.display = 'none';
        miniPlayPause.style.display = 'none';
      } else {
        audio.pause();
        isPlaying = false;
        if (window._adTimer) clearTimeout(window._adTimer);
        window._adTimer = setTimeout(() => {
          onAdEnd();
        }, 5000);
      }
      
      fullPlayer.classList.add('show');
      miniPlayerDiv.classList.add('show');
      updatePlayPauseIcon();
      triggerBackgroundRefresh();
    }
    
    function onVideoAdEnd() {
      if (window._adTimer) {
        clearTimeout(window._adTimer);
        window._adTimer = null;
      }
      onAdEnd();
    }
    
    function onAdEnd() {
      audio.removeEventListener('ended', onAdEnd);
      if (window._adTimer) {
        clearTimeout(window._adTimer);
        window._adTimer = null;
      }
      if (videoElement) {
        videoElement.removeEventListener('ended', onVideoAdEnd);
        videoElement = null;
      }
      hideVideoFromPlayer();
      currentAdIndex++;
      playNextAd();
    }
    
    function finishAdPlaylist() {
      isAdPlaying = false;
      fullPrev.classList.remove('hidden-nav');
      fullNext.classList.remove('hidden-nav');
      miniPrev.classList.remove('hidden-nav');
      miniNext.classList.remove('hidden-nav');
      
      hideVideoFromPlayer();
      fullPlayPause.style.display = 'flex';
      miniPlayPause.style.display = 'flex';
      if (progressArea) progressArea.style.display = 'block';
      
      if (previousSong && !previousSong.isAd) {
        let foundInQueue = currentPlayQueue.find(s => s.id === previousSong.id);
        if (foundInQueue) {
          playSongInternal(previousSong);
        } else {
          currentPlayQueue.unshift(previousSong);
          currentQueueIndex = 0;
          playSongInternal(previousSong);
        }
      } else if (currentPlayQueue.length > 0) {
        playSongInternal(currentPlayQueue[0]);
      }
      if (adCallback) {
        const callback = adCallback;
        adCallback = null;
        callback();
      }
    }
    
    // ==================== REPRODUCIR CANCIONES ====================
    function playSong(song, customQueue = null) {
      if (!song) return;
      if (isAdPlaying) return;
      if (!song.isAd) {
        adCounter++;
        if (adCounter >= 3) {
          adCounter = 0;
          pendingNextSong = song;
          playAds(function() {
            if (pendingNextSong) {
              const nextSong = pendingNextSong;
              pendingNextSong = null;
              playSongInternal(nextSong, customQueue);
            }
          });
          return;
        }
      }
      playSongInternal(song, customQueue);
    }
    
    function playSongInternal(song, customQueue = null) {
      if (!song) return;
      if (isAdPlaying) return;
      currentSong = song;
      
      hideVideoFromPlayer();
      if (progressArea) progressArea.style.display = 'block';
      
      if (!song.isAd) {
        incrementPlayCount(song.id);
        renderSuggestions();
        renderTopArtists();
        fullSongCategory.innerHTML = song.category || '';
      }
      if (customQueue) {
        currentPlayQueue = customQueue;
        if (shuffleActive) {
          originalQueue = [...customQueue];
          const currentSongId = song.id;
          let queueWithoutCurrent = customQueue.filter(s => s.id !== currentSongId);
          let shuffledWithoutCurrent = shuffleArray(queueWithoutCurrent);
          currentPlayQueue = [song, ...shuffledWithoutCurrent];
          currentQueueIndex = 0;
        } else {
          currentQueueIndex = currentPlayQueue.findIndex(s => s.id === song.id);
        }
      } else {
        updateQueueAndMode();
        let idx = currentPlayQueue.findIndex(s => s.id === song.id);
        if (idx !== -1) currentQueueIndex = idx;
      }
      if (song.music) {
        audio.src = song.music;
        audio.play().catch(e => console.log('Error al reproducir:', e));
        isPlaying = true;
      } else {
        audio.pause();
        isPlaying = false;
      }
      updateUIWithSong(song);
      fullPlayer.classList.add('show');
      miniPlayerDiv.classList.add('show');
      updatePlayPauseIcon();
      triggerBackgroundRefresh();
      renderPlayerSuggestions();
    }
    
    function updateUIWithSong(song){ 
      hideVideoFromPlayer();
      fullCover.src = song.url; 
      fullSongTitle.innerText = song.title; 
      if (!song.isAd) {
        fullSongCategory.innerHTML = song.category || '';
      }
      miniCover.src = song.url; 
      miniTitle.innerText = song.title; 
      renderPlayerSuggestions(); 
    }
    
    function updatePlayPauseIcon(){ 
      if (isVideoAd) {
        fullPlayPause.style.display = 'none';
        miniPlayPause.style.display = 'none';
        return;
      }
      fullPlayPause.style.display = 'flex';
      miniPlayPause.style.display = 'flex';
      const icon = isPlaying ? '⏸' : '▶'; 
      fullPlayPause.innerText = icon; 
      miniPlayPause.innerText = icon; 
    }
    
    function nextTrack(){ 
      if (isAdPlaying) return;
      if (!currentPlayQueue.length) return; 
      let newIdx = (currentQueueIndex + 1) % currentPlayQueue.length; 
      currentQueueIndex = newIdx; 
      playSong(currentPlayQueue[newIdx]); 
    }
    
    function prevTrack(){ 
      if (isAdPlaying) return;
      if (!currentPlayQueue.length) return; 
      let newIdx = (currentQueueIndex - 1 + currentPlayQueue.length) % currentPlayQueue.length; 
      currentQueueIndex = newIdx; 
      playSong(currentPlayQueue[newIdx]); 
    }
    
    function togglePlayPause(){ 
      if (isAdPlaying) {
        if (isVideoAd && videoElement) {
          if (videoElement.paused) {
            videoElement.play();
          } else {
            videoElement.pause();
          }
        }
        return;
      }
      isPlaying ? audio.pause() : audio.play(); 
    }
    
    // ==================== SUGERENCIAS ====================
    function renderSuggestions(){ 
      if(isPlaylistsMode || currentSearch.trim() !== '') { 
        suggestionsContainer.innerHTML = ''; 
        return; 
      } 
      const leastPlayed = getLeastPlayedSuggestions(6); 
      if(leastPlayed.length === 0){ suggestionsContainer.innerHTML = ''; return; } 
      let html = `<div class="suggestions-horizontal">`; 
      leastPlayed.forEach(song => { 
        const plays = (playCount.get(song.id) || 0); 
        const inviteMsg = plays === 0 ? 'Sin estrenar' : `🎧 ${plays} reproducción${plays !== 1 ? 'es' : ''}`; 
        html += `<div class="suggestion-card" data-id="${song.id}"><img src="${song.url}" loading="lazy"><div class="suggestion-info"><div class="suggestion-title">${escapeHtml(song.title)}</div><div class="suggestion-badge">${song.category}</div><div class="suggestion-invite"><span>▶</span> ${inviteMsg}</div></div></div>`; 
      }); 
      html += `</div>`; 
      suggestionsContainer.innerHTML = html; 
      document.querySelectorAll('.suggestion-card').forEach(card => { 
        card.addEventListener('click', () => { 
          const id = parseInt(card.dataset.id); 
          const found = masterSongs.find(s => s.id === id) || allSongs.find(s => s.id === id); 
          if(found){ updateQueueAndMode(); playSong(found); } 
        }); 
      }); 
    }
    
    // ==================== SUGERENCIAS DEL REPRODUCTOR ====================
    let suggestionsHidden = false;
    
    function getPlayerSuggestions(currentSongObj, limit = 6) {
      if (!currentSongObj) return [];
      const sameArtist = masterSongs.filter(s => s.id !== currentSongObj.id && ((s.artist && currentSongObj.artist) && s.artist.toLowerCase() === currentSongObj.artist.toLowerCase()));
      const others = masterSongs.filter(s => s.id !== currentSongObj.id && !sameArtist.includes(s));
      let combined = [...sameArtist, ...others];
      return combined.slice(0, limit);
    }
    
    function renderPlayerSuggestions() {
      const suggestionsTrack = document.getElementById('playerSuggestionsTrack');
      const toggleBtn = document.getElementById('toggleSuggestionsBtn');
      if (!currentSong) { suggestionsTrack.innerHTML = ''; return; }
      const suggestions = getPlayerSuggestions(currentSong);
      if (suggestions.length === 0) { suggestionsTrack.innerHTML = '<div style="color:#5a7fc7; text-align:center; font-size:0.7rem;">No hay sugerencias disponibles</div>'; return; }
      let html = '';
      suggestions.forEach(song => {
        const plays = playCount.get(song.id) || 0;
        html += `<div class="player-suggestion-item" data-id="${song.id}"><img class="player-suggestion-img" src="${song.url}" loading="lazy"><div class="player-suggestion-info"><div class="player-suggestion-title">${escapeHtml(song.title.length > 12 ? song.title.substring(0,10)+'...' : song.title)}</div><div class="player-suggestion-plays">${plays} escuchas</div></div></div>`;
      });
      suggestionsTrack.innerHTML = html;
      if (suggestionsHidden) { suggestionsTrack.classList.add('hidden-suggestions'); if(toggleBtn) toggleBtn.innerText = 'Mostrar'; } else { suggestionsTrack.classList.remove('hidden-suggestions'); if(toggleBtn) toggleBtn.innerText = 'Ocultar'; }
      document.querySelectorAll('#playerSuggestionsTrack .player-suggestion-item').forEach(item => { item.addEventListener('click', (e) => { e.stopPropagation(); const id = parseInt(item.getAttribute('data-id')); const found = masterSongs.find(s => s.id === id) || allSongs.find(s => s.id === id); if(found) { updateQueueAndMode(); playSong(found); } }); });
    }
    
    function toggleSuggestions() {
      suggestionsHidden = !suggestionsHidden;
      const track = document.getElementById('playerSuggestionsTrack');
      const toggleBtn = document.getElementById('toggleSuggestionsBtn');
      if (track) {
        if (suggestionsHidden) { track.classList.add('hidden-suggestions'); if(toggleBtn) toggleBtn.innerText = 'Mostrar'; } 
        else { track.classList.remove('hidden-suggestions'); if(toggleBtn) toggleBtn.innerText = 'Ocultar'; }
      }
    }
    
    // ==================== RENDER TOP ARTISTS ====================
    function renderTopArtists() {
      const topArtistsSection = document.getElementById('topArtistsSection');
      const artistsContainer = document.getElementById('artistsContainer');
      const shouldShow = (!isPlaylistsMode && currentSearch.trim() === '');
      if (!shouldShow) { topArtistsSection.classList.add('hidden-artists'); return; }
      topArtistsSection.classList.remove('hidden-artists');
      const topArtists = getTopArtists(6);
      if (topArtists.length === 0 || (topArtists.length === 1 && topArtists[0].plays === 0)) {
        artistsContainer.innerHTML = '<div style="color:#5a7fc7; font-size:0.8rem; padding:0.5rem;">Escucha más canciones para ver tus artistas favoritos 🎧</div>';
        return;
      }
      let html = '';
      topArtists.forEach(artist => {
        html += `<div class="artist-circle-card" data-artist="${escapeHtml(artist.name)}"><img class="artist-avatar" src="${artist.image}" alt="${escapeHtml(artist.name)}" loading="lazy"><div class="artist-name">${escapeHtml(artist.name.length > 15 ? artist.name.substring(0,12)+'...' : artist.name)}</div><div class="artist-plays">${artist.plays} reproducción${artist.plays !== 1 ? 'es' : ''}</div></div>`;
      });
      artistsContainer.innerHTML = html;
    }
    
    // ==================== RENDER CONTENIDO ====================
    function updateCounterVisibility() { 
      if (isPlaylistsMode || currentSearch.trim() !== '') { 
        counterWrapper.classList.add('hidden-counter'); 
      } else { 
        counterWrapper.classList.remove('hidden-counter'); 
      } 
    }
    
    function renderContent(){ 
      updateCounterVisibility(); 
      renderTopArtists();
      const items = getActiveListForQueue();
      const isSearching = currentSearch.trim() !== ''; 
      if(isSearching) searchBadge.innerHTML = `🔍 Resultados: "${escapeHtml(currentSearch)}" (${items.length})`; 
      else if(isPlaylistsMode) searchBadge.innerHTML = `❤️ Tus Me gusta · ${items.length} canción${items.length !== 1 ? 'es' : ''}`; 
      else searchBadge.innerHTML = ''; 
      
      if(items.length === 0){ 
        contentContainer.innerHTML = '<div class="no-results"> No se encontraron canciones</div>';
        return; 
      } 
      
      let gridClass = 'gallery-grid' + (isSearching ? ' list-view' : ''); 
      let html = `<div class="${gridClass}">`; 
      items.forEach(song => { 
        if(isSearching) html += `<div class="image-card" data-id="${song.id}"><img src="${song.url}" loading="lazy"><div class="card-title">${escapeHtml(song.title)}<span style="font-size:0.7rem; color:#5a7fc7;"> · ${song.category}</span></div></div>`; 
        else html += `<div class="image-card" data-id="${song.id}"><img src="${song.url}" loading="lazy"><div class="card-title">${escapeHtml(song.title)}</div></div>`; 
      }); 
      html += `</div>`; 
      contentContainer.innerHTML = html; 
      document.querySelectorAll('.image-card').forEach(card => { 
        card.addEventListener('click', () => { 
          const id = parseInt(card.dataset.id); 
          const found = masterSongs.find(s => s.id === id) || allSongs.find(s => s.id === id); 
          if(found){ updateQueueAndMode(); playSong(found); } 
        }); 
      }); 
      triggerBackgroundRefresh(); 
    }
    
    // ==================== FILTROS Y ORDEN ====================
    function updateSortChipsVisibility() { sortChipsContainer.style.display = 'none'; }
    
    function setSortMode(mode) { 
      playlistsSortMode = mode; 
      localStorage.setItem('kerim_playlists_sort_mode', mode); 
      renderContent(); 
      updateQueueAndMode(); 
      document.querySelectorAll('.chip-sort').forEach(chip => chip.classList.remove('active')); 
      const activeChip = document.querySelector(`.chip-sort[data-sort="${mode}"]`); 
      if(activeChip) activeChip.classList.add('active'); 
    }
    
    function initChipsSortEvents() { 
      document.querySelectorAll('.chip-sort').forEach(chip => { 
        chip.addEventListener('click', (e) => { 
          e.stopPropagation(); 
          const mode = chip.getAttribute('data-sort'); 
          setSortMode(mode); 
        }); 
      }); 
      const activeChip = document.querySelector(`.chip-sort[data-sort="${playlistsSortMode}"]`); 
      if(activeChip) activeChip.classList.add('active'); 
      else document.querySelector('.chip-sort[data-sort="default"]')?.classList.add('active'); 
    }
    
    // ==================== BÚSQUEDA ====================
    // La búsqueda ahora se activa con un input oculto, pero mantenemos la funcionalidad
    // para que el código no se rompa. Se ha eliminado el contenedor de búsqueda visual.
    
    // ==================== EVENTOS ====================
    const homeBtn = document.querySelector('[data-view="home"]');
    const likesBtn = document.querySelector('[data-view="likes"]');
    
    homeBtn.addEventListener('click', () => {
      homeBtn.classList.add('active');
      isPlaylistsMode = false;
      updateSortChipsVisibility();
      renderContent();
      renderSuggestions();
      updateQueueAndMode();
    });
    
    // ==================== AUDIO EVENTOS ====================
    audio.addEventListener('timeupdate',()=>{ 
      if(audio.duration && isFinite(audio.duration) && !audio.paused){ 
        let p = (audio.currentTime/audio.duration)*100; 
        progressFill.style.width = `${p}%`; 
        miniProgressFill.style.width = `${p}%`; 
        currentTimeSpan.innerText = formatTime(audio.currentTime); 
        if(durationSpan.innerText === '0:00') durationSpan.innerText = formatTime(audio.duration); 
      } 
    });
    
    audio.addEventListener('loadedmetadata',()=>{ if(audio.duration) durationSpan.innerText = formatTime(audio.duration); });
    
    audio.addEventListener('play',()=>{ isPlaying=true; updatePlayPauseIcon(); });
    audio.addEventListener('pause',()=>{ isPlaying=false; updatePlayPauseIcon(); });
    
    audio.addEventListener('ended',()=>{ 
      if (isAdPlaying) return;
      nextTrack(); 
    });
    
    // ==================== PROGRESS BAR ====================
    progressBarBg.addEventListener('click',(e)=>{ 
      if(audio.duration){ 
        let rect = progressBarBg.getBoundingClientRect(); 
        let perc = (e.clientX - rect.left)/rect.width; 
        audio.currentTime = perc * audio.duration; 
      } 
    });
    
    // ==================== CONTROLES ====================
    fullPlayPause.addEventListener('click', togglePlayPause);
    fullNext.addEventListener('click', nextTrack);
    fullPrev.addEventListener('click', prevTrack);
    miniPlayPause.addEventListener('click', togglePlayPause);
    miniNext.addEventListener('click', nextTrack);
    miniPrev.addEventListener('click', prevTrack);
    
    miniPlayerDiv.addEventListener('click',(e)=>{ if(!e.target.closest('.mini-btn')) fullPlayer.classList.add('show'); });
    closePlayerBtn.addEventListener('click',()=>fullPlayer.classList.remove('show'));
    
    shuffleBtnPlayer.addEventListener('click', toggleShuffle);
    if (toggleSuggestionsBtnElem) toggleSuggestionsBtnElem.addEventListener('click', toggleSuggestions);
    
    // ==================== WELCOME MODAL ====================
    const welcomeModal = document.getElementById('welcomeModal');
    const acceptBtn = document.getElementById('acceptWelcomeBtn');
    if (localStorage.getItem('kerim_welcome_accepted') === 'true') welcomeModal.classList.add('hidden');
    else { 
      welcomeModal.classList.remove('hidden'); 
      acceptBtn.addEventListener('click', () => { 
        localStorage.setItem('kerim_welcome_accepted', 'true'); 
        welcomeModal.classList.add('hidden'); 
      }); 
    }
    
    // ==================== INICIALIZACIÓN FINAL ====================
    updateUIPlan();
    changeBackgroundRandomly();
    isPlaylistsMode = false; 
    currentSearch = '';
    updateSortChipsVisibility();
    initChipsSortEvents();
    renderContent(); 
    renderSuggestions(); 
    updateQueueAndMode(); 
    renderTopArtists();
    if(masterSongs.length) currentSong = masterSongs[0];
    audio.volume = 0.9;
    
    console.log('🎵 Kerim Music+ iniciado correctamente');
    console.log('🔀 Modo Aleatorio: haz clic en 🔀 para activarlo/desactivarlo');
    console.log('📺 Los anuncios con video se reproducirán en el reproductor');
    
  })();
</script>
</body>
</html>
