<!-- ========== CONTADOR GLOBAL Y POR CANCIÓN (MÓDULO) ========== -->
<script type="importmap">
  {
    "imports": {
      "firebase/app": "https://www.gstatic.com/firebasejs/9.23.0/firebase-app.js",
      "firebase/firestore": "https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore.js"

<script type="module">
  import { initializeApp } from "firebase/app";
  import {
    getFirestore,
    doc,
    collection,
    getDoc,
    setDoc,
    runTransaction,
    updateDoc,
    deleteField
  } from "firebase/firestore";

  const firebaseConfig = {
    apiKey: "AIzaSyC5R9mPw1PQMjYIqWpz5w3W7BvGmZV4tX8",
    authDomain: "kerim-music-a9c46.firebaseapp.com",
    projectId: "kerim-music-a9c46",
    storageBucket: "kerim-music-a9c46.firebasestorage.app",
    messagingSenderId: "103691719997",
    appId: "1:103691719997:web:da58ff98f78f1b632b19cb"
  };

  const app = initializeApp(firebaseConfig);
  const db = getFirestore(app);

  // ---- CONTADOR GLOBAL DE VISITAS (único) ----
  const contadorRef = doc(db, "Radio Muisc", "Kerim Music+");
  const CAMPO_CONTADOR = "total";
  const contadorSpan = document.getElementById("contador");

  let userId = localStorage.getItem('visitor_id_kerim');
  if (!userId) {
    userId = 'user_' + Date.now() + '_' + Math.random().toString(36).substr(2, 9);
    localStorage.setItem('visitor_id_kerim', userId);
  }
  const userRef = doc(collection(contadorRef, 'usuarios'), userId);

  // ----- Funciones globales -----
  async function obtenerValorGlobal() {
    try {
      const docSnap = await getDoc(contadorRef);
      if (docSnap.exists()) return docSnap.data()[CAMPO_CONTADOR] || 0;
      else { await setDoc(contadorRef, { [CAMPO_CONTADOR]: 0 }); return 0; }
    } catch (e) { console.error(e); return 0; }
  }
  async function actualizarInterfazGlobal() {
    const valor = await obtenerValorGlobal();
    if (contadorSpan) contadorSpan.textContent = valor;
  }
  async function inicializarContadorGlobal() {
    await actualizarInterfazGlobal();
    try {
      const userSnap = await getDoc(userRef);
      if (!userSnap.exists()) {
        await runTransaction(db, async (transaction) => {
          const docSnap = await transaction.get(contadorRef);
          const nuevoTotal = (docSnap.exists() ? docSnap.data()[CAMPO_CONTADOR] : 0) + 1;
          if (!docSnap.exists()) transaction.set(contadorRef, { [CAMPO_CONTADOR]: nuevoTotal });
          else transaction.update(contadorRef, { [CAMPO_CONTADOR]: nuevoTotal });
        });
        await setDoc(userRef, { 
          fecha: new Date().toISOString(), 
          userAgent: navigator.userAgent.slice(0, 200), 
          canciones_escuchadas: {}   // ahora es un objeto vacío
        });
        await actualizarInterfazGlobal();
        console.log("✅ Nuevo usuario registrado. Contador global incrementado.");
      } else {
        console.log("👤 Usuario ya registrado. No se incrementa.");
      }
    } catch (error) { console.error("Error al verificar/registrar usuario:", error); }
  }

  // ================================================================
  //  NUEVA LÓGICA DE CONTADOR POR CANCIÓN CON CADUCIDAD DE 3 MESES
  // ================================================================

  const TRES_MESES_MS = 3 * 30 * 24 * 60 * 60 * 1000;  // ~ 7.776.000.000 ms

  /**
   * Migra el campo antiguo (array) a objeto con fechas actuales.
   * Se llama una sola vez por usuario si es necesario.
   */
  async function migrarSiEsArray(userData) {
    const historial = userData.canciones_escuchadas;
    if (Array.isArray(historial)) {
      console.log('🔄 Migrando historial de array a objeto para usuario', userId);
      const nuevoMap = {};
      const ahora = Date.now();
      historial.forEach(id => { nuevoMap[id] = ahora; });
      await updateDoc(userRef, { canciones_escuchadas: nuevoMap });
      return nuevoMap;
    }
    return historial || {};
  }

  /**
   * Incrementa la reproducción de una canción para el usuario actual.
   * Solo cuenta si es la primera vez o han pasado más de 3 meses desde la última escucha.
   * Además, limpia automáticamente cualquier otra canción expirada del historial del usuario.
   * @param {string} songId - ID de la canción.
   * @returns {Promise<number|null>} Nuevo total de reproducciones de la canción, o null si error.
   */
  window.incrementarReproduccion = async function(songId) {
    if (!songId) return null;
    try {
      // 1. Asegurar que el usuario existe
      const userSnap = await getDoc(userRef);
      if (!userSnap.exists()) {
        await setDoc(userRef, { 
          fecha: new Date().toISOString(), 
          userAgent: navigator.userAgent.slice(0, 200), 
          canciones_escuchadas: {} 
        });
      }

      // 2. Obtener datos actuales del usuario
      const userData = (await getDoc(userRef)).data() || {};
      let historial = await migrarSiEsArray(userData);

      const ahora = Date.now();
      const fechaExpiracion = ahora - TRES_MESES_MS;

      // 3. Preparar transacción para actualizar usuario y canción(es)
      let resultado = null;

      await runTransaction(db, async (transaction) => {
        // Leer el documento de la canción
        const songRef = doc(db, "Radio Muisc", String(songId));
        const songSnap = await transaction.get(songRef);
        let currentPlays = songSnap.exists() ? songSnap.data().reproducciones || 0 : 0;

        // --- Manejo de la canción actual ---
        const lastPlayed = historial[songId] || 0;
        let incrementar = false;

        if (lastPlayed === 0) {
          // Nunca escuchada → nueva reproducción
          incrementar = true;
        } else if (lastPlayed < fechaExpiracion) {
          // Expiró → se elimina y se vuelve a contar
          incrementar = true;
          // Decrementar el contador porque estaba expirada
          currentPlays = Math.max(0, currentPlays - 1);
          delete historial[songId];
        } else {
          // Dentro de los 3 meses → solo actualizar fecha, no incrementar
          incrementar = false;
        }

        if (incrementar) {
          currentPlays += 1;
          historial[songId] = ahora;
        } else {
          // Solo actualizar timestamp (reinicia el contador de 3 meses)
          historial[songId] = ahora;
        }

        // --- Limpieza de otras canciones expiradas en el historial ---
        const idsAEliminar = [];
        for (const [id, timestamp] of Object.entries(historial)) {
          if (id !== songId && timestamp < fechaExpiracion) {
            idsAEliminar.push(id);
          }
        }

        // Eliminar las expiradas y decrementar sus contadores
        for (const id of idsAEliminar) {
          delete historial[id];
          const ref = doc(db, "Radio Muisc", String(id));
          const snap = await transaction.get(ref);
          if (snap.exists()) {
            const plays = snap.data().reproducciones || 0;
            const nuevo = Math.max(0, plays - 1);
            transaction.update(ref, { reproducciones: nuevo });
          }
        }

        // Actualizar el documento del usuario
        transaction.update(userRef, { canciones_escuchadas: historial });

        // Actualizar el documento de la canción actual
        if (!songSnap.exists()) {
          transaction.set(songRef, { reproducciones: currentPlays });
        } else {
          transaction.update(songRef, { reproducciones: currentPlays });
        }

        resultado = currentPlays;
      });

      console.log(`✅ Reproducción registrada para ${userId} - canción ${songId}: ${resultado}`);
      return resultado;

    } catch (error) {
      console.error("❌ Error en incrementarReproduccion:", error);
      return null;
    }
  };

  /**
   * Obtiene el total de reproducciones de una canción (usuarios únicos en los últimos 3 meses).
   * Lee el campo `reproducciones` del documento de la canción.
   */
  window.obtenerReproducciones = async function(songId) {
    try {
      const ref = doc(db, "Radio Muisc", String(songId));
      const docSnap = await getDoc(ref);
      if (docSnap.exists()) {
        return docSnap.data().reproducciones || 0;
      }
      return 0;
    } catch (error) {
      console.error("Error al obtener reproducciones:", error);
      return 0;
    }
  };

  /**
   * Devuelve el historial completo del usuario (objeto con timestamps).
   * Útil para depuración.
   */
  window.obtenerCancionesEscuchadas = async function() {
    try {
      const userSnap = await getDoc(userRef);
      if (userSnap.exists()) {
        return userSnap.data().canciones_escuchadas || {};
      }
      return {};
    } catch (error) {
      console.error("Error al obtener canciones escuchadas:", error);
      return {};
    }
  };

  // ---- Inicialización ----
  document.addEventListener("DOMContentLoaded", () => {
    inicializarContadorGlobal();
  });

  console.log("✅ Módulo Firebase actualizado: contador por canción con caducidad de 3 meses.");
</script>

    // ==================== FUNCIONES AUXILIARES ====================
    function shuffleArray(arr) {
      const array = [...arr];
      for (let i = array.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [array[i], array[j]] = [array[j], array[i]];
      }
      return array;
    }
    
    function escapeHtml(str){ return str ? str.replace(/[&<>]/g, m => ({'&':'&amp;', '<':'&lt;', '>':'&gt;'}[m] || m)) : ''; }
    
    function formatTime(sec){ if(isNaN(sec)) return '0:00'; let m=Math.floor(sec/60), s=Math.floor(sec%60); return `${m}:${s<10?'0':''}${s}`; }
    
    // ==================== TOAST ====================
    function showToast(message, duration = 2500) {
      const toast = document.getElementById('toastNotification');
      toast.textContent = message;
      toast.classList.add('show');
      clearTimeout(toast._timeout);
      toast._timeout = setTimeout(() => {
        toast.classList.remove('show');
      }, duration);
    }

    let playCount = new Map();      // <-- local (solo para estadísticas personales)
    let artistPlayCount = new Map();
    let firestorePlays = new Map(); // <-- contador de usuarios únicos (Firestore)
    
    // Cargar datos guardados (localStorage)
    try{ 
      let savedCounts = localStorage.getItem('kerim_play_counts');
      if(savedCounts){ let parsed = JSON.parse(savedCounts); for(let [k,v] of Object.entries(parsed)) playCount.set(String(k), v); }
    } catch(e){}
    
    // ==================== FUNCIONES DE ESTADO ====================
    function savePlayCounts(){ let obj = {}; for(let [k,v] of playCount.entries()) obj[k] = v; localStorage.setItem('kerim_play_counts', JSON.stringify(obj)); }
    
    function incrementPlayCount(songId){ 
      let song = masterSongs.find(s => s.id === songId) || allSongs.find(s => s.id === songId);
      if(song) {
        let artist = song.artist || 'Artista';
        let newCount = (playCount.get(String(songId)) || 0) + 1;
        playCount.set(String(songId), newCount);
        artistPlayCount.set(artist, (artistPlayCount.get(artist) || 0) + 1);
        savePlayCounts();
      } else {
        playCount.set(String(songId), (playCount.get(String(songId)) || 0) + 1);
        savePlayCounts();
      }
    }
    
    async function obtenerReproduccionesFirestore(songId) {
      try {
        if (window.obtenerReproducciones) {
          const count = await window.obtenerReproducciones(songId);
          return count || 0;
        }
        return 0;
      } catch (e) {
        return 0;
      }
    }
    
    // ===== Sugerencias basadas en el contador GLOBAL (Firestore) =====
    function getLeastPlayedSuggestions(limit = 6){ 
      let songsWithCount = masterSongs.map(song => ({
        ...song, 
        plays: firestorePlays.get(String(song.id)) || 0   // <-- solo usuarios únicos
      })); 
      songsWithCount.sort((a,b) => a.plays - b.plays); 
      return songsWithCount.slice(0, limit); 
    }
    
    function getTopArtists(limit = 6) {
      let artistsArray = [];
      for (let [artist, plays] of artistPlayCount.entries()) {
        let songByArtist = masterSongs.find(s => (s.artist || 'Artista') === artist);
        let artistImage = songByArtist ? songByArtist.url : 'https://i.postimg.cc/XNP1xdB2/IMG-20260207-WA0000.jpg';
        artistsArray.push({ name: artist, plays: plays, image: artistImage });
      }
      artistsArray.sort((a, b) => b.plays - a.plays);
      return artistsArray.slice(0, limit);
    }

    // ==================== SHUFFLE ====================
    function toggleShuffle() {
      shuffleActive = !shuffleActive;
      
      if (shuffleActive) {
        shuffleBtnPlayer.classList.add('active');
        showToast('🔀 Modo Aleatorio Activado', 2000);
        
        if (originalQueue.length === 0 && currentPlayQueue.length > 0) {
          originalQueue = [...currentPlayQueue];
        }
        
        const currentSongId = currentSong ? currentSong.id : null;
        let queueWithoutCurrent = currentPlayQueue.filter(s => s.id !== currentSongId);
        let shuffledWithoutCurrent = shuffleArray(queueWithoutCurrent);
        let newQueue = [];
        
        if (currentSongId && currentPlayQueue.find(s => s.id === currentSongId)) {
          newQueue = [currentSong, ...shuffledWithoutCurrent];
          currentQueueIndex = 0;
        } else {
          newQueue = shuffledWithoutCurrent;
          currentQueueIndex = 0;
        }
        currentPlayQueue = newQueue;
        
      } else {
        shuffleBtnPlayer.classList.remove('active');
        showToast('🔀 Modo Aleatorio Desactivado', 2000);
        
        if (originalQueue.length > 0) {
          const currentSongId = currentSong ? currentSong.id : null;
          let newIndex = originalQueue.findIndex(s => s.id === currentSongId);
          if (newIndex === -1 && currentSong) newIndex = 0;
          currentPlayQueue = originalQueue;
          currentQueueIndex = newIndex !== -1 ? newIndex : 0;
          originalQueue = [];
        }
      }
    }
    
    // ==================== FUNCIONES DE COLA ====================
    function getActiveListForQueue(){
      let base = [...masterSongs];
      if(currentSearch.trim() !== '') base = base.filter(s=>s.title.toLowerCase().includes(currentSearch.toLowerCase()) || (s.artist && s.artist.toLowerCase().includes(currentSearch.toLowerCase())));
      return base;
    }
    
    function buildBaseQueue(){ return getActiveListForQueue(); }
    
    function updateQueueAndMode(){ 
      const newQueue = buildBaseQueue(); 
      if (shuffleActive) { 
        originalQueue = [...newQueue]; 
        const currentSongId = currentSong ? currentSong.id : null; 
        let queueWithoutCurrent = newQueue.filter(s => s.id !== currentSongId); 
        let shuffledWithoutCurrent = shuffleArray(queueWithoutCurrent); 
        let newQueueShuffled = []; 
        if (currentSongId && newQueue.find(s => s.id === currentSongId)) { 
          newQueueShuffled = [currentSong, ...shuffledWithoutCurrent]; 
          currentQueueIndex = 0; 
        } else { 
          newQueueShuffled = shuffledWithoutCurrent; 
          currentQueueIndex = 0; 
        } 
        currentPlayQueue = newQueueShuffled; 
      } else { 
        currentPlayQueue = newQueue; 
        if(currentSong && currentPlayQueue.findIndex(s=>s.id===currentSong.id) !== -1) currentQueueIndex = currentPlayQueue.findIndex(s=>s.id===currentSong.id); 
        else { 
          currentQueueIndex = 0; 
          if(currentPlayQueue.length) currentSong = currentPlayQueue[0]; 
        } 
      } 
      if(currentPlayQueue.length === 0 && masterSongs.length) { 
        currentPlayQueue = [...masterSongs]; 
        if(shuffleActive) { 
          const currentSongId = currentSong ? currentSong.id : null; 
          let queueWithoutCurrent = currentPlayQueue.filter(s => s.id !== currentSongId); 
          let shuffledWithoutCurrent = shuffleArray(queueWithoutCurrent); 
          if (currentSongId && currentPlayQueue.find(s => s.id === currentSongId)) { 
            currentPlayQueue = [currentSong, ...shuffledWithoutCurrent]; 
            currentQueueIndex = 0; 
          } else { 
            currentPlayQueue = shuffledWithoutCurrent; 
            currentQueueIndex = 0;

    function showVideoInPlayer(videoHtml) {
      fullCover.style.display = 'none';
      videoContainer.style.display = 'block';
      videoContainer.innerHTML = videoHtml;
      videoContainer.style.width = '100%';
      videoContainer.style.aspectRatio = '16/9';
      videoContainer.style.background = '#000';
      
      const videoEl = videoContainer.querySelector('video');
      const iframeEl = videoContainer.querySelector('iframe');
      
      if (videoEl) {
        videoElement = videoEl;
        isVideoAd = true;
        videoEl.addEventListener('ended', onVideoAdEnd);
        videoEl.play().catch(e => console.log('Error al reproducir video:', e));
        fullPlayPause.style.display = 'none';
        miniPlayPause.style.display = 'none';
        if (progressArea) progressArea.style.display = 'none';
      } else if (iframeEl) {
        isVideoAd = true;
        fullPlayPause.style.display = 'none';
        miniPlayPause.style.display = 'none';
        if (progressArea) progressArea.style.display = 'none';
        const adDuration = 30000;
        if (window._adTimer) clearTimeout(window._adTimer);
        window._adTimer = setTimeout(() => {
          onVideoAdEnd();
        }, adDuration);
      } else {
        isVideoAd = false;
      }
      
      if (progressArea) progressArea.style.display = 'none';
      console.log('🎬 Video mostrado en el reproductor');
    }
    
    function hideVideoFromPlayer() {
      videoContainer.style.display = 'none';
      videoContainer.innerHTML = '';
      fullCover.style.display = 'block';
      if (progressArea) progressArea.style.display = 'block';
      fullPlayPause.style.display = 'flex';
      miniPlayPause.style.display = 'flex';
      if (videoElement) {
        videoElement.removeEventListener('ended', onVideoAdEnd);
        videoElement = null;
      }
      isVideoAd = false;
      if (window._adTimer) {
        clearTimeout(window._adTimer);
        window._adTimer = null;
      }
    }

    function playAds(callback) {

        if (callback) callback();
        return;
      }
      isAdPlaying = true;
      let shuffledAds = shuffleArray([...ads]);
      adPlaylist = shuffledAds.slice(0, Math.min(3, shuffledAds.length));
      currentAdIndex = 0;
      adCallback = callback;
      fullPrev.classList.add('hidden-nav');
      fullNext.classList.add('hidden-nav');
      miniPrev.classList.add('hidden-nav');
      miniNext.classList.add('hidden-nav');
      previousSong = currentSong;
      playNextAd();
    }
    
    function playNextAd() {

        finishAdPlaylist();
        return;
      }
      const ad = adPlaylist[currentAdIndex];
      const adSong = {
        id: 'ad_' + Date.now() + '_' + currentAdIndex,
        url: ad.url,
        category: 'ANUNCIO',
        title: `${ad.title} (${currentAdIndex + 1}/${adPlaylist.length})`,
        music: ad.music,
        video: ad.video,
        isAd: true
      };
      currentSong = adSong;
      
      if (ad.video) {
        let videoHtml = '';
        if (ad.video.includes('dropbox.com')) {
          const videoUrl = ad.video;
          videoHtml = `<video controls style="width:100%;height:100%;background:#000;object-fit:contain;">
                        <source src="${videoUrl}" type="video/mp4">
                        Tu navegador no soporta reproducción de video.
                       </video>`;
        } else if (ad.video.includes('youtube.com') || ad.video.includes('youtu.be')) {
          const videoId = ad.video.includes('youtu.be') ? ad.video.split('/').pop() : ad.video.split('v=')[1]?.split('&')[0];
          if (videoId) {
            videoHtml = `<iframe src="https://www.youtube.com/embed/${videoId}?autoplay=1" allow="autoplay; encrypted-media" allowfullscreen></iframe>`;
          }
        } else if (ad.video.includes('vimeo.com')) {
          const videoId = ad.video.split('/').pop();
          if (videoId) {
            videoHtml = `<iframe src="https://player.vimeo.com/video/${videoId}?autoplay=1" allow="autoplay; encrypted-media" allowfullscreen></iframe>`;
          }
        } else {
          videoHtml = `<video controls style="width:100%;height:100%;background:#000;object-fit:contain;">
                        <source src="${ad.video}" type="video/mp4">
                        Tu navegador no soporta reproducción de video.
                       </video>`;
        }
        
        if (videoHtml) {
          showVideoInPlayer(videoHtml);
        } else {
          hideVideoFromPlayer();
          fullCover.src = adSong.url;
        }
      } else {
        hideVideoFromPlayer();
        fullCover.src = adSong.url;
        if (progressArea) progressArea.style.display = 'none';
      }
      
      fullSongTitle.innerText = adSong.title;
      fullSongCategory.innerHTML = `ANUNCIO <span class="ad-badge">AD ${currentAdIndex + 1}/${adPlaylist.length}</span>`;
      miniCover.src = adSong.url;
      miniTitle.innerText = adSong.title;
      
      if (adSong.music && !ad.video) {
        audio.src = adSong.music;
        audio.play().catch(e => console.log('Error al reproducir audio del anuncio:', e));
        isPlaying = true;
        audio.removeEventListener('ended', onAdEnd);
        audio.addEventListener('ended', onAdEnd);
        fullPlayPause.style.display = 'flex';
        miniPlayPause.style.display = 'flex';
      } else if (ad.video) {
        audio.pause();
        isPlaying = false;
        fullPlayPause.style.display = 'none';
        miniPlayPause.style.display = 'none';
      } else {
        audio.pause();
        isPlaying = false;
        if (window._adTimer) clearTimeout(window._adTimer);
        window._adTimer = setTimeout(() => {
          onAdEnd();
        }, 5000);
      }
      
      fullPlayer.classList.add('show');
      miniPlayerDiv.classList.add('show');
      updatePlayPauseIcon();
      triggerBackgroundRefresh();
    }
    
    function onVideoAdEnd() {
      if (window._adTimer) {
        clearTimeout(window._adTimer);
        window._adTimer = null;
      }
      onAdEnd();
    }
    
    function onAdEnd() {
      audio.removeEventListener('ended', onAdEnd);
      if (window._adTimer) {
        clearTimeout(window._adTimer);
        window._adTimer = null;
      }
      if (videoElement) {
        videoElement.removeEventListener('ended', onVideoAdEnd);
        videoElement = null;
      }
      hideVideoFromPlayer();
      currentAdIndex++;
      playNextAd();
    }
    
    function finishAdPlaylist() {
      isAdPlaying = false;
      fullPrev.classList.remove('hidden-nav');
      fullNext.classList.remove('hidden-nav');
      miniPrev.classList.remove('hidden-nav');
      miniNext.classList.remove('hidden-nav');
      
      hideVideoFromPlayer();
      fullPlayPause.style.display = 'flex';
      miniPlayPause.style.display = 'flex';
      if (progressArea) progressArea.style.display = 'block';
      
      if (previousSong && !previousSong.isAd) {
        let foundInQueue = currentPlayQueue.find(s => s.id === previousSong.id);
        if (foundInQueue) {
          playSongInternal(previousSong);
        } else {
          currentPlayQueue.unshift(previousSong);
          currentQueueIndex = 0;
          playSongInternal(previousSong);
        }
      } else if (currentPlayQueue.length > 0) {
        playSongInternal(currentPlayQueue[0]);
      }
      if (adCallback) {
        const callback = adCallback;
        adCallback = null;
        callback();
      }
    }
    
    // ==================== REPRODUCIR CANCIONES ====================
    function playSong(song, customQueue = null) {
      if (!song) return;
      if (isAdPlaying) return;
      if (!song.isAd) {
        adCounter++;
        if (adCounter >= 3) {
          adCounter = 0;
          pendingNextSong = song;
          playAds(function() {
            if (pendingNextSong) {
              const nextSong = pendingNextSong;
              pendingNextSong = null;
              playSongInternal(nextSong, customQueue);
            }
          });
          return;
        }
      }
      playSongInternal(song, customQueue);
    }
    
    async function playSongInternal(song, customQueue = null) {
      if (!song) return;
      if (isAdPlaying) return;
      currentSong = song;
      
      hideVideoFromPlayer();
      if (progressArea) progressArea.style.display = 'block';
      
      if (!song.isAd) {
        // Contador local (estadísticas personales)
        incrementPlayCount(song.id);
        
        // Contador en Firestore (ÚNICO por usuario, con caducidad de 3 meses)
        if (window.incrementarReproduccion) {
          const nuevoValor = await window.incrementarReproduccion(song.id);
          if (nuevoValor !== null) {
            firestorePlays.set(String(song.id), nuevoValor);
            console.log(`📊 Usuarios únicos de "${song.title}" (últimos 3 meses): ${nuevoValor}`);
          }
        } else {
          console.warn('Función incrementarReproduccion no disponible');
        }
        renderSuggestions();
        renderTopArtists();
        fullSongCategory.innerHTML = song.category || '';
      }
      if (customQueue) {
        currentPlayQueue = customQueue;
        if (shuffleActive) {
          originalQueue = [...customQueue];
          const currentSongId = song.id;
          let queueWithoutCurrent = customQueue.filter(s => s.id !== currentSongId);
          let shuffledWithoutCurrent = shuffleArray(queueWithoutCurrent);
          currentPlayQueue = [song, ...shuffledWithoutCurrent];
          currentQueueIndex = 0;
        } else {
          currentQueueIndex = currentPlayQueue.findIndex(s => s.id === song.id);
        }
      } else {
        updateQueueAndMode();
        let idx = currentPlayQueue.findIndex(s => s.id === song.id);
        if (idx !== -1) currentQueueIndex = idx;
      }
      if (song.music) {
        audio.src = song.music;
        audio.play().catch(e => console.log('Error al reproducir:', e));
        isPlaying = true;
      } else {
        audio.pause();
        isPlaying = false;
      }
      updateUIWithSong(song);
      fullPlayer.classList.add('show');
      miniPlayerDiv.classList.add('show');
      updatePlayPauseIcon();
      triggerBackgroundRefresh();
      renderPlayerSuggestions();
      renderContent();
    }
    
    function updateUIWithSong(song){ 
      hideVideoFromPlayer();
      fullCover.src = song.url; 
      fullSongTitle.innerText = song.title; 
      if (!song.isAd) {
        fullSongCategory.innerHTML = song.category || '';
      }
      miniCover.src = song.url; 
      miniTitle.innerText = song.title; 
      renderPlayerSuggestions(); 
    }
    
    function updatePlayPauseIcon(){ 
      if (isVideoAd) {
        fullPlayPause.style.display = 'none';
        miniPlayPause.style.display = 'none';
        return;
      }
      fullPlayPause.style.display = 'flex';
      miniPlayPause.style.display = 'flex';
      const icon = isPlaying ? '⏸' : '▶'; 
      fullPlayPause.innerText = icon; 
      miniPlayPause.innerText = icon; 
    }
    
    function nextTrack(){ 
      if (isAdPlaying) return;
      if (!currentPlayQueue.length) return; 
      let newIdx = (currentQueueIndex + 1) % currentPlayQueue.length; 
      currentQueueIndex = newIdx; 
      playSong(currentPlayQueue[newIdx]); 
    }
    
    function prevTrack(){ 
      if (isAdPlaying) return;
      if (!currentPlayQueue.length) return; 
      let newIdx = (currentQueueIndex - 1 + currentPlayQueue.length) % currentPlayQueue.length; 
      currentQueueIndex = newIdx; 
      playSong(currentPlayQueue[newIdx]); 
    }
    
    function togglePlayPause(){ 
      if (isAdPlaying) {
        if (isVideoAd && videoElement) {
          if (videoElement.paused) {
            videoElement.play();
          } else {
            videoElement.pause();
          }
        }
        return;
      }
      isPlaying ? audio.pause() : audio.play(); 
    }
    
    // ==================== SUGERENCIAS ====================
    function renderSuggestions(){ 
      if(isPlaylistsMode || currentSearch.trim() !== '') { 
        suggestionsContainer.innerHTML = ''; 
        return; 
      } 
      const leastPlayed = getLeastPlayedSuggestions(6); 
      if(leastPlayed.length === 0){ suggestionsContainer.innerHTML = ''; return; } 
      let html = `<div class="suggestions-horizontal">`; 
      leastPlayed.forEach(song => { 
        html += `<div class="suggestion-card" data-id="${song.id}"><img src="${song.url}" loading="lazy"><div class="suggestion-info"><div class="suggestion-title">${escapeHtml(song.title)}</div><div class="suggestion-badge">${song.category}</div></div></div>`; 
      }); 
      html += `</div>`; 
      suggestionsContainer.innerHTML = html; 
      document.querySelectorAll('.suggestion-card').forEach(card => { 
        card.addEventListener('click', () => { 
          const id = card.dataset.id; 
          const found = masterSongs.find(s => s.id === id) || allSongs.find(s => s.id === id); 
          if(found){ updateQueueAndMode(); playSong(found); } 
        }); 
      }); 
    }
    
    // ==================== SUGERENCIAS DEL REPRODUCTOR ====================
    let suggestionsHidden = false;
    
    function getPlayerSuggestions(currentSongObj, limit = 6) {
      if (!currentSongObj) return [];
      const sameArtist = masterSongs.filter(s => s.id !== currentSongObj.id && ((s.artist && currentSongObj.artist) && s.artist.toLowerCase() === currentSongObj.artist.toLowerCase()));
      const others = masterSongs.filter(s => s.id !== currentSongObj.id && !sameArtist.includes(s));
      let combined = [...sameArtist, ...others];
      return combined.slice(0, limit);
    }
    
    function renderPlayerSuggestions() {
      const suggestionsTrack = document.getElementById('playerSuggestionsTrack');
      const toggleBtn = document.getElementById('toggleSuggestionsBtn');
      if (!currentSong) { suggestionsTrack.innerHTML = ''; return; }
      const suggestions = getPlayerSuggestions(currentSong);
      if (suggestions.length === 0) { suggestionsTrack.innerHTML = '<div style="color:#5a7fc7; text-align:center; font-size:0.7rem;">No hay sugerencias disponibles</div>'; return; }
      let html = '';
      suggestions.forEach(song => {
        html += `<div class="player-suggestion-item" data-id="${song.id}"><img class="player-suggestion-img" src="${song.url}" loading="lazy"><div class="player-suggestion-info"><div class="player-suggestion-title">${escapeHtml(song.title.length > 12 ? song.title.substring(0,10)+'...' : song.title)}</div></div></div>`;
      });
      suggestionsTrack.innerHTML = html;
      if (suggestionsHidden) { suggestionsTrack.classList.add('hidden-suggestions'); if(toggleBtn) toggleBtn.innerText = 'Mostrar'; } else { suggestionsTrack.classList.remove('hidden-suggestions'); if(toggleBtn) toggleBtn.innerText = 'Ocultar'; }
      document.querySelectorAll('#playerSuggestionsTrack .player-suggestion-item').forEach(item => { item.addEventListener('click', (e) => { e.stopPropagation(); const id = item.getAttribute('data-id'); const found = masterSongs.find(s => s.id === id) || allSongs.find(s => s.id === id); if(found) { updateQueueAndMode(); playSong(found); } }); });
    }
    
    function toggleSuggestions() {
      suggestionsHidden = !suggestionsHidden;
      const track = document.getElementById('playerSuggestionsTrack');
      const toggleBtn = document.getElementById('toggleSuggestionsBtn');
      if (track) {
        if (suggestionsHidden) { track.classList.add('hidden-suggestions'); if(toggleBtn) toggleBtn.innerText = 'Mostrar'; } 
        else { track.classList.remove('hidden-suggestions'); if(toggleBtn) toggleBtn.innerText = 'Ocultar'; }
      }
    }
    
    // ==================== RENDER TOP ARTISTS ====================
    function renderTopArtists() {
      const topArtistsSection = document.getElementById('topArtistsSection');
      const artistsContainer = document.getElementById('artistsContainer');
      const shouldShow = (!isPlaylistsMode && currentSearch.trim() === '');
      if (!shouldShow) { topArtistsSection.classList.add('hidden-artists'); return; }
      topArtistsSection.classList.remove('hidden-artists');
      const topArtists = getTopArtists(6);
      if (topArtists.length === 0 || (topArtists.length === 1 && topArtists[0].plays === 0)) {
        artistsContainer.innerHTML = '<div style="color:#5a7fc7; font-size:0.8rem; padding:0.5rem;">Escucha más canciones para ver tus artistas favoritos 🎧</div>';
        return;
      }
      let html = '';
      topArtists.forEach(artist => {
        html += `<div class="artist-circle-card" data-artist="${escapeHtml(artist.name)}"><img class="artist-avatar" src="${artist.image}" alt="${escapeHtml(artist.name)}" loading="lazy"><div class="artist-name">${escapeHtml(artist.name.length > 15 ? artist.name.substring(0,12)+'...' : artist.name)}</div></div>`;
      });
      artistsContainer.innerHTML = html;
    }
    
    // ==================== RENDER CONTENIDO ====================
    function updateCounterVisibility() { 
      if (isPlaylistsMode || currentSearch.trim() !== '') { 
        counterWrapper.classList.add('hidden-counter'); 
      } else { 
        counterWrapper.classList.remove('hidden-counter'); 
      } 
    }
    
    async function renderContent(){ 
      updateCounterVisibility(); 
      renderTopArtists();
      const items = getActiveListForQueue();
      const isSearching = currentSearch.trim() !== ''; 
      if(isSearching) searchBadge.innerHTML = `🔍 Resultados: "${escapeHtml(currentSearch)}" (${items.length})`; 
      else if(isPlaylistsMode) searchBadge.innerHTML = `❤️ Tus Me gusta · ${items.length} canción${items.length !== 1 ? 'es' : ''}`; 
      else searchBadge.innerHTML = ''; 
      
      if(items.length === 0){ 
        contentContainer.innerHTML = '<div class="no-results"> No se encontraron canciones</div>';
        return; 
      } 
      
      // Obtener contadores de Firestore para todas las canciones (si no están en caché)
      for (let song of items) {
        if (!firestorePlays.has(String(song.id))) {
          const plays = await obtenerReproduccionesFirestore(song.id);
          firestorePlays.set(String(song.id), plays);
        }
      }
      
      let gridClass = 'gallery-grid' + (isSearching ? ' list-view' : ''); 
      let html = `<div class="${gridClass}">`; 
      items.forEach(song => { 
        if(isSearching) {
          html += `<div class="image-card" data-id="${song.id}">
                    <img src="${song.url}" loading="lazy">
                    <div class="card-title">${escapeHtml(song.title)}<span style="font-size:0.7rem; color:#5a7fc7;"> · ${song.category}</span></div>
                  </div>`; 
        } else {
          html += `<div class="image-card" data-id="${song.id}">
                    <img src="${song.url}" loading="lazy">
                    <div class="card-title">${escapeHtml(song.title)}</div>
                  </div>`; 
        }
      }); 
      html += `</div>`; 
      contentContainer.innerHTML = html; 
      document.querySelectorAll('.image-card').forEach(card => { 
        card.addEventListener('click', () => { 
          const id = card.dataset.id; 
          const found = masterSongs.find(s => s.id === id) || allSongs.find(s => s.id === id); 
          if(found){ updateQueueAndMode(); playSong(found); } 
        }); 
      }); 
      triggerBackgroundRefresh(); 
    }
    
    // ==================== FILTROS Y ORDEN ====================
    function updateSortChipsVisibility() { sortChipsContainer.style.display = 'none'; }
    
    function setSortMode(mode) { 
      playlistsSortMode = mode; 
      localStorage.setItem('kerim_playlists_sort_mode', mode); 
      renderContent(); 
      updateQueueAndMode(); 
      document.querySelectorAll('.chip-sort').forEach(chip => chip.classList.remove('active')); 
      const activeChip = document.querySelector(`.chip-sort[data-sort="${mode}"]`); 
      if(activeChip) activeChip.classList.add('active'); 
    }
    
    function initChipsSortEvents() { 
      document.querySelectorAll('.chip-sort').forEach(chip => { 
        chip.addEventListener('click', (e) => { 
          e.stopPropagation(); 
          const mode = chip.getAttribute('data-sort'); 
          setSortMode(mode); 
        }); 
      }); 
      const activeChip = document.querySelector(`.chip-sort[data-sort="${playlistsSortMode}"]`); 
      if(activeChip) activeChip.classList.add('active'); 
      else document.querySelector('.chip-sort[data-sort="default"]')?.classList.add('active'); 
    }
    
    // ==================== EVENTOS ====================
    const homeBtn = document.querySelector('[data-view="home"]');
    
    if (homeBtn) {
      homeBtn.addEventListener('click', () => {
        homeBtn.classList.add('active');
        isPlaylistsMode = false;
        updateSortChipsVisibility();
        renderContent();
        renderSuggestions();
        updateQueueAndMode();
      });
    }
    
    // ==================== AUDIO EVENTOS ====================
    audio.addEventListener('timeupdate',()=>{ 
      if(audio.duration && isFinite(audio.duration) && !audio.paused){ 
        let p = (audio.currentTime/audio.duration)*100; 
        progressFill.style.width = `${p}%`; 
        miniProgressFill.style.width = `${p}%`; 
        currentTimeSpan.innerText = formatTime(audio.currentTime); 
        if(durationSpan.innerText === '0:00') durationSpan.innerText = formatTime(audio.duration); 
      } 
    });
    
    audio.addEventListener('loadedmetadata',()=>{ if(audio.duration) durationSpan.innerText = formatTime(audio.duration); });
    
    audio.addEventListener('play',()=>{ isPlaying=true; updatePlayPauseIcon(); });
    audio.addEventListener('pause',()=>{ isPlaying=false; updatePlayPauseIcon(); });
    
    audio.addEventListener('ended',()=>{ 
      if (isAdPlaying) return;
      nextTrack(); 
    });
    
    // ==================== PROGRESS BAR ====================
    if (progressBarBg) {
      progressBarBg.addEventListener('click',(e)=>{ 
        if(audio.duration){ 
          let rect = progressBarBg.getBoundingClientRect(); 
          let perc = (e.clientX - rect.left)/rect.width; 
          audio.currentTime = perc * audio.duration; 
        } 
      });
    }
    
    // ==================== CONTROLES ====================
    if (fullPlayPause) fullPlayPause.addEventListener('click', togglePlayPause);
    if (fullNext) fullNext.addEventListener('click', nextTrack);
    if (fullPrev) fullPrev.addEventListener('click', prevTrack);
    if (miniPlayPause) miniPlayPause.addEventListener('click', togglePlayPause);
    if (miniNext) miniNext.addEventListener('click', nextTrack);
    if (miniPrev) miniPrev.addEventListener('click', prevTrack);
    
    if (miniPlayerDiv) {
      miniPlayerDiv.addEventListener('click',(e)=>{ if(!e.target.closest('.mini-btn')) fullPlayer.classList.add('show'); });
    }
    if (closePlayerBtn) closePlayerBtn.addEventListener('click',()=>fullPlayer.classList.remove('show'));
    
    if (shuffleBtnPlayer) shuffleBtnPlayer.addEventListener('click', toggleShuffle);
    if (toggleSuggestionsBtnElem) toggleSuggestionsBtnElem.addEventListener('click', toggleSuggestions);
    
    // ==================== WELCOME MODAL ====================
    const welcomeModal = document.getElementById('welcomeModal');
    const acceptBtn = document.getElementById('acceptWelcomeBtn');
    if (localStorage.getItem('kerim_welcome_accepted') === 'true') welcomeModal.classList.add('hidden');
    else { 
      welcomeModal.classList.remove('hidden'); 
      acceptBtn.addEventListener('click', () => { 
        localStorage.setItem('kerim_welcome_accepted', 'true'); 
        welcomeModal.classList.add('hidden'); 
      }); 
    }
    
    // ==================== INICIALIZACIÓN FINAL ====================
    updateUIPlan();
    changeBackgroundRandomly();
    isPlaylistsMode = false; 
    currentSearch = '';
    updateSortChipsVisibility();
    initChipsSortEvents();
    
    renderContent().then(() => {
      renderSuggestions(); 
      updateQueueAndMode(); 
      renderTopArtists();
      if(masterSongs.length) currentSong = masterSongs[0];
      audio.volume = 0.9;
    });
    
    console.log('🎵 Kerim Music+ iniciado correctamente');
    console.log('📊 Contador de reproducciones ÚNICO por usuario con caducidad de 3 meses (Firestore)');
    console.log('⏳ Las reproducciones expiran automáticamente si el usuario no escucha ese tema en 3 meses.');
    
  })();
</script>
</body>
</html>
