<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Botones de redirección</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background-color: #f0f0f0;
        }
        .contenedor {
            display: flex;
            gap: 20px;
            flex-wrap: wrap;
            justify-content: center;
        }
        .boton {
            border: none;
            color: white;
            padding: 15px 32px;
            text-align: center;
            text-decoration: none;
            display: inline-block;
            font-size: 16px;
            margin: 4px 2px;
            cursor: pointer;
            border-radius: 8px;
            transition: background-color 0.3s;
        }
        .boton-azul {
            background-color: #008CBA;
        }
        .boton-azul:hover {
            background-color: #0077a3;
        }
        .boton-verde {
            background-color: #4CAF50;
        }
        .boton-verde:hover {
            background-color: #45a049;
        }
        .boton-naranja {
            background-color: #f39c12;
        }
        .boton-naranja:hover {
            background-color: #d68910;
        }
        .boton-morado {
            background-color: #9b59b6;
        }
        .boton-morado:hover {
            background-color: #8e44ad;
        }
        .boton-rojo {
            background-color: #e74c3c;
        }
        .boton-rojo:hover {
            background-color: #c0392b;
        }
        /* Nuevo estilo para el botón de música */
        .boton-musica {
            background-color: #1abc9c; /* turquesa */
        }
        .boton-musica:hover {
            background-color: #16a085;
        }
    </style>
</head>
<body>
    <div class="contenedor">
        <button class="boton boton-azul" onclick="window.location.href='vistasanilsis.html'">Ir a Vista Sanilsis</button>
        <button class="boton boton-verde" onclick="window.location.href='Jvazquez.html'">Ir a Jvazquez</button>
        <button class="boton boton-naranja" onclick="window.location.href='emsek-album.html'">Ir a Emsek Álbum</button>
        <button class="boton boton-morado" onclick="window.location.href='danyzm-album.html'">Ir a Danyzm Álbum</button>
        <button class="boton boton-rojo" onclick="window.location.href='reporte_de_visitas_msucia.html'">Ir a Reporte de Visitas</button>
        <!-- Nuevo botón para música gratis -->
        <button class="boton boton-musica" onclick="window.location.href='musicakerimmusicgratis.html'">Ir a Música Kerim Gratis</button>
    </div>
</body>
</html>
