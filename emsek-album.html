      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

              var(--bg-image, url('https://i.postimg.cc/XNP1xdB2/IMG-20260207-WA0000.jpg')) no-repeat center center fixed;

  padding-bottom: 80px;
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  align-items: center;
  transition: background 0.8s ease; /* transición suave */
}
    h1 {
      font-size: 1.8rem;
      font-weight: 700;
      background: linear-gradient(135deg, #2b6df6, #1a4fd6);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      margin-bottom: 0.5rem;
      text-align: center;
    }

    /* ===== PORTADA DEL ÁLBUM ===== */
    .album-cover {
      width: 180px;
      max-width: 60vw;
      aspect-ratio: 1 / 1;
      margin: 0.5rem auto 1.5rem auto;
      border-radius: 12px;
      overflow: hidden;
      border: 2px solid #1a2a5e;
      box-shadow: 0 8px 30px rgba(0, 0, 0, 0.6);
      background: #0a0e1a;
    }
    .album-cover img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .playlist {
      width: 100%;
      max-width: 600px;
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
    }
    .track-item {
      background: rgba(17, 26, 51, 0.85);
      border: 1px solid #1a2a5e;
      border-radius: 8px;
      padding: 0.8rem 1rem;
      cursor: pointer;
      transition: all 0.2s ease;
      display: flex;
      align-items: center;
      gap: 1rem;
      backdrop-filter: blur(2px);
    }
    .track-item:hover {
      background: #1a2a5e;
      transform: scale(1.01);
    }
    .track-item img {
      width: 48px;
      height: 48px;
      border-radius: 6px;
      object-fit: cover;
      flex-shrink: 0;
    }
    .track-info {
      flex: 1;
    }
    .track-title {
      font-weight: 600;
      font-size: 0.95rem;
    }
    .track-artist {
      font-size: 0.75rem;
      color: #7a9ad6;
    }

    /* ===== TOAST ===== */
    .toast {
      position: fixed;
      top: 20px;
      left: 50%;
      transform: translateX(-50%) translateY(-80px);
      background: rgba(10, 14, 26, 0.9);
      color: #e8ecf4;
      padding: 0.5rem 1.2rem;
      border-radius: 30px;
      border: 1px solid #2b6df6;
      font-size: 0.85rem;
      font-weight: 500;
      z-index: 9999;
      transition: transform 0.3s ease, opacity 0.3s ease;
      opacity: 0;
      pointer-events: none;
      backdrop-filter: blur(4px);
      box-shadow: 0 4px 20px rgba(0,0,0,0.5);
    }
    .toast.show {
      transform: translateX(-50%) translateY(0);
      opacity: 1;
    }

    /* ===== REPRODUCTOR A PANTALLA COMPLETA ===== */
    .fullscreen-player {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: linear-gradient(180deg, #0d162b 0%, #0a0e1a 100%);
      z-index: 3000;
      display: flex;
      align-items: center;
      justify-content: center;
      opacity: 0;
      visibility: hidden;
      transition: all 0.3s ease;
      padding: 1rem;
    }
    .fullscreen-player.show {
      opacity: 1;
      visibility: visible;
    }
    .player-card {
      max-width: 420px;
      width: 100%;
      text-align: center;
    }
    .player-cover {
      width: min(60vw, 240px);
      margin: 0 auto 1.2rem auto;
      border-radius: 8px;
      overflow: hidden;
      border: 1px solid #1a2a5e;
      background: #0a0e1a;
    }
    .player-cover img {
      width: 100%;
      aspect-ratio: 1/1;
      object-fit: cover;
      display: block;
    }
    .song-details h2 {
      font-size: 1.2rem;
      font-weight: 700;
      margin-bottom: 0.2rem;
    }
    .song-details .category {
      color: #2b6df6;
      font-size: 0.8rem;
      font-weight: 500;
    }
    .fav-shuffle-row {
      display: flex;
      justify-content: center;
      gap: 1.2rem;
      margin: 0.8rem 0;
    }
    .shuffle-btn,
    .repeat-btn {
      background: transparent;
      border: none;
      font-size: 1.3rem;
      color: #5a7fc7;
      cursor: pointer;
      transition: 0.2s;
      padding: 0.2rem 0.4rem;
      border-radius: 6px;
    }
    .shuffle-btn.active {
      color: #2b6df6;
    }
    .repeat-btn.active-all {
      color: #2b6df6;
      background: rgba(43, 109, 246, 0.2);
    }
    .repeat-btn.active-one {
      color: #4ade80;
      background: rgba(74, 222, 128, 0.2);
    }
    .progress-area {
      margin: 1.2rem 0;
    }
    .time-row {
      display: flex;
      justify-content: space-between;
      font-size: 0.7rem;
      color: #5a7fc7;
    }
    .progress-bar-bg {
      width: 100%;
      height: 4px;
      background: #111a33;
      border-radius: 2px;
      cursor: pointer;
    }
    .progress-fill {
      width: 0%;
      height: 100%;
      background: #2b6df6;
      border-radius: 2px;
    }
    .controls {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 2rem;
      margin: 1rem 0;
    }
    .ctrl-btn {
      background: transparent;
      border: none;
      width: 48px;
      height: 48px;
      border-radius: 50%;
      font-size: 1.2rem;
      cursor: pointer;
      color: #5a7fc7;
      transition: 0.2s;
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }
    .ctrl-btn:hover {
      color: #e8ecf4;
      transform: scale(1.05);
    }
    .ctrl-btn.play-pause {
      width: 64px;
      height: 64px;
      background: #1a4fd6;
      color: #fff;
      font-size: 1.8rem;
      box-shadow: 0 0 30px rgba(43, 109, 246, 0.2);
    }
    .ctrl-btn.play-pause:hover {
      background: #2b6df6;
    }
    .close-player {
      position: absolute;
      top: 20px;
      right: 20px;
      background: rgba(10, 14, 26, 0.8);
      border: 1px solid #1a2a5e;
      border-radius: 50%;
      width: 40px;
      height: 40px;
      color: #5a7fc7;
      font-size: 1.2rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: 0.2s;
    }
    .close-player:hover {
      color: #e8ecf4;
      border-color: #2b6df6;
    }

    /* ===== MINI REPRODUCTOR ===== */
    .mini-player {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      background: #0a0e1a;
      border-top: 1px solid #1a2a5e;
      padding: 0.6rem 1rem;
      display: flex;
      align-items: center;
      gap: 12px;
      transform: translateY(100%);
      transition: transform 0.3s ease;
      z-index: 1200;
      cursor: pointer;
    }
    .mini-player.show {
      transform: translateY(0);
    }
    .mini-cover {
      width: 44px;
      height: 44px;
      border-radius: 4px;
      overflow: hidden;
      flex-shrink: 0;
      border: 1px solid #1a2a5e;
    }
    .mini-cover img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    .mini-info {
      flex: 1;
      min-width: 0;
    }
    .mini-title {
      font-weight: 600;
      font-size: 0.85rem;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .mini-controls {
      display: flex;
      gap: 6px;
    }
    .mini-btn {
      background: transparent;
      border: none;
      width: 34px;
      height: 34px;
      border-radius: 50%;
      font-size: 0.9rem;
      cursor: pointer;
      color: #5a7fc7;

    .mini-btn:hover {
      color: #e8ecf4;
    }
    .mini-progress-bg {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 2px;
      background: #111a33;
    }
    .mini-progress-fill {
      width: 0%;
      height: 100%;
      background: #2b6df6;
    }

    /* ===== SUGERENCIAS DENTRO DEL REPRODUCTOR ===== */
    .player-suggestions {

    .player-suggestions-header {

      margin-bottom: 0.5rem;
    }
    .player-suggestions-title {

      font-weight: 600;
      color: #5a7fc7;
      letter-spacing: 0.5px;
    }
    .toggle-suggestions-btn {

      padding: 0.15rem 0.7rem;
      font-size: 0.55rem;

      color: #5a7fc7;
    }
    .player-suggestions-track {
      display: flex;

      background: #111a33;

    .player-suggestion-item {

      overflow: hidden;
      text-overflow: ellipsis;
      color: #e8ecf4;
    }
    .hidden-suggestions {
      display: none !important;
    }
  </style>

  <!-- ========== MÓDULO FIREBASE CON CADUCIDAD DE 3 MESES ========== -->
  <script type="importmap">
    {
      "imports": {
        "firebase/app": "https://www.gstatic.com/firebasejs/9.23.0/firebase-app.js",
        "firebase/firestore": "https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore.js"
      }
    }
  </script>

  <script type="module">
    import { initializeApp } from "firebase/app";
    import {
      getFirestore,
      doc,
      collection,
      getDoc,
      setDoc,
      runTransaction,
      updateDoc
    } from "firebase/firestore";

    const firebaseConfig = {
      apiKey: "AIzaSyC5R9mPw1PQMjYIqWpz5w3W7BvGmZV4tX8",
      authDomain: "kerim-music-a9c46.firebaseapp.com",
      projectId: "kerim-music-a9c46",
      storageBucket: "kerim-music-a9c46.firebasestorage.app",
      messagingSenderId: "103691719997",
      appId: "1:103691719997:web:da58ff98f78f1b632b19cb"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    // ---- CONTADOR GLOBAL DE VISITAS (opcional) ----
    const contadorRef = doc(db, "Radio Muisc", "Kerim Music+");
    const CAMPO_CONTADOR = "total";
    let userId = localStorage.getItem('visitor_id_kerim');
    if (!userId) {
      userId = 'user_' + Date.now() + '_' + Math.random().toString(36).substr(2, 9);
      localStorage.setItem('visitor_id_kerim', userId);
    }
    const userRef = doc(collection(contadorRef, 'usuarios'), userId);

    // ================================================================
    //  NUEVA LÓGICA DE CONTADOR POR CANCIÓN CON CADUCIDAD DE 3 MESES
    // ================================================================

    const TRES_MESES_MS = 3 * 30 * 24 * 60 * 60 * 1000;  // ~ 7.776.000.000 ms

    /**
     * Migra el campo antiguo (array) a objeto con fechas actuales.
     * Se llama una sola vez por usuario si es necesario.
     */
    async function migrarSiEsArray(userData) {
      const historial = userData.canciones_escuchadas;
      if (Array.isArray(historial)) {
        console.log('🔄 Migrando historial de array a objeto para usuario', userId);
        const nuevoMap = {};
        const ahora = Date.now();
        historial.forEach(id => { nuevoMap[id] = ahora; });
        await updateDoc(userRef, { canciones_escuchadas: nuevoMap });
        return nuevoMap;
      }
      return historial || {};
    }

    /**
     * Incrementa la reproducción de una canción para el usuario actual.
     * Solo cuenta si es la primera vez o han pasado más de 3 meses desde la última escucha.
     * Además, limpia automáticamente cualquier otra canción expirada del historial del usuario.
     * @param {string} songId - ID de la canción.
     * @returns {Promise<number|null>} Nuevo total de reproducciones de la canción, o null si error.
     */
    window.incrementarReproduccion = async function(songId) {
      if (!songId) return null;
      try {
        // 1. Asegurar que el usuario existe
        const userSnap = await getDoc(userRef);
        if (!userSnap.exists()) {
          await setDoc(userRef, { 
            fecha: new Date().toISOString(), 
            userAgent: navigator.userAgent.slice(0, 200), 
            canciones_escuchadas: {} 
          });
        }

        // 2. Obtener datos actuales del usuario
        const userData = (await getDoc(userRef)).data() || {};
        let historial = await migrarSiEsArray(userData);

        const ahora = Date.now();
        const fechaExpiracion = ahora - TRES_MESES_MS;

        // 3. Preparar transacción para actualizar usuario y canción(es)
        let resultado = null;

        await runTransaction(db, async (transaction) => {
          // Leer el documento de la canción
          const songRef = doc(db, "Radio Muisc", String(songId));
          const songSnap = await transaction.get(songRef);
          let currentPlays = songSnap.exists() ? songSnap.data().reproducciones || 0 : 0;

          // --- Manejo de la canción actual ---
          const lastPlayed = historial[songId] || 0;
          let incrementar = false;

          if (lastPlayed === 0) {
            // Nunca escuchada → nueva reproducción
            incrementar = true;
          } else if (lastPlayed < fechaExpiracion) {
            // Expiró → se elimina y se vuelve a contar
            incrementar = true;
            // Decrementar el contador porque estaba expirada
            currentPlays = Math.max(0, currentPlays - 1);
            delete historial[songId];
          } else {
            // Dentro de los 3 meses → solo actualizar fecha, no incrementar
            incrementar = false;
          }

          if (incrementar) {
            currentPlays += 1;
            historial[songId] = ahora;
          } else {
            // Solo actualizar timestamp (reinicia el contador de 3 meses)
            historial[songId] = ahora;
          }

          // --- Limpieza de otras canciones expiradas en el historial ---
          const idsAEliminar = [];
          for (const [id, timestamp] of Object.entries(historial)) {
            if (id !== songId && timestamp < fechaExpiracion) {
              idsAEliminar.push(id);
            }
          }

          // Eliminar las expiradas y decrementar sus contadores
          for (const id of idsAEliminar) {
            delete historial[id];
            const ref = doc(db, "Radio Muisc", String(id));
            const snap = await transaction.get(ref);
            if (snap.exists()) {
              const plays = snap.data().reproducciones || 0;
              const nuevo = Math.max(0, plays - 1);
              transaction.update(ref, { reproducciones: nuevo });
            }
          }

          // Actualizar el documento del usuario
          transaction.update(userRef, { canciones_escuchadas: historial });

          // Actualizar el documento de la canción actual
          if (!songSnap.exists()) {
            transaction.set(songRef, { reproducciones: currentPlays });
          } else {
            transaction.update(songRef, { reproducciones: currentPlays });
          }

          resultado = currentPlays;
        });

        console.log(`✅ Reproducción registrada para ${userId} - canción ${songId}: ${resultado}`);
        return resultado;

      } catch (error) {
        console.error("❌ Error en incrementarReproduccion:", error);
        return null;
      }
    };

    /**
     * Obtiene el total de reproducciones de una canción (usuarios únicos en los últimos 3 meses).
     * Lee el campo `reproducciones` del documento de la canción.
     */
    window.obtenerReproducciones = async function(songId) {
      try {
        const ref = doc(db, "Radio Muisc", String(songId));
        const docSnap = await getDoc(ref);
        if (docSnap.exists()) {
          return docSnap.data().reproducciones || 0;
        }
        return 0;
      } catch (error) {
        console.error("Error al obtener reproducciones:", error);
        return 0;
      }
    };

    // ---- Inicialización ----
    document.addEventListener("DOMContentLoaded", () => {
      console.log("✅ Módulo Firebase con caducidad de 3 meses cargado.");
    });
  </script>

        { id: "No fue lo mismo Emsek", title: "No fue los mismo", artist: "Emsek", category: "Rap", url: 'https://www.dropbox.com/scl/fi/hu6726a9yx9z9c5w2ns0w/Emsek.jpg?rlkey=llo70vmyjg4u9jfhnq6g9tvr8&st=dqvk5v66&raw=1', music: 'https://www.dropbox.com/scl/fi/rv1nm22lnovi1phko6ufn/Emsek-No-fue-lo-mismo.wav?rlkey=ojx6h1hpudu8q9v4h0b5ncm77&st=fawt5ksq&raw=1' },
        { id: "Tus errores Emsek", title: "Tus Errores", artist: "Emsek", category: "Rap", url: 'https://www.dropbox.com/scl/fi/hu6726a9yx9z9c5w2ns0w/Emsek.jpg?rlkey=llo70vmyjg4u9jfhnq6g9tvr8&st=dqvk5v66&raw=1', music: 'https://www.dropbox.com/scl/fi/4q3fc1b7dcbm3s0irdriy/Emsek-tus-errores.wav?rlkey=dn1bgzk4im7jwxo5p46osot4h&st=bs9g15gb&raw=1' },
        { id: "Los tiempos cambian Emsek", title: "Los tiempos cambian", artist: "Emsek Ft Charles wed", category: "Rap", url: 'https://www.dropbox.com/scl/fi/hu6726a9yx9z9c5w2ns0w/Emsek.jpg?rlkey=llo70vmyjg4u9jfhnq6g9tvr8&st=dqvk5v66&raw=1', music: 'https://www.dropbox.com/scl/fi/scvt36sujqhsk7abj4q9g/Los-tiempos-cambian-Emsek-ft-Charl-s-weed.wav?rlkey=hbvmut3vj4wyx166y6nv53vi9&st=7ytsyfvs&raw=1' },
        { id: "Musa Emsek", title: "Musa", artist: "Emsek", category: "Rap", url: 'https://www.dropbox.com/scl/fi/hu6726a9yx9z9c5w2ns0w/Emsek.jpg?rlkey=llo70vmyjg4u9jfhnq6g9tvr8&st=dqvk5v66&raw=1', music: 'https://www.dropbox.com/scl/fi/vyrkq3cz1d32v6cbrml99/Mi-mussa-Emsek-HFcompany-Estudios.wav?rlkey=8mzfyjhjbqasi7cvcynku8e29&st=f6rkh9hu&raw=1' },
        { id: "Dada es sencillo Emsek", title: "Nada es sencillo", artist: "Emsek", category: "Rap", url: 'https://www.dropbox.com/scl/fi/hu6726a9yx9z9c5w2ns0w/Emsek.jpg?rlkey=llo70vmyjg4u9jfhnq6g9tvr8&st=dqvk5v66&raw=1', music: 'https://www.dropbox.com/scl/fi/0b08k7lmf6bi3unghwi0o/Nada-es-secillo-Oswaldo.wav?rlkey=00zjb5omwsyc7lpa4epk2dxzx&st=owffemlr&raw=1' },
        { id: "Perdoname Esmek", title: "Perdoname", artist: "Emsek", category: "Rap", url: 'https://www.dropbox.com/scl/fi/hu6726a9yx9z9c5w2ns0w/Emsek.jpg?rlkey=llo70vmyjg4u9jfhnq6g9tvr8&st=dqvk5v66&raw=1', music: 'https://www.dropbox.com/scl/fi/09x3ro2pgjk5uytus7qnf/perdoname-emsek-video-oficial.mp3?rlkey=w5wnge74deqrg9j5cugdgso93&st=l9jqz3s2&raw=1' },
        { id: "Todo acabo Emsek", title: "Todo acabo", artist: "Emsek", category: "Rap", url: 'https://www.dropbox.com/scl/fi/hu6726a9yx9z9c5w2ns0w/Emsek.jpg?rlkey=llo70vmyjg4u9jfhnq6g9tvr8&st=dqvk5v66&raw=1', music: 'https://www.dropbox.com/scl/fi/8rxh1zmz1jnbw3jnyw30u/Todo-se-Acabo-Emsek.wav?rlkey=gdjt2d5ixehg02f66zrmn2oo4&st=11wubvyf&raw=1' },
      ];

      // ==================== ESTADO ====================
      let currentSong = null;
      let queue = [...songs];
      let currentIndex = 0;
      let isPlaying = false;
      let shuffleActive = false;
      let originalQueue = [];
      let repeatMode = 'none'; // 'none' | 'all' | 'one'

      // *** NUEVAS VARIABLES PARA CONTAR SOLO AL FINAL ***
      let pendingCount = false;
      let pendingSongId = null;

      const audio = new Audio();

      // ==================== DOM ====================
      const playlistEl = document.getElementById('playlistContainer');
      const fullPlayer = document.getElementById('fullscreenPlayer');
      const miniPlayer = document.getElementById('miniPlayer');
      const fullCover = document.getElementById('fullCover');
      const fullTitle = document.getElementById('fullSongTitle');
      const fullCategory = document.getElementById('fullSongCategory');
      const fullPlayPause = document.getElementById('fullPlayPauseBtn');
      const fullPrev = document.getElementById('fullPrevBtn');
      const fullNext = document.getElementById('fullNextBtn');
      const fullProgress = document.getElementById('progressFill');
      const miniProgress = document.getElementById('miniProgressFill');
      const currentTimeSpan = document.getElementById('currentTime');
      const durationSpan = document.getElementById('durationTime');
      const progressBarBg = document.getElementById('progressBarBg');
      const miniCover = document.getElementById('miniCover');
      const miniTitle = document.getElementById('miniTitle');
      const miniPlayPause = document.getElementById('miniPlayPauseBtn');
      const miniPrev = document.getElementById('miniPrevBtn');
      const miniNext = document.getElementById('miniNextBtn');
      const shuffleBtn = document.getElementById('shuffleBtnPlayer');
      const repeatBtn = document.getElementById('repeatBtn');
      const closeBtn = document.getElementById('closePlayerBtn');
      const toggleSuggestionsBtn = document.getElementById('toggleSuggestionsBtn');
      const suggestionsTrack = document.getElementById('playerSuggestionsTrack');
      const toast = document.getElementById('toast');
      // Portada principal
      const albumCoverImg = document.getElementById('albumCoverImg');

      // ==================== TOAST ====================
      let toastTimeout = null;
      function showToast(message) {
        toast.textContent = message;
        toast.classList.add('show');
        clearTimeout(toastTimeout);
        toastTimeout = setTimeout(() => {
          toast.classList.remove('show');
        }, 1500);
      }

      // ==================== FUNCIONES ====================
      function shuffleArray(arr) {
        const a = [...arr];
        for (let i = a.length - 1; i > 0; i--) {
          const j = Math.floor(Math.random() * (i + 1));
          [a[i], a[j]] = [a[j], a[i]];
        }
        return a;
      }

      function formatTime(sec) {
        if (isNaN(sec)) return '0:00';
        const m = Math.floor(sec / 60);
        const s = Math.floor(sec % 60);
        return `${m}:${s < 10 ? '0' : ''}${s}`;
      }

      // ===== CONTADOR DE REPRODUCCIONES (Firebase con caducidad) =====
      async function incrementPlayCount(songId) {
        if (window.incrementarReproduccion) {
          const nuevoValor = await window.incrementarReproduccion(songId);
          if (nuevoValor !== null) {
            console.log(`📊 Usuarios únicos de "${currentSong?.title || songId}" (últimos 3 meses): ${nuevoValor}`);
          }
        } else {
          console.warn('Función incrementarReproduccion no disponible');
        }
      }

      // ===== RENDER PLAYLIST =====
      function renderPlaylist() {
        playlistEl.innerHTML = '';
        songs.forEach((song) => {
          const div = document.createElement('div');
          div.className = 'track-item';
          div.innerHTML = `
            <img src="${song.url}" loading="lazy">
            <div class="track-info">
              <div class="track-title">${song.title}</div>
              <div class="track-artist">${song.artist}</div>
            </div>
          `;
          div.addEventListener('click', () => {
            playSong(song);
          });
          playlistEl.appendChild(div);
        });
      }

      // ===== REPRODUCIR CANCIÓN (MODIFICADA) =====
      function playSong(song) {
        if (!song) return;

        // Cancelar cualquier conteo pendiente de la canción anterior (no se completó)
        if (pendingCount) {
          pendingCount = false;
          pendingSongId = null;
        }

        currentSong = song;
        const idx = queue.findIndex(s => s.id === song.id);
        if (idx !== -1) currentIndex = idx;

        // Marcar como pendiente para contar al final
        pendingCount = true;
        pendingSongId = song.id;

        audio.src = song.music;
        audio.play().catch(() => {});
        isPlaying = true;
        updateUI();
        fullPlayer.classList.add('show');
        miniPlayer.classList.add('show');
        renderSuggestions();
      }

      function updateUI() {
        if (!currentSong) return;
        // Actualizar portada principal (fuera del reproductor)
        albumCoverImg.src = currentSong.url;
        // Actualizar portada del reproductor completo
        fullCover.src = currentSong.url;
        fullTitle.textContent = currentSong.title;
        fullCategory.textContent = currentSong.category || '';
        // Actualizar mini reproductor
        miniCover.src = currentSong.url;
        miniTitle.textContent = currentSong.title;
        updatePlayPauseIcon();
        updateRepeatButton();
      }

      function updatePlayPauseIcon() {
        const icon = isPlaying ? '⏸' : '▶';
        fullPlayPause.textContent = icon;
        miniPlayPause.textContent = icon;
      }

      function togglePlayPause() {
        if (!currentSong) return;
        if (isPlaying) {
          audio.pause();
        } else {
          audio.play().catch(() => {});
        }
        isPlaying = !isPlaying;
        updatePlayPauseIcon();
      }

      // ===== SHUFFLE =====
      function toggleShuffle() {
        shuffleActive = !shuffleActive;
        shuffleBtn.classList.toggle('active', shuffleActive);
        if (shuffleActive) {
          if (originalQueue.length === 0) originalQueue = [...queue];
          const current = currentSong;
          const others = queue.filter(s => s.id !== current?.id);
          const shuffled = shuffleArray(others);
          queue = current ? [current, ...shuffled] : shuffled;
          currentIndex = 0;
          showToast('🔀 Aleatoria activada');
        } else {
          if (originalQueue.length) {
            queue = [...originalQueue];
            originalQueue = [];
            if (currentSong) {
              const idx = queue.findIndex(s => s.id === currentSong.id);
              currentIndex = idx !== -1 ? idx : 0;
            }
          }
          showToast('🔀 Aleatoria desactivada');
        }
      }

      // ===== REPEAT =====
      function toggleRepeat() {
        if (repeatMode === 'none') {
          repeatMode = 'all';
          showToast('🔁 Repetir todas');
        } else if (repeatMode === 'all') {
          repeatMode = 'one';
          showToast('🔂 Repetir una');
        } else {
          repeatMode = 'none';
          showToast('🔁 Sin repetición');
        }
        updateRepeatButton();
      }

      function updateRepeatButton() {
        repeatBtn.classList.remove('active-all', 'active-one');
        if (repeatMode === 'all') repeatBtn.classList.add('active-all');
        else if (repeatMode === 'one') repeatBtn.classList.add('active-one');
      }

      // ===== NAVEGACIÓN =====
      function nextTrack() {
        if (!queue.length) return;
        if (shuffleActive) {
          let newIdx;
          do {
            newIdx = Math.floor(Math.random() * queue.length);
          } while (newIdx === currentIndex && queue.length > 1);
          currentIndex = newIdx;
        } else {
          currentIndex = (currentIndex + 1) % queue.length;
        }
        playSong(queue[currentIndex]);
      }

      function prevTrack() {
        if (!queue.length) return;
        currentIndex = (currentIndex - 1 + queue.length) % queue.length;
        playSong(queue[currentIndex]);
      }

      // ===== SUGERENCIAS =====
      function renderSuggestions() {
        if (!currentSong) return;
        const sameArtist = songs.filter(s => s.id !== currentSong.id && s.artist === currentSong.artist);
        const others = songs.filter(s => s.id !== currentSong.id && s.artist !== currentSong.artist);
        const combined = [...sameArtist, ...others].slice(0, 6);
        if (combined.length === 0) {
          suggestionsTrack.innerHTML = '<div style="color:#5a7fc7;font-size:0.7rem;padding:0.3rem;">Sin sugerencias</div>';
          return;
        }
        let html = '';
        combined.forEach(s => {
          html += `
            <div class="player-suggestion-item" data-id="${s.id}">
              <img class="player-suggestion-img" src="${s.url}" loading="lazy">
              <div class="player-suggestion-info">
                <div class="player-suggestion-title">${s.title.length > 10 ? s.title.substring(0,8)+'…' : s.title}</div>
              </div>
            </div>
          `;
        });
        suggestionsTrack.innerHTML = html;
        document.querySelectorAll('.player-suggestion-item').forEach(el => {
          el.addEventListener('click', (e) => {
            e.stopPropagation();
            const id = el.dataset.id;
            const found = songs.find(s => s.id === id);
            if (found) playSong(found);
          });
        });
      }

      let suggestionsHidden = false;
      toggleSuggestionsBtn.addEventListener('click', () => {
        suggestionsHidden = !suggestionsHidden;
        suggestionsTrack.classList.toggle('hidden-suggestions', suggestionsHidden);
        toggleSuggestionsBtn.textContent = suggestionsHidden ? 'Mostrar' : 'Ocultar';
      });

      // ==================== EVENTOS DE AUDIO ====================
      audio.addEventListener('timeupdate', () => {
        if (audio.duration && isFinite(audio.duration) && !audio.paused) {
          const p = (audio.currentTime / audio.duration) * 100;
          fullProgress.style.width = p + '%';
          miniProgress.style.width = p + '%';
          currentTimeSpan.textContent = formatTime(audio.currentTime);
          if (durationSpan.textContent === '0:00') durationSpan.textContent = formatTime(audio.duration);
        }
      });

      audio.addEventListener('loadedmetadata', () => {
        if (audio.duration) durationSpan.textContent = formatTime(audio.duration);
      });

      audio.addEventListener('play', () => {
        isPlaying = true;
        updatePlayPauseIcon();
      });
      audio.addEventListener('pause', () => {
        isPlaying = false;
        updatePlayPauseIcon();
      });

      // ===== COMPORTAMIENTO AL TERMINAR (MODIFICADO) =====
      audio.addEventListener('ended', () => {
        // Si hay un pendiente y coincide con la canción actual, contar la reproducción
        if (pendingCount && pendingSongId === currentSong?.id) {
          const songId = pendingSongId;
          // Contar en Firebase (usuarios únicos con caducidad)
          incrementPlayCount(songId);
          // Reiniciar bandera de pendiente
          pendingCount = false;
          pendingSongId = null;
        }

        // Comportamiento de repetición
        if (repeatMode === 'one') {
          audio.currentTime = 0;
          audio.play().catch(() => {});
        } else if (repeatMode === 'all') {
          nextTrack();
        } else {
          if (currentIndex < queue.length - 1) {
            nextTrack();
          } else {
            isPlaying = false;
            updatePlayPauseIcon();
          }
        }
      });

      // ==================== PROGRESS CLICK ====================
      progressBarBg.addEventListener('click', (e) => {
        if (!audio.duration) return;
        const rect = progressBarBg.getBoundingClientRect();
        const perc = (e.clientX - rect.left) / rect.width;
        audio.currentTime = perc * audio.duration;
      });

      // ==================== CONTROLES ====================
      fullPlayPause.addEventListener('click', togglePlayPause);
      miniPlayPause.addEventListener('click', togglePlayPause);
      fullNext.addEventListener('click', nextTrack);
      miniNext.addEventListener('click', nextTrack);
      fullPrev.addEventListener('click', prevTrack);
      miniPrev.addEventListener('click', prevTrack);
      shuffleBtn.addEventListener('click', toggleShuffle);
      repeatBtn.addEventListener('click', toggleRepeat);
      closeBtn.addEventListener('click', () => fullPlayer.classList.remove('show'));
      miniPlayer.addEventListener('click', (e) => {
        if (!e.target.closest('.mini-btn')) fullPlayer.classList.add('show');
      });

      // ==================== INICIO ====================
      renderPlaylist();
      if (songs.length) {
        currentSong = songs[0];
        queue = [...songs];
        currentIndex = 0;
        updateUI();
      }
      miniPlayer.classList.add('show');

      console.log('🎵 Reproductor con Firebase (caducidad 3 meses) activo.');
      console.log('✅ Las reproducciones solo se cuentan cuando la canción se escucha COMPLETA.');
    })();

    // Generar colores dinámicos basados en la portada (simulación)
    const hue = Math.floor(Math.random() * 360);
    const color1 = `hsl(${hue}, 30%, 8%)`;
    const color2 = `hsl(${(hue + 40) % 360}, 40%, 5%)`;
    document.documentElement.style.setProperty('--overlay-color1', color1);
    document.documentElement.style.setProperty('--overlay-color2', color2);
  </script>

</body>
