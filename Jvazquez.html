<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Reproductor J Vazquez</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet" />
    
    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
    
    <style>
        /* ---------- Reset y base ---------- */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #000000;
            color: #ffffff;
            padding: 1rem;
            overflow-x: hidden;
            position: relative;
        }

        /* ---------- Contenedor principal ---------- */
        .player-container {
            max-width: 480px;
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 1.8rem;
            padding: 0.5rem 0 1.5rem;
            position: relative;
            z-index: 2;
        }

        /* ---------- OVERLAY DE BIENVENIDA CON PARTÍCULAS ---------- */
        #welcomeOverlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.85);
            backdrop-filter: blur(4px);
            -webkit-backdrop-filter: blur(4px);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 9999;
            transition: opacity 0.9s ease, transform 0.9s ease;
            opacity: 1;
            transform: scale(1);
            pointer-events: auto;
        }

        #welcomeOverlay.hidden {
            opacity: 0;
            transform: scale(1.05);
            pointer-events: none;
        }

        /* Canvas de partículas (fondo del overlay) */
        #particlesCanvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
        }

        /* Contenido del overlay (por encima del canvas) */
        .welcome-content {
            position: relative;
            z-index: 1;
            text-align: center;
            animation: welcomePop 1s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
        }

        .welcome-content h1 {
            font-size: 4.5rem;
            font-weight: 700;
            background: linear-gradient(135deg, #00bfff, #1565C0, #00bfff);
            background-size: 200% 200%;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: shimmer 3s ease-in-out infinite alternate;
            letter-spacing: -0.02em;
            margin-bottom: 0.3rem;
            text-shadow: 0 0 40px rgba(21, 101, 192, 0.3);
        }

        .welcome-content p {
            font-size: 1.3rem;
            color: #87ceeb;
            font-weight: 300;
            letter-spacing: 0.3em;
            opacity: 0;
            animation: fadeUp 1s 0.5s forwards;
        }

        .welcome-content .emoji {
            font-size: 3rem;
            display: block;
            margin-top: 0.5rem;
            animation: pulse 1.5s ease-in-out infinite;
        }

        @keyframes welcomePop {
            0% {
                opacity: 0;
                transform: scale(0.8);
            }
            100% {
                opacity: 1;
                transform: scale(1);
            }
        }

        @keyframes shimmer {
            0% {
                background-position: 0% 50%;
            }
            100% {
                background-position: 100% 50%;
            }
        }

        @keyframes fadeUp {
            0% {
                opacity: 0;
                transform: translateY(20px);
            }
            100% {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes pulse {
            0%,
            100% {
                transform: scale(1);
            }
            50% {
                transform: scale(1.2);
            }
        }

        /* ---------- Portada ---------- */
        .cover-wrapper {
            width: 90%;
            aspect-ratio: 1 / 1;
            border-radius: 30px;
            overflow: hidden;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.8);
            transition: opacity 0.5s ease;
            background: #111111;
        }

        .cover-wrapper img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
            transition: opacity 0.4s ease;
        }

        .cover-wrapper.fade img {
            opacity: 0;
        }
        .cover-wrapper img {
            opacity: 1;
        }

        /* ---------- Información ---------- */
        .info {
            text-align: center;
            width: 90%;
            padding: 0 0.2rem;
        }

        .info h2 {
            font-size: 1.6rem;
            font-weight: 700;
            margin-bottom: 0.15rem;
            letter-spacing: -0.02em;
            line-height: 1.2;
        }

        .info .album {
            font-size: 1rem;
            font-weight: 400;
            color: #aaaaaa;
        }

        .info .category {
            font-size: 0.85rem;
            font-weight: 300;
            color: #888888;
            margin-top: 0.1rem;
        }

        /* ---------- Barra de progreso ---------- */
        .progress-section {
            width: 90%;
            display: flex;
            align-items: center;
            gap: 0.8rem;
        }

        .progress-section .time {
            font-size: 0.8rem;
            font-variant-numeric: tabular-nums;
            color: #888888;
            min-width: 3.6rem;
            user-select: none;
        }

        .progress-section .time-right {
            text-align: right;
        }

        input[type="range"] {
            -webkit-appearance: none;
            appearance: none;
            flex: 1;
            height: 4px;
            border-radius: 10px;
            background: #444444;
            outline: none;
            transition: background 0.2s;
            cursor: pointer;
        }

        input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 18px;
            height: 18px;
            border-radius: 50%;
            background: #1565C0;
            cursor: pointer;
            border: 2px solid #ffffff;
            box-shadow: 0 0 12px rgba(21, 101, 192, 0.5);
            transition: 0.15s;
        }

        input[type="range"]::-webkit-slider-thumb:hover {
            transform: scale(1.1);
        }

        input[type="range"]::-moz-range-thumb {
            width: 18px;
            height: 18px;
            border-radius: 50%;
            background: #1565C0;
            cursor: pointer;
            border: 2px solid #ffffff;
        }

        input[type="range"]::-moz-range-track {
            height: 4px;
            background: #444444;
            border-radius: 10px;
        }

        /* ---------- Controles ---------- */
        .controls {
            width: 90%;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 0.6rem;
        }

        .controls-row {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 1.2rem;
            width: 100%;
        }

        .controls button {
            background: transparent;
            border: none;
            color: #1565C0;
            cursor: pointer;
            transition: transform 0.15s ease, opacity 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.8rem;
            padding: 0.4rem;
            touch-action: manipulation;
        }

        .controls button:active {
            transform: scale(0.88);
        }

        .controls button:hover {
            opacity: 0.8;
        }

        .small-btn {
            font-size: 1.4rem;
            padding: 0.3rem;
        }

        .small-btn.active {
            color: #64B5F6;
            text-shadow: 0 0 12px rgba(21, 101, 192, 0.4);
        }

        .play-btn {
            width: 72px;
            height: 72px;
            border-radius: 50%;
            border: 2.5px solid #1565C0;
            background: transparent;
            font-size: 2.6rem;
            color: #1565C0;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background 0.2s, transform 0.15s;
            padding: 0;
            touch-action: manipulation;
        }

        .play-btn:active {
            transform: scale(0.92);
        }

        .play-btn:hover {
            background: rgba(21, 101, 192, 0.1);
        }

        .side-btn {
            font-size: 2rem;
            width: 54px;
            height: 54px;
        }

        /* ---------- Botón "Ver los temas" ---------- */
        .show-tracks-btn {
            width: 60%;
            max-width: 280px;
            padding: 0.9rem 0;
            background: #1565C0;
            border: none;
            border-radius: 60px;
            color: #ffffff;
            font-size: 1.1rem;
            font-weight: 600;
            font-family: 'Inter', sans-serif;
            cursor: pointer;
            transition: background 0.2s, transform 0.15s;
            letter-spacing: 0.02em;
            box-shadow: 0 8px 20px rgba(21, 101, 192, 0.3);
            margin-top: 0.3rem;
            touch-action: manipulation;
        }

        .show-tracks-btn:active {
            transform: scale(0.96);
        }

        .show-tracks-btn:hover {
            background: #1A73E8;
        }

        /* ---------- Contador de visitas personalizado ---------- */
        .visitor-counter {
            width: 90%;
            text-align: center;
            font-size: 0.8rem;
            color: #666666;
            letter-spacing: 0.05em;
            padding-top: 0.5rem;
            border-top: 1px solid #222222;
            margin-top: 0.2rem;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 0.5rem;
            flex-wrap: wrap;
        }

        .visitor-counter .counter-icon {
            font-size: 0.9rem;
        }

        .visitor-counter #contador {
            color: #888888;
            font-weight: 600;
            background: #1a1a1a;
            padding: 0.2rem 1rem;
            border-radius: 20px;
            font-size: 0.8rem;
            display: inline-block;
            min-width: 80px;
        }

        /* ---------- Modal de lista de canciones ---------- */
        .modal-overlay {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 85vh;
            background: #111111;
            border-radius: 30px 30px 0 0;
            box-shadow: 0 -10px 40px rgba(0, 0, 0, 0.8);
            transform: translateY(100%);
            transition: transform 0.4s cubic-bezier(0.22, 1, 0.36, 1);
            z-index: 1000;
            padding: 1.5rem 1.2rem 2rem;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            touch-action: pan-y;
        }

        .modal-overlay.open {
            transform: translateY(0);
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-bottom: 1rem;
            border-bottom: 1px solid #333333;
            flex-shrink: 0;
        }

        .modal-header h3 {
            font-size: 1.3rem;
            font-weight: 600;
            color: #ffffff;
        }

        .modal-header .close-modal {
            background: none;
            border: none;
            color: #aaaaaa;
            font-size: 2rem;
            cursor: pointer;
            transition: transform 0.2s;
            padding: 0.2rem 0.5rem;
            touch-action: manipulation;
        }

        .modal-header .close-modal:active {
            transform: rotate(90deg);
        }

        .modal-list {
            flex: 1;
            overflow-y: auto;
            margin-top: 1rem;
            padding-right: 0.3rem;
            -webkit-overflow-scrolling: touch;
        }

        .modal-list::-webkit-scrollbar {
            width: 4px;
        }
        .modal-list::-webkit-scrollbar-thumb {
            background: #444444;
            border-radius: 10px;
        }

        .modal-list ul {
            list-style: none;
            display: flex;
            flex-direction: column;
            gap: 0.2rem;
        }

        .modal-list li {
            padding: 0.9rem 0.8rem;
            border-radius: 14px;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 0.8rem;
            transition: background 0.2s;
            border: 1px solid transparent;
            color: #dddddd;
            touch-action: manipulation;
        }

        .modal-list li:active {
            background: rgba(255, 255, 255, 0.05);
        }

        .modal-list li.active {
            background: rgba(21, 101, 192, 0.2);
            border-color: #1565C0;
            color: #ffffff;
        }

        .modal-list li .idx {
            color: #666666;
            font-size: 0.8rem;
            min-width: 1.8rem;
            font-weight: 500;
        }

        .modal-list li .title {
            flex: 1;
            font-weight: 400;
            font-size: 0.95rem;
        }

        .modal-list li .album-tag {
            font-size: 0.7rem;
            color: #888888;
            background: #222222;
            padding: 0.15rem 0.7rem;
            border-radius: 30px;
            white-space: nowrap;
        }

        .modal-list li .playing-icon {
            color: #1565C0;
            font-size: 0.9rem;
            margin-left: 0.2rem;
        }

        /* ---------- Ajustes responsive ---------- */
        @media (max-width: 400px) {
            .play-btn {
                width: 64px;
                height: 64px;
                font-size: 2.2rem;
            }
            .side-btn {
                font-size: 1.7rem;
                width: 46px;
                height: 46px;
            }
            .controls-row {
                gap: 0.8rem;
            }
            .info h2 {
                font-size: 1.3rem;
            }
            .show-tracks-btn {
                width: 70%;
                font-size: 1rem;
                padding: 0.8rem 0;
            }
            .modal-overlay {
                height: 80vh;
                padding: 1.2rem 1rem;
            }
            .welcome-content h1 {
                font-size: 3rem;
            }
            .welcome-content p {
                font-size: 1rem;
            }
            .visitor-counter {
                font-size: 0.7rem;
            }
            .visitor-counter #contador {
                font-size: 0.7rem;
                padding: 0.15rem 0.8rem;
                min-width: 60px;
            }
        }

        @media (min-width: 600px) {
            .player-container {
                gap: 2.2rem;
            }
            .play-btn {
                width: 80px;
                height: 80px;
                font-size: 3rem;
            }
            .side-btn {
                width: 60px;
                height: 60px;
                font-size: 2.2rem;
            }
            .show-tracks-btn {
                width: 45%;
                padding: 1rem 0;
                font-size: 1.2rem;
            }
        }
    </style>
</head>
<body>

    <!-- OVERLAY DE BIENVENIDA CON PARTÍCULAS -->
    <div id="welcomeOverlay">
        <canvas id="particlesCanvas"></canvas>
        <div class="welcome-content">
            <h1>J Vazquez</h1>
            <p>Bienvenido</p>
            <span class="emoji">🎵</span>
        </div>
    </div>

    <!-- REPRODUCTOR PRINCIPAL -->
    <div class="player-container">

        <!-- Portada -->
        <div class="cover-wrapper" id="coverWrapper">
            <img id="coverImage" src="https://www.dropbox.com/scl/fi/hu6726a9yx9z9c5w2ns0w/Emsek.jpg?rlkey=llo70vmyjg4u9jfhnq6g9tvr8&st=dqvk5v66&raw=1" alt="Portada" />
        </div>

        <!-- Información -->
        <div class="info">
            <h2 id="songTitle"></h2>
            <div class="album" id="songAlbum"></div>
            <div class="category" id="songCategory"></div>
        </div>

        <!-- Barra de progreso -->
        <div class="progress-section">
            <span class="time" id="currentTime">0:00</span>
            <input type="range" id="progressBar" value="0" min="0" max="100" step="0.1" />
            <span class="time time-right" id="totalDuration">0:00</span>
        </div>

        <!-- Controles -->
        <div class="controls">
            <div class="controls-row">
                <button id="shuffleBtn" class="small-btn" title="Aleatorio">🔀</button>
                <button id="prevBtn" class="side-btn" title="Anterior">⏮</button>
                <button id="playBtn" class="play-btn" title="Reproducir / Pausar">▶</button>
                <button id="nextBtn" class="side-btn" title="Siguiente">⏭</button>
                <button id="repeatBtn" class="small-btn" title="Repetir">🔁</button>
            </div>
        </div>

        <!-- Botón inferior -->
        <button id="showTracksBtn" class="show-tracks-btn">Ver los temas</button>

        <!-- CONTADOR DE VISITAS CON FIREBASE -->
        <div class="visitor-counter">
            <span class="counter-icon">👁️</span>
            <span id="contador">Cargando...</span>
        </div>

    </div>

    <!-- Modal de lista de canciones -->
    <div class="modal-overlay" id="tracksModal">
        <div class="modal-header">
            <h3>🎵 Lista de canciones</h3>
            <button class="close-modal" id="closeModalBtn">✕</button>
        </div>
        <div class="modal-list" id="modalList">
            <ul id="songList"></ul>
        </div>
    </div>

    <!-- Elemento de audio oculto -->
    <audio id="audioPlayer" preload="metadata"></audio>

    <script>
        // --------------------------------------------------------------
        // CONFIGURACIÓN DE FIREBASE
        // --------------------------------------------------------------
        const firebaseConfig = {
            apiKey: "AIzaSyC5R9mPw1PQMjYIqWpz5w3W7BvGmZV4tX8",
            authDomain: "kerim-music-a9c46.firebaseapp.com",
            databaseURL: "https://kerim-music-a9c46-default-rtdb.firebaseio.com",
            projectId: "kerim-music-a9c46",
            storageBucket: "kerim-music-a9c46.firebasestorage.app",
            messagingSenderId: "103691719997",
            appId: "1:103691719997:web:da58ff98f78f1b632b19cb"
        };

        // Inicializar Firebase
        firebase.initializeApp(firebaseConfig);
        const database = firebase.database();

        // --------------------------------------------------------------
        // CONTADOR DE VISITAS CON FIREBASE REALTIME DATABASE
        // --------------------------------------------------------------
        (function() {
            const contadorElement = document.getElementById('contador');
            const pagina = window.location.pathname.split("/").pop().replace(".html", "") || "index";
            const hoy = new Date().toISOString().slice(0,10);
            const clave = "visita_" + pagina + "_" + hoy;

            // Referencia al contador en Firebase
            const counterRef = database.ref('visitantes/' + pagina);

            // Función para actualizar la UI
            function actualizarContador(count) {
                if (contadorElement) {
                    contadorElement.textContent = count + " visitas";
                }
            }

            // Función para obtener el contador actual
            function obtenerContador() {
                counterRef.once('value')
                    .then(snapshot => {
                        const val = snapshot.val() || 0;
                        actualizarContador(val);
                    })
                    .catch(error => {
                        console.error('Error al obtener contador:', error);
                        if (contadorElement) {
                            contadorElement.textContent = "--- visitas";
                        }
                    });
            }

            // Verificar si es una nueva visita hoy (usando localStorage)
            const todayKey = "visita_" + pagina + "_" + hoy;

            if (localStorage.getItem(todayKey) !== hoy) {
                // Primera visita del día - incrementar contador
                localStorage.setItem(todayKey, hoy);

                // Incrementar en Firebase usando transacción para evitar conflictos
                counterRef.transaction((currentValue) => {
                    return (currentValue || 0) + 1;
                }, (error, committed, snapshot) => {
                    if (error) {
                        console.error('Error al incrementar contador:', error);
                        obtenerContador(); // Fallback: obtener el valor actual
                    } else if (committed) {
                        actualizarContador(snapshot.val());
                    }
                });
            } else {
                // Ya visitó hoy - solo mostrar el contador
                obtenerContador();
            }

            // Escuchar cambios en tiempo real (para actualizar si otro usuario visita)
            counterRef.on('value', (snapshot) => {
                const val = snapshot.val() || 0;
                actualizarContador(val);
            });
        })();

        // --------------------------------------------------------------
        // PARTÍCULAS
        // --------------------------------------------------------------
        (function initParticles() {
            const canvas = document.getElementById('particlesCanvas');
            const ctx = canvas.getContext('2d');
            let width, height;
            let particles = [];
            let animationId = null;

            // Configuración
            const PARTICLE_COUNT = 80;
            const CONNECTION_DIST = 150;
            const MAX_SPEED = 0.8;

            function resize() {
                const rect = canvas.parentElement.getBoundingClientRect();
                width = canvas.width = rect.width;
                height = canvas.height = rect.height;
            }

            class Particle {
                constructor() {
                    this.reset();
                }
                reset() {
                    this.x = Math.random() * width;
                    this.y = Math.random() * height;
                    this.vx = (Math.random() - 0.5) * MAX_SPEED * 2;
                    this.vy = (Math.random() - 0.5) * MAX_SPEED * 2;
                    this.radius = Math.random() * 3 + 1.5;
                    this.color = Math.random() > 0.5 ? '#1565C0' : '#64B5F6';
                }
                update() {
                    this.x += this.vx;
                    this.y += this.vy;
                    if (this.x < 0 || this.x > width) this.vx *= -1;
                    if (this.y < 0 || this.y > height) this.vy *= -1;
                }
                draw() {
                    ctx.beginPath();
                    ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
                    ctx.fillStyle = this.color;
                    ctx.fill();
                }
            }

            function init() {
                resize();
                particles = [];
                for (let i = 0; i < PARTICLE_COUNT; i++) {
                    particles.push(new Particle());
                }
                draw();
            }

            function draw() {
                ctx.clearRect(0, 0, width, height);

                // Dibujar partículas
                for (let p of particles) {
                    p.update();
                    p.draw();
                }

                // Dibujar conexiones
                for (let i = 0; i < particles.length; i++) {
                    for (let j = i + 1; j < particles.length; j++) {
                        const dx = particles[i].x - particles[j].x;
                        const dy = particles[i].y - particles[j].y;
                        const dist = Math.sqrt(dx * dx + dy * dy);
                        if (dist < CONNECTION_DIST) {
                            const alpha = 1 - (dist / CONNECTION_DIST);
                            ctx.beginPath();
                            ctx.moveTo(particles[i].x, particles[i].y);
                            ctx.lineTo(particles[j].x, particles[j].y);
                            ctx.strokeStyle = `rgba(21, 101, 192, ${alpha * 0.4})`;
                            ctx.lineWidth = 0.8;
                            ctx.stroke();
                        }
                    }
                }

                animationId = requestAnimationFrame(draw);
            }

            // Iniciar partículas
            init();

            // Reajustar al cambiar tamaño
            window.addEventListener('resize', () => {
                resize();
                // Reiniciar partículas para que se distribuyan bien
                for (let p of particles) {
                    p.x = Math.random() * width;
                    p.y = Math.random() * height;
                }
            });

            // Detener cuando se oculta el overlay
            const overlay = document.getElementById('welcomeOverlay');
            const observer = new MutationObserver(() => {
                if (overlay.classList.contains('hidden')) {
                    if (animationId) {
                        cancelAnimationFrame(animationId);
                        animationId = null;
                    }
                }
            });
            observer.observe(overlay, { attributes: true, attributeFilter: ['class'] });
        })();

        // --------------------------------------------------------------
        // OCULTAR OVERLAY TRAS 4 SEGUNDOS
        // --------------------------------------------------------------
        (function() {
            const overlay = document.getElementById('welcomeOverlay');
            setTimeout(() => {
                overlay.classList.add('hidden');
                setTimeout(() => {
                    overlay.style.display = 'none';
                }, 900);

        // --------------------------------------------------------------
        // DOM REFERENCIAS
        // --------------------------------------------------------------
        const audio = document.getElementById('audioPlayer');
        const coverImg = document.getElementById('coverImage');
        const coverWrapper = document.getElementById('coverWrapper');
        const songTitle = document.getElementById('songTitle');
        const songAlbum = document.getElementById('songAlbum');
        const songCategory = document.getElementById('songCategory');
        const progressBar = document.getElementById('progressBar');
        const currentTimeSpan = document.getElementById('currentTime');
        const totalDurationSpan = document.getElementById('totalDuration');
        const playBtn = document.getElementById('playBtn');
        const prevBtn = document.getElementById('prevBtn');
        const nextBtn = document.getElementById('nextBtn');
        const shuffleBtn = document.getElementById('shuffleBtn');
        const repeatBtn = document.getElementById('repeatBtn');
        const showTracksBtn = document.getElementById('showTracksBtn');
        const tracksModal = document.getElementById('tracksModal');
        const closeModalBtn = document.getElementById('closeModalBtn');
        const songListEl = document.getElementById('songList');

        // --------------------------------------------------------------
        // ESTADO
        // --------------------------------------------------------------
        let songs = emsekSongs;
        let currentIndex = 0;
        let isPlaying = false;
        let isShuffle = false;
        let repeatMode = 'off';

        // --------------------------------------------------------------
        // FUNCIONES AUXILIARES
        // --------------------------------------------------------------
        function formatTime(seconds) {
            if (isNaN(seconds) || seconds === Infinity) return '0:00';
            const m = Math.floor(seconds / 60);
            const s = Math.floor(seconds % 60);
            return `${m}:${s.toString().padStart(2, '0')}`;
        }

        function getSong(index) {
            return songs[index] || null;
        }

        // --------------------------------------------------------------
        // ACTUALIZAR UI
        // --------------------------------------------------------------
        function loadSong(index, autoPlay = false) {
            const song = getSong(index);
            if (!song) return;

            currentIndex = index;

            coverWrapper.classList.add('fade');
            setTimeout(() => {
                coverImg.src = song.url;
                coverWrapper.classList.remove('fade');
            }, 300);

            songTitle.textContent = song.title;
            songAlbum.textContent = song.album;
            songCategory.textContent = song.category;

            audio.src = song.music;
            audio.load();

            progressBar.value = 0;
            currentTimeSpan.textContent = '0:00';
            totalDurationSpan.textContent = '0:00';

            updateActiveInModal();

            if (autoPlay) {
                audio.play().catch(() => {});
                isPlaying = true;
                updatePlayButton();
            } else {
                audio.pause();
                isPlaying = false;
                updatePlayButton();
            }
        }

        function updatePlayButton() {
            playBtn.textContent = isPlaying ? '⏸' : '▶';
            updateActiveInModal();
        }

        function updateShuffleButton() {
            shuffleBtn.classList.toggle('active', isShuffle);
        }

        function updateRepeatButton() {
            repeatBtn.classList.remove('active');
            if (repeatMode === 'one') {
                repeatBtn.textContent = '🔂';
                repeatBtn.classList.add('active');
            } else if (repeatMode === 'all') {
                repeatBtn.textContent = '🔁';
                repeatBtn.classList.add('active');
            } else {
                repeatBtn.textContent = '🔁';
            }
        }

        function updateActiveInModal() {
            const items = songListEl.querySelectorAll('li');
            items.forEach((li, idx) => {
                li.classList.toggle('active', idx === currentIndex);
                const icon = li.querySelector('.playing-icon');
                if (idx === currentIndex && isPlaying) {
                    icon.textContent = '▶';
                } else if (idx === currentIndex && !isPlaying) {
                    icon.textContent = '⏸';
                } else {
                    icon.textContent = '';
                }
            });
        }

        // --------------------------------------------------------------
        // CONTROLES
        // --------------------------------------------------------------
        function togglePlay() {
            if (audio.paused) {
                if (audio.src === '') {
                    loadSong(currentIndex, true);
                    return;
                }
                audio.play().catch(() => {});
                isPlaying = true;
            } else {
                audio.pause();
                isPlaying = false;
            }
            updatePlayButton();
        }

        function getNextIndex() {
            if (isShuffle) {
                let idx;
                do {
                    idx = Math.floor(Math.random() * songs.length);
                } while (idx === currentIndex && songs.length > 1);
                return idx;
            } else {
                return (currentIndex + 1) % songs.length;
            }
        }

        function getPrevIndex() {
            if (isShuffle) {
                let idx;
                do {
                    idx = Math.floor(Math.random() * songs.length);
                } while (idx === currentIndex && songs.length > 1);
                return idx;
            } else {
                return (currentIndex - 1 + songs.length) % songs.length;
            }
        }

        function nextSong() {
            const nextIdx = getNextIndex();
            loadSong(nextIdx, true);
        }

        function prevSong() {
            const prevIdx = getPrevIndex();
            loadSong(prevIdx, true);
        }

        function onSongEnded() {
            if (repeatMode === 'one') {
                audio.currentTime = 0;
                audio.play().catch(() => {});
                isPlaying = true;
                updatePlayButton();
                return;
            } else if (repeatMode === 'all') {
                const nextIdx = getNextIndex();
                loadSong(nextIdx, true);
                return;
            } else {
                const nextIdx = getNextIndex();
                if (nextIdx !== currentIndex || songs.length > 1) {
                    loadSong(nextIdx, true);
                } else {
                    audio.pause();
                    audio.currentTime = 0;
                    isPlaying = false;
                    updatePlayButton();
                    progressBar.value = 0;
                    currentTimeSpan.textContent = '0:00';
                }
            }
        }

        function updateProgress() {
            if (audio.duration && !isNaN(audio.duration)) {
                const percent = (audio.currentTime / audio.duration) * 100;
                progressBar.value = percent;
                currentTimeSpan.textContent = formatTime(audio.currentTime);
                totalDurationSpan.textContent = formatTime(audio.duration);
            } else {
                totalDurationSpan.textContent = '0:00';
            }
        }

        function seekTo(value) {
            if (audio.duration && !isNaN(audio.duration)) {
                const time = (value / 100) * audio.duration;
                audio.currentTime = time;
            }
        }

        // --------------------------------------------------------------
        // RENDERIZAR LISTA EN MODAL
        // --------------------------------------------------------------
        function renderPlaylist() {
            songListEl.innerHTML = '';
            songs.forEach((song, idx) => {
                const li = document.createElement('li');
                li.dataset.index = idx;

                const idxSpan = document.createElement('span');
                idxSpan.className = 'idx';
                idxSpan.textContent = (idx + 1).toString().padStart(2, '0');

                const titleSpan = document.createElement('span');
                titleSpan.className = 'title';
                titleSpan.textContent = song.title;

                const albumSpan = document.createElement('span');
                albumSpan.className = 'album-tag';
                albumSpan.textContent = song.album;

                const iconSpan = document.createElement('span');
                iconSpan.className = 'playing-icon';
                iconSpan.textContent = '';

                li.appendChild(idxSpan);
                li.appendChild(titleSpan);
                li.appendChild(albumSpan);
                li.appendChild(iconSpan);

                li.addEventListener('click', () => {
                    if (idx === currentIndex) {
                        togglePlay();
                    } else {
                        loadSong(idx, true);
                    }
                });

                songListEl.appendChild(li);
            });
            updateActiveInModal();
        }

        // --------------------------------------------------------------
        // MODAL
        // --------------------------------------------------------------
        function toggleModal(open) {
            if (open) {
                tracksModal.classList.add('open');
            } else {
                tracksModal.classList.remove('open');
            }
        }

        // --------------------------------------------------------------
        // EVENTOS
        // --------------------------------------------------------------
        playBtn.addEventListener('click', togglePlay);
        prevBtn.addEventListener('click', prevSong);
        nextBtn.addEventListener('click', nextSong);

        shuffleBtn.addEventListener('click', () => {
            isShuffle = !isShuffle;
            updateShuffleButton();
        });

        repeatBtn.addEventListener('click', () => {
            if (repeatMode === 'off') repeatMode = 'one';
            else if (repeatMode === 'one') repeatMode = 'all';
            else repeatMode = 'off';
            updateRepeatButton();
        });

        progressBar.addEventListener('input', (e) => {
            const val = parseFloat(e.target.value);
            seekTo(val);
            if (audio.duration && !isNaN(audio.duration)) {
                const time = (val / 100) * audio.duration;
                currentTimeSpan.textContent = formatTime(time);
            }
        });

        audio.addEventListener('timeupdate', updateProgress);
        audio.addEventListener('ended', onSongEnded);
        audio.addEventListener('loadedmetadata', () => {
            totalDurationSpan.textContent = formatTime(audio.duration);
        });

        document.addEventListener('keydown', (e) => {
            if (e.target.tagName === 'INPUT') return;
            if (e.code === 'Space') {
                e.preventDefault();
                togglePlay();
            }
        });

        showTracksBtn.addEventListener('click', () => {
            toggleModal(true);
        });

        closeModalBtn.addEventListener('click', () => {
            toggleModal(false);
        });

        tracksModal.addEventListener('click', (e) => {
            if (e.target === tracksModal) {
                toggleModal(false);
            }
        });

        let startY = 0;
        tracksModal.addEventListener('touchstart', (e) => {
            startY = e.touches[0].clientY;
        }, { passive: true });

        tracksModal.addEventListener('touchmove', (e) => {
            const deltaY = e.touches[0].clientY - startY;
            if (deltaY > 80 && tracksModal.classList.contains('open')) {
                toggleModal(false);
            }
        }, { passive: true });

        // --------------------------------------------------------------
        // INICIALIZAR
        // --------------------------------------------------------------
        renderPlaylist();
        loadSong(0, false);
        updateShuffleButton();
        updateRepeatButton();
    </script>
